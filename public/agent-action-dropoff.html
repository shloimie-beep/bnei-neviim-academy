<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Action Drop-off</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;750&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/platform-workspaces.css">

<body>
  <div class="platform-shell">
    <aside class="platform-sidebar">
      <div class="platform-brand">
        <strong>Super Admin</strong>

      <nav class="workspace-switcher" aria-label="Workspace switcher">

        <a href="/operations/school">BNA <span>School</span></a>
        <a href="/operations/workspaces/one-time">One Time <span>Connector</span></a>

        <a href="/operations/agent-actions">Agent Actions</a>
        <a href="/operations/agent-review">Agent Review</a>

      <header class="platform-header">
        <div>
          <p class="platform-kicker">Save and read back</p>
          <h1>Agent Action Drop-off</h1>
          <p>Save partial or completed work. Completed work is verified only after readback succeeds.</p>

        <a class="button" href="/operations/agent-actions">Queue</a>

  <script src="/js/agent-action-dropoff.js"></script>
