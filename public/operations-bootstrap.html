<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNA Operations</title>
    <script>
        const operationsSource = new URLSearchParams(window.location.search).get('source');
        const operationsSourceReadModes = ['split-source', 'codex-source'];
        if (window.location.pathname === '/operations.html' && !operationsSourceReadModes.includes(operationsSource)) {
            const redirectParams = new URLSearchParams(window.location.search);
            redirectParams.delete('source');
            const redirectQuery = redirectParams.toString();
            window.location.replace(`/operations${redirectQuery ? `?${redirectQuery}` : ''}${window.location.hash || ''}`);
        }
    </script>
    <meta name="theme-color" content="#1e3a5f">
    <link rel="manifest" href="/operations-manifest.json">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" type="image/png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/crm-core.css">
</head>
