<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BNA Agent Review Hub</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --panel: #ffffff;
      --ink: #18202f;
      --muted: #667084;
      --line: #d8deea;
      --blue: #1768b8;
      --green: #1f7a4d;
      --amber: #9f6400;
      --red: #aa2c2c;
      --shadow: 0 18px 42px rgba(35, 45, 70, 0.11);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      padding: 22px clamp(16px, 4vw, 42px);
      border-bottom: 1px solid var(--line);
      background: #ffffff;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    header h1 {
      margin: 0;
      font-size: 1.35rem;
      line-height: 1.2;
      letter-spacing: 0;
    }
    header p { margin: 6px 0 0; color: var(--muted); max-width: 980px; }
    main {
      width: min(1240px, calc(100% - 28px));
      margin: 22px auto 42px;
      display: grid;
      gap: 18px;
    }
    .band, .card, .result-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .band {
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fbfcff;
      min-width: 0;
    }
    .metric span { display: block; color: var(--muted); font-size: 0.78rem; }
    .metric strong { display: block; margin-top: 4px; font-size: 1rem; overflow-wrap: anywhere; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .card { padding: 15px; display: grid; gap: 10px; }
    .card h2 { margin: 0; font-size: 1.05rem; letter-spacing: 0; }
    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 0.86rem;
      color: var(--muted);
    }
    .meta div { min-width: 0; }
    .meta strong {
      display: block;
      color: var(--ink);
      font-weight: 650;
      overflow-wrap: anywhere;
    }
    .list {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 0.86rem;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button, .button {
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--ink);
      padding: 9px 11px;
      min-height: 38px;
      border-radius: 8px;
      font-weight: 650;
      text-decoration: none;
      cursor: pointer;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    button.primary, .button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .status {
      font-size: 0.84rem;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .timer {
      font-variant-numeric: tabular-nums;
      color: var(--amber);
      font-weight: 700;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      border: 1px solid var(--line);
      background: #f4f7fb;
      color: var(--muted);
    }
    .pill.ok { color: var(--green); border-color: #b8dcc9; background: #eef8f2; }
    .pill.partial { color: var(--amber); border-color: #ecd49f; background: #fff8e9; }
    .pill.blocked { color: var(--red); border-color: #e9b8b8; background: #fff0f0; }
    .result-panel { padding: 16px; display: grid; gap: 12px; }
    .form-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    label { display: grid; gap: 5px; color: var(--muted); font-size: 0.82rem; font-weight: 650; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      font: inherit;
      color: var(--ink);
      background: #fff;
    }
    textarea { min-height: 110px; resize: vertical; }
    .wide { grid-column: 1 / -1; }
    .prompt-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .prompt-card {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      min-width: 0;
    }
    .prompt-card h3 { margin: 0; font-size: 0.98rem; letter-spacing: 0; }
    .prompt-card small { color: var(--muted); overflow-wrap: anywhere; }
    @media (max-width: 960px) {
      .band, .grid, .prompt-grid { grid-template-columns: 1fr 1fr; }
      .form-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 620px) {
      header { position: static; }
      .band, .grid, .prompt-grid, .form-grid { grid-template-columns: 1fr; }
      .meta { grid-template-columns: 1fr; }
      button, .button { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Agent Review Hub</h1>
    <p>Owner-authenticated review entry for Issue #24. Sessions are short-lived, role-scoped, sequential, and auditable.</p>
  </header>
  <main>
    <section class="band" id="summaryBand" aria-live="polite"></section>
    <section class="grid" id="contextGrid" aria-label="Review contexts"></section>
    <section class="result-panel">
      <h2>Submit Agent Review Result</h2>
      <form id="resultForm">
        <div class="form-grid">
          <label>Context<select name="context_key" id="resultContext"></select></label>
          <label>Requirement<input name="requirement_id" value="REQ-20260626-003"></label>
          <label>Status<select name="status"><option value="pass">pass</option><option value="fail">fail</option><option value="blocked">blocked</option><option value="needs_review">needs_review</option></select></label>
          <label>Severity<select name="severity"><option value="none">none</option><option value="low">low</option><option value="medium">medium</option><option value="high">high</option><option value="critical">critical</option></select></label>
          <label class="wide">Summary<textarea name="summary" placeholder="Redacted Agent Mode result summary"></textarea></label>
          <label class="wide">Evidence<textarea name="evidence" placeholder="Routes, screenshots, DOM proof, typed action/readback IDs"></textarea></label>
          <label class="wide">Suggested correction<textarea name="suggested_correction" placeholder="Exact repair or none"></textarea></label>
          <label class="wide">Idempotency key<input name="idempotency_key" placeholder="prompt-key:agent-run-id"></label>
        </div>
        <div class="actions" style="margin-top:10px">
          <button class="primary" type="submit" data-action-id="ACTION-AGENT-REVIEW-SUBMIT-RESULT">Submit Result</button>
          <span class="status" id="resultStatus"></span>
        </div>
      </form>
    </section>
    <section class="result-panel">
      <h2>Prompt Pack</h2>
      <div class="prompt-grid" id="promptGrid"></div>
    </section>
  </main>
  <script src="/js/app-select.js"></script>
  <script>
    const state = { csrf: '', contexts: [], prompts: [] };
    const api = async (path, options = {}) => {
      const response = await fetch(path, {
        ...options,
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `Request failed: ${response.status}`);
      return data;
    };
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    const pillTone = (status = '') => /pass|processed|confirmed/i.test(status) ? 'ok' : /partial|unknown|needs/i.test(status) ? 'partial' : /block|fail|error|missing/i.test(status) ? 'blocked' : '';
    const terminalPromptStates = new Set(['saved_readback_verified', 'result_saved', 'blocked_saved', 'blocked', 'failed', 'failed_save_paths_exhausted', 'repair_created', 'rerun_required']);
    function workflowLabel(prompt = {}) {
      const stateName = prompt.workflow_state || prompt.status || 'not_started';
      return String(stateName).replace(/_/g, ' ');
    }
    function elapsedLabel(startedAt = '') {
      const started = Date.parse(startedAt || '');
      if (!Number.isFinite(started)) return '';
      const seconds = Math.max(0, Math.floor((Date.now() - started) / 1000));
      const minutes = Math.floor(seconds / 60);
      const remainder = seconds % 60;
      return `${minutes}:${String(remainder).padStart(2, '0')}`;
    }
    function refreshPromptTimers() {
      state.prompts.forEach((prompt) => {
        const timer = document.getElementById(`prompt-timer-${prompt.key}`);
        if (!timer) return;
        const isTerminal = terminalPromptStates.has(prompt.workflow_state || prompt.status);
        timer.textContent = prompt.started_at && !isTerminal ? `Started ${elapsedLabel(prompt.started_at)} ago` : '';
      });
    }

    function renderSummary(data) {
      const trace = data.newest_recording_trace || {};
      document.getElementById('summaryBand').innerHTML = [
        ['Owner', data.owner?.role || 'unknown'],
        ['Session TTL', `${data.session_ttl_minutes || 12} minutes`],
        ['Review model', data.sequential_session_model ? 'sequential scoped sessions' : 'parallel not enabled'],
        ['Recording trace', `${trace.status || 'UNKNOWN'} ${trace.selected_job ? `/ ${trace.selected_job}` : ''}`],
      ].map(([label, value]) => `<div class="metric"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`).join('');
    }

    function renderContexts() {
      document.getElementById('contextGrid').innerHTML = state.contexts.map((context) => `
        <article class="card" data-agent-review-context="${esc(context.key)}">
          <div class="actions" style="justify-content:space-between">
            <h2>${esc(context.label)}</h2>
            <span class="pill">${esc(context.context_type)}</span>
          </div>
          <div class="meta">
            <div><span>Role</span><strong>${esc(context.role)}</strong></div>
            <div><span>Workspace</span><strong>${esc(context.workspace_key)}</strong></div>
            <div><span>Project</span><strong>${esc(context.project_key || 'none')}</strong></div>
            <div><span>Helper</span><strong>${esc(context.helper_surface)}</strong></div>
            <div><span>Route</span><strong>${esc(context.target_route)}</strong></div>
            <div><span>Expires</span><strong>${esc(context.session_ttl_minutes)} min</strong></div>
          </div>
          <ul class="list">${(context.permitted_actions || []).slice(0, 3).map((item) => `<li>${esc(item)}</li>`).join('')}</ul>
          <ul class="list">${(context.prohibited_actions || []).slice(0, 3).map((item) => `<li>${esc(item)}</li>`).join('')}</ul>
          <div class="actions">
            <button class="primary" type="button" data-action-id="ACTION-AGENT-REVIEW-OPEN-CONTEXT" onclick="openContext('${esc(context.key)}')">Open review context</button>
            <a class="button" href="${esc(context.target_url)}" target="_blank" rel="noopener" data-action-id="ACTION-AGENT-REVIEW-OPEN-TARGET">Target route</a>
          </div>
          <div class="status" id="status-${esc(context.key)}"></div>
        </article>
      `).join('');
      document.getElementById('resultContext').innerHTML = state.contexts.map((context) => `<option value="${esc(context.key)}">${esc(context.label)}</option>`).join('');
    }

    function renderPrompts() {
      document.getElementById('promptGrid').innerHTML = state.prompts.map((prompt) => `
        <article class="prompt-card" data-prompt-key="${esc(prompt.key)}">
          <div class="actions" style="justify-content:space-between">
            <h3>${esc(prompt.title)}</h3>
            <span class="pill ${pillTone(prompt.workflow_state || prompt.status)}" id="prompt-status-${esc(prompt.key)}">${esc(workflowLabel(prompt))}</span>
          </div>
          <small>${esc(prompt.requirement_id)} / ${esc(prompt.key)}</small>
          <small>Start/result: <span id="prompt-result-${esc(prompt.key)}">${esc(prompt.last_result_ref || 'not started')}</span></small>
          <small class="timer" id="prompt-timer-${esc(prompt.key)}">${esc(prompt.started_at && !terminalPromptStates.has(prompt.workflow_state || prompt.status) ? `Started ${elapsedLabel(prompt.started_at)} ago` : '')}</small>
          <small>Drop-off: ${esc(prompt.dropoff_url)}</small>
          <div class="actions">
            <button type="button" onclick="startPromptAudit('${esc(prompt.key)}')" data-action-id="ACTION-AGENT-REVIEW-START-AUDIT">Start Audit</button>
            <button type="button" onclick="copyPrompt('${esc(prompt.key)}')" data-action-id="ACTION-AGENT-REVIEW-COPY-PROMPT">Copy Agent Prompt</button>
            <button type="button" onclick="openPromptContext('${esc(prompt.key)}')" data-action-id="ACTION-AGENT-REVIEW-OPEN-CONTEXT">Open context</button>
            <a class="button primary" href="${esc(prompt.dropoff_url)}" target="_blank" rel="noopener" data-action-id="ACTION-AGENT-REVIEW-OPEN-DROPOFF">Open drop-off</a>
            <button type="button" onclick="markPromptBlocked('${esc(prompt.key)}')" data-action-id="ACTION-AGENT-REVIEW-MARK-BLOCKED">Mark blocked</button>
            <a class="button" href="${esc(prompt.path)}" target="_blank" rel="noopener" data-action-id="ACTION-AGENT-REVIEW-PROMPT-OPEN">Prompt file</a>
            ${prompt.last_result_url ? `<a class="button" href="${esc(prompt.last_result_url)}" target="_blank" rel="noopener" data-action-id="ACTION-AGENT-REVIEW-VIEW-RESULT">View saved result</a>` : ''}
            ${prompt.rerun_required ? `<a class="button" href="${esc(prompt.dropoff_url)}&rerun=1" data-action-id="ACTION-AGENT-REVIEW-RERUN-PROMPT">Rerun after repair</a>` : ''}
          </div>
          <div class="status" id="prompt-action-${esc(prompt.key)}">${prompt.last_result_ref ? `Last saved ${esc(prompt.last_result_ref)}` : 'Result pending.'}</div>
        </article>
      `).join('');
      refreshPromptTimers();
    }

    async function openContext(contextKey) {
      const status = document.getElementById(`status-${contextKey}`);
      status.textContent = 'Creating scoped session...';
      try {
        const data = await api('/api/bna/agent-review/sessions', {
          method: 'POST',
          headers: { 'X-BNA-Agent-Review-CSRF': state.csrf },
          body: JSON.stringify({ context_key: contextKey }),
        });
        status.innerHTML = `Ready until ${esc(data.session.expires_at)}. <a href="${esc(data.session.review_url)}" target="_blank" rel="noopener">Open session</a>`;
        window.open(data.session.review_url, '_blank', 'noopener');
      } catch (error) {
        status.textContent = error.message || 'Could not create session.';
      }
    }

    function promptByKey(promptKey) {
      return state.prompts.find((prompt) => prompt.key === promptKey) || null;
    }

    function updatePromptFromStart(promptKey, data = {}) {
      const prompt = promptByKey(promptKey);
      if (!prompt) return;
      prompt.workflow_state = data.workflow_state || 'in_progress';
      prompt.status = data.status || 'in_progress';
      prompt.started_at = data.started_at || prompt.started_at || new Date().toISOString();
      prompt.started_by = data.started_by || prompt.started_by || '';
      prompt.last_result_ref = data.result_ref || prompt.last_result_ref || null;
      prompt.last_result_url = data.readback_url || prompt.last_result_url || null;
      prompt.idempotency_key = data.idempotency_key || prompt.idempotency_key;
      prompt.copy_metadata = {
        ...(prompt.copy_metadata || {}),
        current_workflow_state: prompt.workflow_state,
        current_result_ref: prompt.last_result_ref,
        started_at: prompt.started_at,
      };
      const status = document.getElementById(`prompt-status-${promptKey}`);
      const result = document.getElementById(`prompt-result-${promptKey}`);
      if (status) {
        status.textContent = workflowLabel(prompt);
        status.className = `pill ${pillTone(prompt.workflow_state || prompt.status)}`;
      }
      if (result) result.textContent = prompt.last_result_ref || 'not started';
      refreshPromptTimers();
    }

    async function startPromptAudit(promptKey, options = {}) {
      const prompt = promptByKey(promptKey);
      const status = document.getElementById(`prompt-action-${promptKey}`);
      if (!prompt) return null;
      if (terminalPromptStates.has(prompt.workflow_state || prompt.status) && prompt.last_result_ref) {
        if (!options.quiet && status) status.textContent = `Already saved as ${prompt.last_result_ref}.`;
        return {
          result_ref: prompt.last_result_ref,
          idempotency_key: prompt.idempotency_key,
          started_at: prompt.started_at,
          workflow_state: prompt.workflow_state,
          readback_url: prompt.last_result_url,
        };
      }
      if (prompt.workflow_state === 'in_progress' && prompt.last_result_ref) {
        if (!options.quiet && status) status.textContent = `Audit already started as ${prompt.last_result_ref}.`;
        return {
          result_ref: prompt.last_result_ref,
          idempotency_key: prompt.idempotency_key,
          started_at: prompt.started_at,
          workflow_state: prompt.workflow_state,
          readback_url: prompt.last_result_url,
        };
      }
      if (status && !options.quiet) status.textContent = 'Starting audit...';
      const data = await api('/api/bna/agent-review/prompts/start', {
        method: 'POST',
        headers: { 'X-BNA-Agent-Review-CSRF': state.csrf },
        body: JSON.stringify({
          prompt_key: prompt.key,
          requirement_id: prompt.requirement_id,
          context_key: prompt.context_keys?.[0] || '',
          idempotency_key: prompt.idempotency_key,
        }),
      });
      updatePromptFromStart(promptKey, data);
      if (status && !options.quiet) {
        status.innerHTML = `Started ${esc(data.result_ref)}. <a href="${esc(data.readback_url || data.operations_url)}" target="_blank" rel="noopener">Readback</a>`;
      }
      return data;
    }

    async function copyPrompt(promptKey) {
      const prompt = promptByKey(promptKey);
      const status = document.getElementById(`prompt-action-${promptKey}`);
      if (!prompt) return;
      status.textContent = 'Starting audit before copy...';
      try {
        const start = await startPromptAudit(promptKey, { quiet: true });
        const response = await fetch(prompt.path, { credentials: 'same-origin' });
        const text = await response.text();
        const current = promptByKey(promptKey) || prompt;
        const startedPreamble = [
          '# Current Agent Review Started State',
          '',
          `Start Audit result/draft ID: ${start?.result_ref || current.last_result_ref || 'not available'}`,
          `Workflow state: ${start?.workflow_state || current.workflow_state || 'in_progress'}`,
          `Started at: ${start?.started_at || current.started_at || 'recorded in hub'}`,
          `Prompt key: ${current.key}`,
          `Idempotency key: ${start?.idempotency_key || current.idempotency_key}`,
          `Readback URL: ${start?.readback_url || current.last_result_url || 'open the saved readback from the hub after saving'}`,
          '',
          'Use this same idempotency key when saving PASS, FAIL, or BLOCKED so the started AGR record becomes the final readback record.',
          '',
        ].join('\n');
        await navigator.clipboard?.writeText(`${startedPreamble}${text}`);
        const pill = document.getElementById(`prompt-status-${promptKey}`);
        if (pill && current.workflow_state !== 'in_progress') pill.textContent = workflowLabel(current);
        status.textContent = `Copied after Start Audit with idempotency key ${start?.idempotency_key || current.idempotency_key}.`;
      } catch (error) {
        status.textContent = error.message || 'Could not copy prompt.';
      }
    }

    function openPromptContext(promptKey) {
      const prompt = promptByKey(promptKey);
      const contextKey = prompt?.context_keys?.[0];
      if (!contextKey) return;
      openContext(contextKey);
    }

    async function markPromptBlocked(promptKey) {
      const prompt = promptByKey(promptKey);
      const status = document.getElementById(`prompt-action-${promptKey}`);
      if (!prompt) return;
      status.textContent = 'Saving blocked result...';
      try {
        const contextKey = prompt.context_keys?.[0] || state.contexts[0]?.key;
        const data = await api('/api/bna/agent-review/results', {
          method: 'POST',
          body: JSON.stringify({
            agent_review_run_id: prompt.copy_metadata?.agent_review_run_id,
            prompt_key: prompt.key,
            context_key: contextKey,
            requirement_id: prompt.requirement_id,
            status: 'blocked',
            severity: 'high',
            blocker: 'Marked blocked from Agent Review Hub prompt card.',
            blocked_route_or_step: 'Agent Review Hub prompt card',
            attempted_action: 'Save BLOCKED from prompt card before completion.',
            observed_failure: 'Agent Mode run could not continue from this prompt card.',
            partial_routes_visited: [],
            partial_helper_responses: [],
            evidence_notes: 'Hub Mark blocked action used.',
            summary: 'Scoped review prompt was marked blocked before completion.',
            evidence: ['Hub prompt card Mark blocked action'],
            return_url: prompt.return_url,
            dropoff_url: prompt.dropoff_url,
            idempotency_key: prompt.idempotency_key,
          }),
        });
        const current = promptByKey(promptKey);
        if (current) {
          current.workflow_state = 'blocked_saved';
          current.status = 'blocked';
          current.last_result_ref = data.result_ref;
          current.last_result_url = data.readback_url;
        }
        document.getElementById(`prompt-status-${promptKey}`).textContent = 'blocked saved';
        status.innerHTML = `Saved ${esc(data.result_ref)}. <a href="${esc(data.readback_url || data.operations_url)}" target="_blank" rel="noopener">Readback</a>`;
      } catch (error) {
        status.textContent = error.message || 'Could not mark blocked.';
      }
    }

    document.getElementById('resultForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = new FormData(event.target);
      const status = document.getElementById('resultStatus');
      status.textContent = 'Submitting...';
      try {
        const payload = Object.fromEntries(form.entries());
        payload.evidence = String(payload.evidence || '').split(/\n+/).filter(Boolean);
        const data = await api('/api/bna/agent-review/results', {
          method: 'POST',
          body: JSON.stringify(payload),
        });
        status.innerHTML = `Saved ${esc(data.result_ref)}. <a href="${esc(data.operations_url)}">Readback</a>`;
      } catch (error) {
        status.textContent = error.message || 'Could not submit result.';
      }
    });

    async function boot() {
      try {
        const data = await api('/api/bna/agent-review/contexts');
        state.csrf = data.csrf_token || '';
        state.contexts = data.contexts || [];
        state.prompts = data.prompts || [];
        renderSummary(data);
        renderContexts();
        renderPrompts();
        setInterval(refreshPromptTimers, 30000);
      } catch (error) {
        document.getElementById('summaryBand').innerHTML = `<div class="metric"><span>Blocked</span><strong>${esc(error.message || 'Could not load hub')}</strong></div>`;
      }
    }
    boot();
  </script>
</body>
</html>
