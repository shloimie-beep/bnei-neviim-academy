<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Bnei Nevi'im Academy</title>
    <meta name="theme-color" content="#1e3a5f">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" type="image/png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1e3a5f;
            --secondary-blue: #2c5282;
            --light-blue: #e8f0f8;
            --accent-gold: #c9a227;
            --dark-text: #1a202c;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: var(--dark-text);
            background:
                radial-gradient(circle at top right, rgba(201, 162, 39, 0.18), transparent 28%),
                linear-gradient(180deg, #f7fbff 0%, #e8f0f8 100%);
        }

        .thank-you-shell {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            width: 100%;
            max-width: 760px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(30, 58, 95, 0.12);
            border-radius: 24px;
            box-shadow: 0 24px 50px rgba(30, 58, 95, 0.14);
            overflow: hidden;
        }

        .hero {
            padding: 3rem 3rem 2rem;
            background: linear-gradient(135deg, rgba(30, 58, 95, 0.98), rgba(44, 82, 130, 0.92));
            color: var(--white);
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 1rem;
            padding: 0.4rem 0.8rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
            font-size: 0.88rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.4rem, 5vw, 3.5rem);
            line-height: 0.98;
            margin-bottom: 1rem;
        }

        .lead {
            max-width: 36rem;
            font-size: 1.08rem;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.9);
        }

        .content {
            padding: 2rem 3rem 3rem;
        }

        .message {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #334155;
            margin-bottom: 1.5rem;
        }

        .note {
            margin-top: 1.25rem;
            padding: 1rem 1.1rem;
            border-radius: 16px;
            background: #f8fbff;
            border: 1px solid #d7e1ec;
            color: #475569;
            line-height: 1.7;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.9rem;
            margin-top: 2rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            padding: 0.9rem 1.3rem;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .btn-primary {
            background: var(--accent-gold);
            color: var(--dark-text);
            box-shadow: 0 12px 24px rgba(201, 162, 39, 0.26);
        }

        .btn-secondary {
            background: #eef4fa;
            color: var(--primary-blue);
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .small {
            margin-top: 1rem;
            color: #64748b;
            font-size: 0.95rem;
        }

        @media (max-width: 720px) {
            .hero,
            .content {
                padding: 2rem 1.4rem;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
    <link rel="stylesheet" href="/css/bna-site-nav.css">
</head>
<body>
    <div id="siteNavMount" data-bna-site-nav></div>
    <script src="/js/bna-site-nav.js"></script>

    <main class="thank-you-shell">
    <article class="card">
        <section class="hero">
            <div class="eyebrow">Bnei Nevi'im Academy</div>
            <h1 id="headline">Thank you for signing up.</h1>
            <p class="lead" id="lead">
                Your registration has been received.
            </p>
        </section>

        <section class="content">
            <p class="message" id="message">
                Thank you for your submission.
            </p>

            <div class="note" id="note">
                Your registration has been received successfully.
            </div>

            <div class="actions" id="actions">
                <a class="btn btn-secondary" href="/">Return Home</a>
            </div>

            <p class="small" id="small"></p>
        </section>
    </article>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const payment = (params.get('payment') || 'cash').toLowerCase();
        const paymentLink = params.get('paymentLink') || '';
        const lang = (params.get('lang') || 'en').toLowerCase();

        const headlineEl = document.getElementById('headline');
        const leadEl = document.getElementById('lead');
        const messageEl = document.getElementById('message');
        const noteEl = document.getElementById('note');
        const actionsEl = document.getElementById('actions');
        const smallEl = document.getElementById('small');
        const homeButton = actionsEl.querySelector('.btn-secondary');

        if (lang === 'he') {
            document.documentElement.lang = 'he';
            document.documentElement.dir = 'rtl';
            document.body.style.fontFamily = 'Inter, sans-serif';
            headlineEl.textContent = 'תודה על ההרשמה.';
            leadEl.textContent = 'ההרשמה התקבלה.';
            messageEl.textContent = 'תודה על שליחת הטופס.';
            homeButton.textContent = 'חזרה לדף הבית';
            smallEl.textContent = '';
        }

        if (payment === 'credit') {
            noteEl.textContent = lang === 'he'
                ? 'ההרשמה התקבלה. השלב הבא הוא תשלום מאובטח באשראי.'
                : 'Your registration is in. The next step is your secure credit payment.';
            smallEl.textContent = lang === 'he'
                ? 'אם עמוד התשלום לא נפתח אוטומטית, השתמשו בכפתור למטה.'
                : 'If the payment page does not open automatically, use the button below.';

            if (paymentLink) {
                const payButton = document.createElement('a');
                payButton.className = 'btn btn-primary';
                payButton.href = paymentLink;
                payButton.textContent = lang === 'he' ? 'המשך לתשלום' : 'Continue to Payment';
                actionsEl.prepend(payButton);

                setTimeout(() => {
                    window.location.href = paymentLink;
                }, 1800);
            } else {
                noteEl.textContent = 'Your registration was received. BNA will send the confirmed credit-card payment link separately.';
                smallEl.textContent = 'No payment URL is shown until the correct link is confirmed.';
            }
        } else if (payment === 'bank_transfer') {
            noteEl.textContent = lang === 'he'
                ? 'ההרשמה התקבלה. אנא השלימו את התשלום הראשון של שכר הלימוד בהעברה בנקאית לפי הפרטים שנמסרו לכם על ידי הנהלת התוכנית.'
                : 'Your registration has been received. Please complete the first tuition payment by bank transfer using the details provided by the program director.';
            smallEl.textContent = lang === 'he'
                ? 'אם אתם צריכים את פרטי ההעברה, צרו איתנו קשר ונשלח אותם שוב. מצפים לשנה נפלאה ביחד.'
                : 'If you need the transfer details, please be in touch and we will send them again. We are looking forward to an awesome year together.';
        } else {
            noteEl.textContent = lang === 'he'
                ? 'ההרשמה התקבלה ונרשמה אצלנו להמשך מעקב על תשלום במזומן. מצפים לשנה נפלאה ביחד.'
                : 'Your registration has been received. We recorded cash as the selected payment method and are looking forward to an awesome year together.';
            smallEl.textContent = lang === 'he'
                ? 'אם יש לכם שאלות, נשמח שתהיו בקשר.'
                : 'If you have any questions, please be in touch.';
        }
    </script>
</body>
</html>
