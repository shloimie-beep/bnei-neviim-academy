<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Time Mishnayos Member</title>
  <meta name="description" content="Member preview page for One Time Mishnayos access.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    :root {
      --ink: #17201b;
      --muted: #5f6a63;
      --paper: #fbf7ed;
      --panel: #ffffff;
      --line: rgba(23, 32, 27, 0.14);
      --green: #1b5b42;
      --blue: #245d88;
      --gold: #b98c25;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      line-height: 1.55;
    }

    header {
      min-height: 36vh;
      padding: 34px clamp(18px, 5vw, 68px);
      display: grid;
      align-items: end;
      background:
        linear-gradient(180deg, rgba(8, 22, 17, 0.18), rgba(8, 22, 17, 0.7)),
        url("/images/bna-social-preview.png") center / cover no-repeat;
      color: #fff;
    }

    header h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 64px);
      line-height: 1;
      letter-spacing: 0;
    }

    header p {
      max-width: 640px;
      margin: 14px 0 0;
      font-size: 18px;
    }

    main {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 24px clamp(16px, 4vw, 28px) 60px;
      display: grid;
      grid-template-columns: minmax(280px, 0.8fr) minmax(0, 1.2fr);
      gap: 20px;
      align-items: start;
    }

    .panel,
    .access-card,
    .member-item,
    .soft-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 40px rgba(36, 48, 40, 0.08);
      padding: 18px;
    }

    .eyebrow {
      display: inline-block;
      color: var(--gold);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0;
      margin-bottom: 6px;
    }

    h2, h3 { margin: 0 0 8px; letter-spacing: 0; }
    p { color: var(--muted); }

    label {
      display: grid;
      gap: 6px;
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    input,
    select,
    textarea {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      background: #fff;
    }

    textarea {
      min-height: 112px;
      resize: vertical;
    }

    button,
    a {
      border: 0;
      border-radius: 8px;
      background: var(--green);
      color: #fff;
      padding: 10px 13px;
      font-weight: 850;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 6px;
    }

    .content-stack {
      display: grid;
      gap: 16px;
    }

    .member-list {
      display: grid;
      gap: 12px;
    }

    .member-item a { background: var(--blue); margin-top: 8px; }

    .member-meta,
    .badge-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .badge {
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: #fffaf0;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 850;
    }

    .form-grid {
      display: grid;
      gap: 10px;
      margin: 12px 0 16px;
    }

    .split-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .reply-list {
      border-top: 1px solid var(--line);
      margin-top: 12px;
      padding-top: 10px;
      display: grid;
      gap: 8px;
    }

    .notice {
      margin-top: 14px;
      border-left: 4px solid var(--gold);
      background: #fff;
      border-radius: 6px;
      padding: 12px;
    }

    .soft-panel {
      color: var(--muted);
    }

    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; }
      .split-fields { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <span class="eyebrow">Preview Member Area</span>
      <h1>One Time Mishnayos</h1>
      <p>Library and live class access are shown only when an active grant exists.</p>
    </div>
  </header>

  <main>
    <aside class="panel">
      <span class="eyebrow">Login</span>
      <h2>Request member link</h2>
      <form id="loginForm">
        <label>Email <input id="loginEmail" type="email" autocomplete="email" required></label>
        <button type="submit">Request login</button>
      </form>
      <div id="memberNotice" class="notice" hidden></div>
      <div id="memberState" style="margin-top:14px;"></div>
    </aside>

    <section class="content-stack">
      <div class="panel">
        <span class="eyebrow">Library</span>
        <h2>Recorded Classes</h2>
        <div id="libraryList" class="member-list"></div>
      </div>
      <div class="panel">
        <span class="eyebrow">Live</span>
        <h2>Live Sessions</h2>
        <div id="sessionList" class="member-list"></div>
      </div>
      <div class="panel">
        <span class="eyebrow">Private Questions</span>
        <h2>Ask the Rabbi</h2>
        <form id="questionForm" class="form-grid">
          <label>Topic <input id="questionTopic" type="text" maxlength="160" autocomplete="off"></label>
          <label>Question <textarea id="questionBody" maxlength="2500" required></textarea></label>
          <button type="submit">Submit Question</button>
        </form>
        <div id="questionList" class="member-list"></div>
      </div>
      <div class="panel">
        <span class="eyebrow">Support</span>
        <h2>Open a Ticket</h2>
        <form id="supportForm" class="form-grid">
          <label>Title <input id="supportTitle" type="text" maxlength="180" autocomplete="off" required></label>
          <label>Details <textarea id="supportDescription" maxlength="1500"></textarea></label>
          <div class="split-fields">
            <label>Category
              <select id="supportCategory">
                <option value="access">Access</option>
                <option value="login">Login</option>
                <option value="payment">Payment</option>
                <option value="link">Link</option>
                <option value="recording">Recording</option>
                <option value="worksheet">Worksheet</option>
                <option value="other">Other</option>
              </select>
            </label>
            <label>Severity
              <select id="supportSeverity">
                <option value="normal">Normal</option>
                <option value="low">Low</option>
                <option value="high">High</option>
                <option value="blocking">Blocking</option>
              </select>
            </label>
          </div>
          <button type="submit">Open Ticket</button>
        </form>
        <div id="supportList" class="member-list"></div>
      </div>
    </section>
  </main>

  <script src="/js/app-select.js"></script>
  <script src="/js/rabbi-member.js"></script>
</body>
</html>
