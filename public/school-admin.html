<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BNA School Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;750&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/platform-workspaces.css">
</head>
<body>
  <div class="platform-shell">
    <aside class="platform-sidebar">
      <div class="platform-brand">
        <strong>BNA</strong>
        <span>School workspace</span>
      </div>
      <nav class="workspace-switcher" aria-label="Workspace switcher">
        <a href="/operations">Super Admin <span>Control</span></a>
        <a href="/operations/school" class="active" aria-current="page">BNA <span>School</span></a>
        <a href="/operations/workspaces/one-time">One Time <span>Connector</span></a>
      </nav>
      <nav class="platform-nav" aria-label="School navigation">
        <a href="#students">Students</a>
        <a href="#families">Families</a>
        <a href="#classes">Classes</a>
        <a href="#progress">Progress</a>
      </nav>
    </aside>
    <main class="platform-main">
      <header class="platform-header">
        <div>
          <p class="platform-kicker">BNA</p>
          <h1>School workspace</h1>
          <p>Focused school operations for students, families, classes, attendance, and progress. One Time records stay outside this workspace unless explicitly linked.</p>
        </div>
        <a class="button" href="/operations">Super Admin</a>
      </header>
      <div id="schoolAdminApp" class="grid"></div>
    </main>
  </div>
  <script src="/js/school-admin.js"></script>
</body>
</html>
