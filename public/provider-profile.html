<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNA Provider Profile</title>
    <meta name="description" content="BNA service provider profile.">
    <link rel="canonical" href="https://bneineviimacademy.org/providers">
    <meta property="og:title" content="BNA Provider Profile">
    <meta property="og:description" content="Approved BNA service provider profile.">
    <meta property="og:type" content="profile">
    <script>
        try { localStorage.removeItem('bnaStudentAccessCode'); } catch (error) {}
    </script>
    <style>
        :root {
            --primary-blue: #1e3a5f;
            --secondary-blue: #2c5282;
            --ink: #151515;
            --muted: #626262;
            --paper: #f7f7f4;
            --panel: #ffffff;
            --line: rgba(21, 21, 21, 0.14);
            --gold: #d6a92d;
            --green: #2f6f5e;
            --shadow: 0 18px 44px rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            font-family: "Inter", "Segoe UI", system-ui, sans-serif;
            background: linear-gradient(180deg, #fff 0%, var(--paper) 100%);
        }

        a { color: inherit; }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            border-bottom: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.94);
            padding: 12px max(14px, calc((100vw - 1040px) / 2));
            backdrop-filter: blur(16px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .mark {
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            background: var(--primary-blue);
            color: #fff;
            font-weight: 900;
        }

        main {
            width: min(1040px, calc(100% - 28px));
            margin: 0 auto;
            padding: 30px 0 54px;
        }

        .profile-hero,
        .panel {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: var(--shadow);
            padding: 18px;
        }

        .profile-hero {
            display: grid;
            grid-template-columns: 128px minmax(0, 1fr);
            gap: 18px;
            align-items: start;
            margin-bottom: 14px;
        }

        .avatar {
            display: grid;
            place-items: center;
            width: 128px;
            aspect-ratio: 1;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(214, 169, 45, 0.22), rgba(47, 111, 94, 0.12));
            overflow: hidden;
            font-size: 30px;
            font-weight: 900;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1, h2, h3, p { margin-top: 0; letter-spacing: 0; }
        h1 { margin-bottom: 8px; font-size: clamp(34px, 6vw, 56px); line-height: 0.98; }
        .muted, .small { color: var(--muted); font-size: 13px; font-weight: 700; line-height: 1.45; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
            gap: 14px;
        }

        .stack { display: grid; gap: 14px; }

        .provider-index-return {
            width: fit-content;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #fff;
            padding: 6px 9px;
            font-size: 12px;
            font-weight: 900;
        }

        .pills {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 10px;
        }

        .button,
        button {
            min-height: 40px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
            color: var(--ink);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font: inherit;
            font-weight: 900;
            padding: 9px 12px;
            text-decoration: none;
            white-space: nowrap;
        }

        .primary {
            border-color: var(--gold);
            background: var(--gold);
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 8px;
            font: inherit;
            padding: 10px 12px;
        }

        textarea { min-height: 96px; resize: vertical; }
        label { display: grid; gap: 6px; font-size: 12px; font-weight: 900; }
        .notice { border: 1px solid rgba(214, 169, 45, 0.36); border-radius: 8px; background: #fffaf0; padding: 12px; font-weight: 800; }
        .hidden { display: none !important; }

        @media (max-width: 700px) {
            .topbar,
            .profile-hero { grid-template-columns: 1fr; }
            .avatar { width: 96px; }
        }
    </style>
    <link rel="stylesheet" href="/css/bna-site-nav.css">
</head>
<body>
    <div id="siteNavMount" data-bna-site-nav data-nav-context="provider-profile" data-nav-active="service-providers"></div>
    <script src="/js/bna-site-nav.js"></script>

    <main class="stack">
        <a class="button provider-index-return" href="/service-providers">Provider Index</a>
        <section id="status" class="panel">Loading provider...</section>
        <section id="profile" class="profile-hero hidden"></section>
        <section id="services" class="grid hidden"></section>
        <section id="gallery" class="grid hidden"></section>
        <section id="upgrade" class="panel hidden"></section>
        <section id="contact" class="panel stack hidden">
            <div>
                <h2>Ask a question</h2>
                <p class="small">Your message is saved for BNA/provider follow-up. No private school or household data is shown here.</p>
            </div>
            <form id="questionForm" class="stack">
                <label>Email
                    <input name="email" type="email">
                </label>
                <label>Phone
                    <input name="phone" type="tel">
                </label>
                <label>Question
                    <textarea name="message" required maxlength="3000"></textarea>
                </label>
                <button class="primary" type="submit">Send Question</button>
                <span id="questionStatus" class="small"></span>
            </form>
        </section>
    </main>

    <div id="siteFooterMount" data-bna-site-footer data-nav-active="service-providers"></div>

    <script>
        const slug = decodeURIComponent(window.location.pathname.split('/').filter(Boolean).pop() || '');
        const els = {
            status: document.getElementById('status'),
            profile: document.getElementById('profile'),
            services: document.getElementById('services'),
            gallery: document.getElementById('gallery'),
            upgrade: document.getElementById('upgrade'),
            contact: document.getElementById('contact'),
            questionForm: document.getElementById('questionForm'),
            questionStatus: document.getElementById('questionStatus'),
        };
        let provider = null;

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (char) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;',
            })[char]);
        }

        function initials(name = '') {
            return String(name || 'BNA').split(/\s+/).filter(Boolean).slice(0, 2).map(part => part[0]).join('').toUpperCase() || 'BNA';
        }

        function formObject(form) {
            return Object.fromEntries(new FormData(form).entries());
        }

        async function api(path, options = {}) {
            const response = await fetch(path, {
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
                ...options,
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || 'Request failed');
            return data;
        }

        function render() {
            const name = provider.display_name || 'Provider';
            const description = provider.short_description || provider.about || 'BNA service provider profile.';
            const canonical = `${window.location.origin}/providers/${encodeURIComponent(provider.slug || slug)}`;
            document.title = `${name} | BNA Provider Index`;
            document.querySelector('meta[name="description"]')?.setAttribute('content', description);
            document.querySelector('link[rel="canonical"]')?.setAttribute('href', canonical);
            document.querySelector('meta[property="og:title"]')?.setAttribute('content', `${name} | BNA Provider Index`);
            document.querySelector('meta[property="og:description"]')?.setAttribute('content', description);
            const jsonLd = document.getElementById('providerJsonLd');
            if (jsonLd) {
                jsonLd.textContent = JSON.stringify({
                    '@context': 'https://schema.org',
                    '@type': 'LocalBusiness',
                    name,
                    url: canonical,
                    description,
                    areaServed: provider.location_label || provider.service_area || provider.city || undefined,
                    image: provider.profile_photo_url || undefined
                });
            }
            els.status.classList.add('hidden');
            els.profile.classList.remove('hidden');
            els.services.classList.remove('hidden');
            els.gallery.classList.toggle('hidden', !(provider.images || []).length);
            els.upgrade.classList.remove('hidden');
            els.contact.classList.remove('hidden');

            els.profile.innerHTML = `
                <div class="avatar">${provider.profile_photo_url ? `<img src="${escapeHtml(provider.profile_photo_url)}" alt="${escapeHtml(name)}">` : escapeHtml(initials(name))}</div>
                <div>
                    <h1>${escapeHtml(name)}</h1>
                    <p class="muted">${escapeHtml([provider.short_description, provider.location_label || provider.service_area].filter(Boolean).join(' / ') || 'BNA service provider')}</p>
                    ${provider.about ? `<p>${escapeHtml(provider.about)}</p>` : ''}
                    <div class="pills">
                        ${(provider.categories || []).map(item => `<a class="pill" href="/providers/category/${encodeURIComponent(item.slug)}">${escapeHtml(item.name || item.slug)}</a>`).join('')}
                        ${(provider.languages || []).map(item => `<span class="pill">${escapeHtml(item)}</span>`).join('')}
                        ${(provider.offerings || []).some(item => item.is_free || String(item.offering_type || '').startsWith('free_')) ? '<span class="pill">Free offering</span>' : ''}
                    </div>
                    <div class="pills">
                        ${provider.website_url ? `<a class="button" href="${escapeHtml(provider.website_url)}" target="_blank" rel="noopener noreferrer">Website</a>` : ''}
                        ${provider.whatsapp ? `<a class="button" href="https://wa.me/${escapeHtml(String(provider.whatsapp).replace(/\D/g, ''))}" target="_blank" rel="noopener noreferrer">WhatsApp</a>` : ''}
                        ${provider.email ? `<a class="button" href="mailto:${escapeHtml(provider.email)}">Email</a>` : ''}
                    </div>
                </div>
            `;
            els.services.innerHTML = (provider.offerings || provider.services || []).length
                ? (provider.offerings || provider.services || []).map(service => `
                    <article class="panel">
                        <h2>${escapeHtml(service.title || 'Service')}</h2>
                        <p class="small">${escapeHtml([service.offering_type || service.service_type, service.age_range, service.schedule_text, service.is_free ? 'Free' : service.price_text || 'Details by provider'].filter(Boolean).join(' / '))}</p>
                        ${service.description ? `<p>${escapeHtml(service.description)}</p>` : ''}
                        ${service.signup_url ? `<a class="button" href="${escapeHtml(service.signup_url)}" target="_blank" rel="noopener noreferrer">Open Offering</a>` : ''}
                    </article>
                `).join('')
                : '<article class="panel"><h2>Services</h2><p class="small">Service details are pending BNA review.</p></article>';
            els.gallery.innerHTML = (provider.images || []).map(item => `
                <article class="panel">
                    <img src="${escapeHtml(item.image_url || item.url)}" alt="${escapeHtml(item.alt_text || name)}" style="width:100%;border-radius:8px;border:1px solid var(--line);">
                    ${item.alt_text ? `<p class="small">${escapeHtml(item.alt_text)}</p>` : ''}
                </article>
            `).join('');
            els.upgrade.innerHTML = `
                <h2>Improve this listing</h2>
                <p class="small">Providers can ask BNA about marketing help, ads, SEO, improved websites or funnels, and premium listing options. Basic listing stays free.</p>
                <div class="pills">
                    <button class="button" type="button" onclick="recordUpgradeInterest('marketing_help')">Marketing help</button>
                    <button class="button" type="button" onclick="recordUpgradeInterest('seo')">SEO</button>
                    <button class="button" type="button" onclick="recordUpgradeInterest('premium_listing')">Premium listing</button>
                </div>
                <span id="upgradeStatus" class="small"></span>
            `;
        }

        async function load() {
            try {
                const data = await api(`/api/providers/${encodeURIComponent(slug)}`);
                provider = data.provider;
                render();
            } catch (error) {
                els.status.textContent = error.message || 'Provider profile was not found.';
            }
        }

        els.questionForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            els.questionStatus.textContent = 'Sending...';
            try {
                await api(`/api/providers/${encodeURIComponent(provider.slug || slug)}/questions`, {
                    method: 'POST',
                    body: JSON.stringify(formObject(event.currentTarget)),
                });
                event.currentTarget.reset();
                els.questionStatus.textContent = 'Question sent.';
            } catch (error) {
                els.questionStatus.textContent = error.message || 'Could not send question.';
            }
        });

        async function recordUpgradeInterest(type) {
            const status = document.getElementById('upgradeStatus');
            if (status) status.textContent = 'Saving interest...';
            try {
                const data = await api(`/api/providers/${encodeURIComponent(provider.slug || slug)}/upgrade-interest`, {
                    method: 'POST',
                    body: JSON.stringify({ upgrade_type: type })
                });
                if (data.url) window.open(data.url, '_blank', 'noopener,noreferrer');
                if (status) status.textContent = data.message || 'Interest saved.';
            } catch (error) {
                if (status) status.textContent = error.message || 'Could not save interest.';
            }
        }

        load();
    </script>
    <script type="application/ld+json" id="providerJsonLd">
        {"@context":"https://schema.org","@type":"LocalBusiness","name":"BNA provider"}
    </script>
    <script src="/js/bna-helper-knowledge.js"></script>
    <script src="/js/bna-bot-widget.js"></script>
</body>
</html>
