<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BNA Review Session</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667084;
      --line: #d9dfeb;
      --blue: #1768b8;
      --green: #1f7a4d;
      --red: #ad2d2d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    .review-banner {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #0f2744;
      color: #fff;
      padding: 12px clamp(14px, 3vw, 28px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid #092038;
    }
    .review-banner strong { display: block; letter-spacing: 0; }
    .review-banner span { color: #dbe8f7; font-size: 0.9rem; }
    main {
      width: min(1240px, calc(100% - 28px));
      margin: 18px auto 36px;
      display: grid;
      gap: 14px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }
    .meta {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .meta div {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      min-width: 0;
    }
    .meta span { color: var(--muted); display: block; font-size: 0.78rem; }
    .meta strong { display: block; margin-top: 4px; overflow-wrap: anywhere; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    button, .button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 9px 11px;
      min-height: 38px;
      border-radius: 8px;
      font-weight: 650;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .danger { background: #fff2f2; border-color: #e4b8b8; color: var(--red); }
    .status { color: var(--muted); overflow-wrap: anywhere; }
    iframe {
      width: 100%;
      height: min(72vh, 820px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    label { display: grid; gap: 5px; color: var(--muted); font-size: 0.82rem; font-weight: 650; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      font: inherit;
      color: var(--ink);
      background: #fff;
    }
    textarea { min-height: 100px; resize: vertical; }
    .wide { grid-column: 1 / -1; }
    @media (max-width: 820px) {
      .meta, .form-grid { grid-template-columns: 1fr; }
      button, .button { width: 100%; }
      iframe { height: 68vh; }
    }
  </style>
</head>
<body>
  <div class="review-banner">
    <div>
          <strong id="bannerTitle">Reviewing as scoped BNA role</strong>
      <span id="bannerMeta">Loading...</span>
    </div>
    <div class="actions" style="margin:0">
      <a class="button" id="hubLink" href="/operations/agent-review" data-action-id="ACTION-AGENT-REVIEW-RETURN-HUB">Hub</a>
      <button class="danger" type="button" onclick="exitSession()" data-action-id="ACTION-AGENT-REVIEW-EXIT">Exit review context</button>
    </div>
  </div>
  <main>
    <section class="panel">
      <div class="meta" id="sessionMeta"></div>
      <div class="actions">
        <a class="button primary" id="targetLink" href="#" target="_blank" rel="noopener" data-action-id="ACTION-AGENT-REVIEW-OPEN-TARGET">Open scoped route</a>
        <button type="button" onclick="copySessionLink()" data-action-id="ACTION-AGENT-REVIEW-COPY-SESSION">Copy session URL</button>
      </div>
      <p class="status" id="sessionStatus"></p>
    </section>
    <section class="panel">
      <iframe id="reviewFrame" title="Scoped review target" sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-downloads"></iframe>
    </section>
    <section class="panel">
      <h2>Submit Agent Review Result</h2>
      <form id="resultForm">
        <div class="form-grid">
          <label>Requirement<input name="requirement_id" value="REQ-20260625-027"></label>
          <label>Prompt key<input name="prompt_key" id="promptKey" placeholder="prompt key"></label>
          <label>Status<select name="status"><option value="pass">pass</option><option value="fail">fail</option><option value="blocked">blocked</option><option value="needs_review">needs_review</option></select></label>
          <label class="wide">Summary<textarea name="summary" placeholder="Redacted result summary"></textarea></label>
          <label class="wide">Evidence<textarea name="evidence" placeholder="Routes, DOM/readback proof, screenshot paths"></textarea></label>
          <label class="wide">Suggested correction<textarea name="suggested_correction" placeholder="Exact repair or none"></textarea></label>
          <label class="wide">Idempotency key<input name="idempotency_key" placeholder="prompt-key:agent-run-id"></label>
        </div>
        <div class="actions">
          <button class="primary" type="submit" data-action-id="ACTION-AGENT-REVIEW-SUBMIT-RESULT">Submit Result</button>
          <span class="status" id="resultStatus"></span>
        </div>
      </form>
    </section>
  </main>
  <script src="/js/app-select.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const exchangeToken = params.get('exchange') || '';
    let session = null;
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    const api = async (path, options = {}) => {
      const response = await fetch(path, {
        ...options,
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `Request failed: ${response.status}`);
      return data;
    };
    function render(data) {
      session = data.session;
      document.getElementById('bannerTitle').textContent = session.review_banner || 'Review session';
      document.getElementById('bannerMeta').textContent = `${session.role} / ${session.workspace_key} / expires ${session.expires_at}`;
      document.getElementById('sessionMeta').innerHTML = [
        ['Session', session.session_ref],
        ['Role', session.role],
        ['Workspace', session.workspace_key],
        ['Project', session.project_key || 'none'],
        ['Context', session.context_type],
        ['Helper', session.helper_surface],
        ['Target', session.target_route],
        ['All-access URL', session.all_access_secret_in_url ? 'yes' : 'no'],
      ].map(([label, value]) => `<div><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`).join('');
      document.getElementById('targetLink').href = session.target_url;
      document.getElementById('reviewFrame').src = session.target_url;
      document.getElementById('sessionStatus').textContent = 'Scoped session is held in an HttpOnly cookie after one-time exchange.';
    }
    async function boot() {
      try {
        const data = await api(exchangeToken
          ? `/api/bna/agent-review/session?exchange=${encodeURIComponent(exchangeToken)}`
          : '/api/bna/agent-review/session');
        if (exchangeToken) window.history.replaceState({}, '', '/agent-review/session');
        render(data);
      } catch (error) {
        document.getElementById('bannerTitle').textContent = 'Review session blocked';
        document.getElementById('bannerMeta').textContent = error.message || 'Session unavailable';
        document.getElementById('sessionStatus').textContent = 'Return to the hub and create a fresh scoped session.';
      }
    }
    async function exitSession() {
      try {
        await api('/api/bna/agent-review/sessions/exit', {
          method: 'POST',
          body: JSON.stringify({}),
        });
      } catch {}
      window.location.href = '/operations/agent-review';
    }
    async function copySessionLink() {
      await navigator.clipboard?.writeText(window.location.href).catch(() => {});
      document.getElementById('sessionStatus').textContent = 'Session URL copied.';
    }
    document.getElementById('resultForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = new FormData(event.target);
      const payload = Object.fromEntries(form.entries());
      payload.evidence = String(payload.evidence || '').split(/\n+/).filter(Boolean);
      const status = document.getElementById('resultStatus');
      status.textContent = 'Submitting...';
      try {
        const data = await api('/api/bna/agent-review/results', {
          method: 'POST',
          body: JSON.stringify(payload),
        });
        status.innerHTML = `Saved ${esc(data.result_ref)}. <a href="${esc(data.operations_url)}">Readback</a>`;
      } catch (error) {
        status.textContent = error.message || 'Could not submit result.';
      }
    });
    boot();
  </script>
</body>
</html>
