<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Time Member Library</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #667085;
      --line: #d8dee9;
      --paper: #f7f9fc;
      --panel: #ffffff;
      --accent: #116466;
      --accent-2: #c94f4f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    header {
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .topbar,
    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 72px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .member-meta {
      color: var(--muted);
      font-size: 14px;
      text-align: right;
    }

    main {
      padding: 24px 0 44px;
    }

    .access-panel {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 10px;
      align-items: end;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    input,
    button {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
    }

    input {
      width: 100%;
      padding: 0 12px;
      color: var(--ink);
      background: #fff;
    }

    button {
      padding: 0 18px;
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
      cursor: pointer;
      font-weight: 700;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .status {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .classroom-strip {
      display: none;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #eef7f2;
    }

    .classroom-strip.visible {
      display: flex;
    }

    .classroom-strip p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .classroom-strip a {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 0 12px;
      border-radius: 6px;
      color: #fff;
      background: var(--accent);
      text-decoration: none;
      font-weight: 700;
      white-space: nowrap;
    }

    .library-toolbar {
      display: none;
      gap: 12px;
      align-items: center;
      margin-top: 18px;
    }

    .library-toolbar.visible {
      display: grid;
      grid-template-columns: minmax(180px, 320px) minmax(0, 1fr);
    }

    .filter-rail {
      display: flex;
      gap: 8px;
      min-width: 0;
      overflow-x: auto;
      padding: 2px 0 8px;
      scrollbar-width: thin;
      white-space: nowrap;
    }

    .filter-rail button {
      flex: 0 0 auto;
      min-height: 36px;
      padding: 0 12px;
      color: var(--ink);
      background: #fff;
      border-color: var(--line);
    }

    .filter-rail button[aria-pressed="true"] {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }

    .library-group {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .library-group-title {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .library-results {
      display: grid;
      gap: 20px;
      margin-top: 20px;
    }

    .library-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .library-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .media-frame {
      display: grid;
      min-height: 190px;
      background: #e7edf5;
      place-items: center;
    }

    .media-frame img,
    .media-frame video,
    .media-frame iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      object-fit: cover;
    }

    .media-placeholder {
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }

    .card-body {
      display: grid;
      gap: 12px;
      padding: 16px;
    }

    .card-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .card-description {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .metadata-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0;
    }

    .metadata-chip {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    .progress-shell {
      display: grid;
      gap: 6px;
    }

    .progress-bar {
      overflow: hidden;
      height: 8px;
      border-radius: 999px;
      background: #e5e7ef;
    }

    .progress-bar span {
      display: block;
      height: 100%;
      width: var(--progress, 0%);
      background: var(--accent);
    }

    .progress-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .progress-actions button {
      min-height: 34px;
      padding: 0 10px;
      color: var(--accent);
      background: #fff;
      border-color: var(--line);
      font-size: 13px;
    }

    .asset-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .asset-list a,
    .media-link {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--accent);
      background: #fff;
      text-decoration: none;
      font-weight: 700;
    }

    .empty-state {
      margin-top: 20px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: var(--panel);
      text-align: center;
    }

    .error {
      color: var(--accent-2);
    }

    @media (max-width: 680px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
        padding: 16px 0;
      }

      .member-meta {
        text-align: left;
      }

      .access-panel {
        grid-template-columns: 1fr;
      }

      .classroom-strip {
        align-items: flex-start;
        flex-direction: column;
      }

      .library-toolbar.visible {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <h1>One Time Member Library</h1>
      <div class="member-meta" id="memberMeta">Access code required</div>
    </div>
  </header>

  <main>
    <form class="access-panel" id="accessForm">
      <label>
        Access code
        <input id="accessCode" name="code" autocomplete="off" spellcheck="false">
      </label>
      <button type="submit" id="loadButton">Open Library</button>
    </form>
    <div class="status" id="status"></div>
    <section class="classroom-strip" id="classroomStrip" aria-live="polite"></section>
    <section class="library-toolbar" id="libraryToolbar" aria-label="Library filters">
      <label>
        Search
        <input id="librarySearch" autocomplete="off" placeholder="Title, Masechta, Perek">
      </label>
      <div class="filter-rail" id="filterRail" role="tablist" aria-label="Member library filters"></div>
    </section>
    <section class="library-grid" id="libraryGrid" aria-live="polite"></section>
  </main>

  <script>
    const form = document.getElementById('accessForm');
    const codeInput = document.getElementById('accessCode');
    const loadButton = document.getElementById('loadButton');
    const statusEl = document.getElementById('status');
    const grid = document.getElementById('libraryGrid');
    const memberMeta = document.getElementById('memberMeta');
    const classroomStrip = document.getElementById('classroomStrip');
    const libraryToolbar = document.getElementById('libraryToolbar');
    const librarySearch = document.getElementById('librarySearch');
    const filterRail = document.getElementById('filterRail');
    let currentPayload = null;
    let activeFilter = 'all';
    let searchTerm = '';

    const filters = [
      ['all', 'All'],
      ['recent', 'Recently Added'],
      ['continue', 'Continue Watching'],
      ['masechta', 'Masechta'],
      ['perek', 'Perek'],
      ['review', 'Review'],
      ['completed', 'Completed'],
    ];

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatDate(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function mediaMarkup(item) {
      const mediaUrl = item.media_url || '';
      if (item.media_provider === 'vimeo' && item.vimeo_id) {
        return `<iframe src="https://player.vimeo.com/video/${encodeURIComponent(item.vimeo_id)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="${escapeHtml(item.title)}"></iframe>`;
      }
      if (/\.(mp4|webm)(\?|#|$)/i.test(mediaUrl)) {
        return `<video controls src="${escapeHtml(mediaUrl)}" poster="${escapeHtml(item.thumbnail_url || '')}"></video>`;
      }
      if (item.thumbnail_url) {
        return `<img src="${escapeHtml(item.thumbnail_url)}" alt="">`;
      }
      return '<div class="media-placeholder">Media link available below</div>';
    }

    function progressKey(item) {
      return `one_time_member_library_progress_${Number(item.id || item.class_session_id || 0)}`;
    }

    function itemProgress(item) {
      const stored = Number(localStorage.getItem(progressKey(item)) || item.watch_progress_percent || 0);
      if (!Number.isFinite(stored)) return 0;
      return Math.max(0, Math.min(100, Math.round(stored)));
    }

    function setItemProgress(itemId, percent) {
      const items = currentPayload?.member_library?.items || [];
      const item = items.find((entry) => Number(entry.id) === Number(itemId));
      if (!item) return;
      localStorage.setItem(progressKey(item), String(Math.max(0, Math.min(100, Number(percent) || 0))));
      renderLibraryItems();
    }

    function formatDuration(seconds) {
      const total = Number(seconds || 0);
      if (!Number.isFinite(total) || total <= 0) return '';
      const minutes = Math.round(total / 60);
      if (minutes < 60) return `${minutes} min`;
      const hours = Math.floor(minutes / 60);
      const remainder = minutes % 60;
      return `${hours}h${remainder ? ` ${remainder}m` : ''}`;
    }

    function metadataChips(item) {
      return [
        item.masechta,
        item.perek ? `Perek ${item.perek}` : '',
        item.mishnah_range ? `Mishnah ${item.mishnah_range}` : '',
        item.class_date ? formatDate(item.class_date) : '',
        item.duration_seconds ? formatDuration(item.duration_seconds) : '',
        item.review_state === 'review_ready' ? 'Review ready' : '',
      ].filter(Boolean);
    }

    function filteredItems(items) {
      const query = searchTerm.toLowerCase();
      return items.filter((item) => {
        const progress = itemProgress(item);
        const haystack = [
          item.title,
          item.description,
          item.masechta,
          item.perek,
          item.mishnah_range,
        ].join(' ').toLowerCase();
        if (query && !haystack.includes(query)) return false;
        if (activeFilter === 'continue') return progress > 0 && progress < 95;
        if (activeFilter === 'completed') return progress >= 95;
        if (activeFilter === 'review') return item.review_state === 'review_ready' || (item.assets || []).length > 0;
        return true;
      }).sort((a, b) => {
        if (activeFilter === 'recent') return String(b.published_at || b.class_date || '').localeCompare(String(a.published_at || a.class_date || ''));
        return String(b.class_date || b.published_at || '').localeCompare(String(a.class_date || a.published_at || ''));
      });
    }

    function groupItems(items) {
      if (!['masechta', 'perek'].includes(activeFilter)) return [{ title: '', items }];
      const groups = new Map();
      items.forEach((item) => {
        const title = activeFilter === 'masechta'
          ? (item.masechta || 'Unassigned Masechta')
          : `${item.masechta || 'Unassigned'} / Perek ${item.perek || 'Unassigned'}`;
        if (!groups.has(title)) groups.set(title, []);
        groups.get(title).push(item);
      });
      return Array.from(groups.entries()).map(([title, groupItemsValue]) => ({ title, items: groupItemsValue }));
    }

    function renderFilterRail(items) {
      const counts = {
        all: items.length,
        recent: items.length,
        continue: items.filter((item) => {
          const progress = itemProgress(item);
          return progress > 0 && progress < 95;
        }).length,
        masechta: new Set(items.map((item) => item.masechta).filter(Boolean)).size,
        perek: new Set(items.map((item) => `${item.masechta || ''}:${item.perek || ''}`).filter((value) => value !== ':')).size,
        review: items.filter((item) => item.review_state === 'review_ready' || (item.assets || []).length > 0).length,
        completed: items.filter((item) => itemProgress(item) >= 95).length,
      };
      filterRail.innerHTML = filters.map(([key, label]) => `
        <button type="button" role="tab" aria-pressed="${activeFilter === key ? 'true' : 'false'}" onclick="setLibraryFilter('${key}')">${escapeHtml(label)} ${Number(counts[key] || 0)}</button>
      `).join('');
    }

    function renderLibraryCard(item) {
      const progress = itemProgress(item);
      const chips = metadataChips(item);
      return `
        <article class="library-card">
          <div class="media-frame">${mediaMarkup(item)}</div>
          <div class="card-body">
            <div>
              <h2 class="card-title">${escapeHtml(item.title)}</h2>
              ${chips.length ? `<p class="metadata-row">${chips.map((chip) => `<span class="metadata-chip">${escapeHtml(chip)}</span>`).join('')}</p>` : ''}
            </div>
            ${item.description ? `<p class="card-description">${escapeHtml(item.description)}</p>` : ''}
            <div class="progress-shell" aria-label="Watch progress">
              <div class="progress-bar" style="--progress:${progress}%"><span></span></div>
              <div class="status">${progress}% complete</div>
              <div class="progress-actions">
                ${item.media_url ? `<a class="media-link" href="${escapeHtml(item.media_url)}" target="_blank" rel="noopener">Open Media</a>` : ''}
                <button type="button" onclick="setItemProgress(${Number(item.id)}, 50)">Continue Watching</button>
                <button type="button" onclick="setItemProgress(${Number(item.id)}, 100)">Mark Complete</button>
              </div>
            </div>
            ${(item.assets || []).length ? `
              <ul class="asset-list">
                ${item.assets.map((asset) => `
                  <li><a href="${escapeHtml(asset.file_url)}" target="_blank" rel="noopener">${escapeHtml(asset.title || asset.asset_type || 'Asset')}</a></li>
                `).join('')}
              </ul>
            ` : ''}
          </div>
        </article>
      `;
    }

    function renderLibraryItems() {
      const items = currentPayload?.member_library?.items || [];
      renderFilterRail(items);
      const visibleItems = filteredItems(items);
      if (!visibleItems.length) {
        grid.className = 'library-grid';
        grid.innerHTML = '<div class="empty-state">No published library items match this view.</div>';
        return;
      }
      const groups = groupItems(visibleItems);
      if (groups.length === 1 && !groups[0].title) {
        grid.className = 'library-grid';
        grid.innerHTML = groups[0].items.map(renderLibraryCard).join('');
        return;
      }
      grid.className = 'library-results';
      grid.innerHTML = groups.map((group) => `
        <section class="library-group">
          <h2 class="library-group-title">${escapeHtml(group.title)}</h2>
          <div class="library-grid">${group.items.map(renderLibraryCard).join('')}</div>
        </section>
      `).join('');
    }

    window.setLibraryFilter = function setLibraryFilter(key) {
      activeFilter = filters.some(([filterKey]) => filterKey === key) ? key : 'all';
      renderLibraryItems();
    };

    window.setItemProgress = setItemProgress;

    function renderLibrary(payload) {
      currentPayload = payload;
      const access = payload.member_library?.access || {};
      const classroom = payload.classroom || {};
      memberMeta.textContent = access.member_label ? `${access.member_label} | ${String(access.tier || '').replace(/_/g, ' ')}` : 'Member library';
      classroomStrip.classList.add('visible');
      libraryToolbar.classList.add('visible');
      classroomStrip.innerHTML = `
        <p>Classroom: ${Number((classroom.calendar_items || []).length)} calendar item${Number((classroom.calendar_items || []).length) === 1 ? '' : 's'}, ${Number((classroom.threads || []).length)} Rabbi thread${Number((classroom.threads || []).length) === 1 ? '' : 's'}, ${Number((classroom.leaderboard || []).length)} leaderboard row${Number((classroom.leaderboard || []).length) === 1 ? '' : 's'}.</p>
        <a href="/one-time-classroom?code=${encodeURIComponent(codeInput.value.trim())}">Open Classroom</a>
      `;
      renderLibraryItems();
    }

    async function loadLibrary(code) {
      const trimmed = String(code || '').trim();
      if (!trimmed) {
        statusEl.textContent = 'Enter an access code.';
        statusEl.className = 'status error';
        return;
      }
      loadButton.disabled = true;
      statusEl.textContent = 'Loading...';
      statusEl.className = 'status';
      try {
        const response = await fetch(`/api/member-library?code=${encodeURIComponent(trimmed)}`, { credentials: 'same-origin' });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || 'Could not open library.');
        localStorage.setItem('one_time_member_library_code', trimmed);
        statusEl.textContent = '';
        renderLibrary(payload);
      } catch (error) {
        currentPayload = null;
        memberMeta.textContent = 'Access code required';
        libraryToolbar.classList.remove('visible');
        grid.innerHTML = '';
        statusEl.textContent = error.message || 'Could not open library.';
        statusEl.className = 'status error';
      } finally {
        loadButton.disabled = false;
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      loadLibrary(codeInput.value);
    });

    librarySearch.addEventListener('input', (event) => {
      searchTerm = event.target.value || '';
      renderLibraryItems();
    });

    const params = new URLSearchParams(window.location.search);
    const initialCode = params.get('code') || localStorage.getItem('one_time_member_library_code') || '';
    if (initialCode) {
      codeInput.value = initialCode;
      loadLibrary(initialCode);
    }
  </script>
</body>
</html>
