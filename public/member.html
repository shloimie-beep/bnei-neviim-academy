<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BNA Member Portal</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #14202b;
      --muted: #5d6974;
      --line: #d9e0e7;
      --paper: #ffffff;
      --band: #f6f8fa;
      --green: #146c43;
      --blue: #1b5fa7;
      --red: #9b1c31;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--band);
      color: var(--ink);
      line-height: 1.45;
    }
    header {
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      padding: 18px clamp(16px, 4vw, 36px);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: clamp(1.35rem, 3vw, 2rem);
      letter-spacing: 0;
    }
    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    main {
      width: min(1120px, calc(100% - 24px));
      margin: 20px auto 40px;
      display: grid;
      gap: 16px;
    }
    section {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    h2 {
      font-size: 1.05rem;
      margin: 0 0 12px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.82rem;
      color: var(--muted);
      background: #fff;
      white-space: nowrap;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }
    article {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #fff;
    }
    article h3 {
      margin: 0 0 8px;
      font-size: 1rem;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 0.88rem;
      margin-bottom: 10px;
    }
    a.button,
    button {
      border: 1px solid var(--blue);
      background: var(--blue);
      color: #fff;
      border-radius: 6px;
      padding: 8px 12px;
      font: inherit;
      font-weight: 650;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
    }
    button.secondary,
    a.secondary {
      background: #fff;
      color: var(--blue);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .notice {
      border-left: 4px solid var(--blue);
      background: #eef6ff;
      padding: 10px 12px;
      color: #173a5a;
      border-radius: 6px;
    }
    .error {
      border-left-color: var(--red);
      background: #fff1f3;
      color: #6f1424;
    }
    .hidden { display: none; }
    @media (max-width: 620px) {
      header { align-items: flex-start; flex-direction: column; }
      section { padding: 14px; }
      a.button, button { width: 100%; }
      .actions { align-items: stretch; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>BNA Member Portal</h1>
      <p id="memberLine">Loading member access...</p>
    </div>
    <div class="actions" aria-label="One Time member navigation">
      <a class="button secondary" href="/rabbi-member">Member home</a>
      <a class="button secondary" href="/member-library">Library</a>
      <a class="button secondary" href="/one-time-classroom">Classroom</a>
      <a class="button secondary" href="/rabbi-member?logout=1">Account/logout</a>
      <a class="button secondary" href="/">Return to public site</a>
      <span class="status" id="tierPill">Legacy code access</span>
    </div>
  </header>
  <main>
    <div id="notice" class="notice hidden"></div>
    <section>
      <h2>Live Classes</h2>
      <div id="liveSessions" class="grid"></div>
    </section>
    <section>
      <h2>Recordings</h2>
      <div id="recordings" class="grid"></div>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code') || params.get('access_code') || '';
    const memberLine = document.getElementById('memberLine');
    const tierPill = document.getElementById('tierPill');
    const liveSessionsEl = document.getElementById('liveSessions');
    const recordingsEl = document.getElementById('recordings');
    const noticeEl = document.getElementById('notice');

    function escapeHtml(value) {
      return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatDateTime(value) {
      if (!value) return '';
      const date = new Date(value);
      if (!Number.isFinite(date.getTime())) return '';
      return date.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        ...options,
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `Request failed: ${response.status}`);
      return data;
    }

    function showNotice(message, isError = false) {
      noticeEl.textContent = message || '';
      noticeEl.classList.toggle('hidden', !message);
      noticeEl.classList.toggle('error', Boolean(isError));
    }

    function renderLiveSession(session) {
      const canJoin = Boolean(session.zoom_link_available && session.zoom_meeting_url);
      return `
        <article>
          <h3>${escapeHtml(session.title || 'Live class')}</h3>
          <div class="meta">
            <span>${escapeHtml(formatDateTime(session.start_at))}</span>
            <span>${escapeHtml(String(session.status || '').replace(/_/g, ' '))}</span>
            <span>${escapeHtml(String(session.required_tier || '').replace(/_/g, ' '))}</span>
          </div>
          ${session.zoom_upgrade_message ? `<p>${escapeHtml(session.zoom_upgrade_message)}</p>` : ''}
          <div class="actions">
            ${canJoin ? `<a class="button" href="${escapeHtml(session.zoom_meeting_url)}" target="_blank" rel="noopener">Join class</a>` : ''}
            ${canJoin ? `<button class="secondary" type="button" onclick="checkIn(${Number(session.id)})">Check in</button>` : ''}
          </div>
        </article>
      `;
    }

    function renderRecording(recording) {
      return `
        <article>
          <h3>${escapeHtml(recording.title || 'Class recording')}</h3>
          <div class="meta">
            <span>${escapeHtml(formatDateTime(recording.published_at || recording.start_at))}</span>
            <span>${escapeHtml(String(recording.recording_status || '').replace(/_/g, ' '))}</span>
          </div>
          <div class="actions">
            <a class="button" href="${escapeHtml(recording.vimeo_recording_url)}" target="_blank" rel="noopener">Watch recording</a>
          </div>
        </article>
      `;
    }

    async function checkIn(sessionId) {
      try {
        await api(`/api/member-portal/live-sessions/${encodeURIComponent(String(sessionId))}/check-in`, {
          method: 'POST',
          body: JSON.stringify({ code }),
        });
        showNotice('Checked in.');
      } catch (error) {
        showNotice(error.message || 'Could not check in.', true);
      }
    }

    async function loadPortal() {
      if (!code) {
        showNotice('Member access code is missing.', true);
        memberLine.textContent = 'Access code required';
        return;
      }
      try {
        const [portal, sessions, library] = await Promise.all([
          api(`/api/member-portal?code=${encodeURIComponent(code)}`),
          api(`/api/member-portal/live-sessions?code=${encodeURIComponent(code)}`),
          api(`/api/member-portal/library?code=${encodeURIComponent(code)}`),
        ]);
        const member = portal.member || {};
        memberLine.textContent = member.display_name ? `Welcome, ${member.display_name}` : 'Member access active';
        tierPill.textContent = String(member.access_tier || 'member').replace(/_/g, ' ');
        if (sessions.upgrade_message) showNotice(sessions.upgrade_message);
        liveSessionsEl.innerHTML = (sessions.sessions || []).length
          ? sessions.sessions.map(renderLiveSession).join('')
          : '<article>No scheduled live classes are visible right now.</article>';
        recordingsEl.innerHTML = (library.recordings || []).length
          ? library.recordings.map(renderRecording).join('')
          : '<article>No published recordings are visible right now.</article>';
      } catch (error) {
        showNotice(error.message || 'Could not load member portal.', true);
        memberLine.textContent = 'Access unavailable';
      }
    }

    loadPortal();
  </script>
</body>
</html>
