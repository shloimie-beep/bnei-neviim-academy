<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Document | Bnei Neviim Academy</title>
    <meta name="robots" content="noindex">
    <script>
        try { localStorage.removeItem('bnaStudentAccessCode'); } catch (error) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Serif+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1e3a5f;
            --secondary-blue: #2c5282;
            --light-blue: #e8f0f8;
            --accent-gold: #c9a227;
            --gold-soft: #f5df89;
            --ink: #10233f;
            --muted: #526071;
            --line: rgba(30, 58, 95, 0.14);
            --paper: #fbfaf6;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            color: var(--ink);
            font-family: Inter, sans-serif;
            line-height: 1.7;
            background:
                radial-gradient(circle at top left, rgba(201, 162, 39, 0.16), transparent 34rem),
                linear-gradient(180deg, #f8fbff 0%, var(--paper) 42rem, #ffffff 100%);
        }

        [dir="rtl"] body {
            font-family: "Noto Serif Hebrew", Inter, sans-serif;
        }

        .document-toolbar {
            position: sticky;
            top: 0;
            z-index: 20;
            border-bottom: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);
        }

        .document-toolbar-inner {
            width: min(1120px, calc(100% - 32px));
            min-height: 66px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .brand {
            min-width: 0;
            display: inline-flex;
            align-items: center;
            gap: 0.72rem;
            color: var(--primary-blue);
            text-decoration: none;
        }

        .brand img {
            width: 42px;
            height: 42px;
            object-fit: contain;
        }

        .brand-title {
            display: block;
            font-family: "Cormorant Garamond", serif;
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
        }

        .brand-subtitle {
            display: block;
            color: var(--secondary-blue);
            font-size: 0.76rem;
            line-height: 1.2;
        }

        [dir="rtl"] .brand-title,
        [dir="rtl"] h1,
        [dir="rtl"] h2,
        [dir="rtl"] .document-content h3 {
            font-family: "Noto Serif Hebrew", "Cormorant Garamond", serif;
        }

        .toolbar-actions {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .toolbar-link,
        .language-toggle {
            min-height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--white);
            color: var(--primary-blue);
            padding: 0.48rem 0.82rem;
            font-size: 0.9rem;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(30, 58, 95, 0.07);
        }

        main {
            width: min(940px, calc(100% - 32px));
            margin: 0 auto;
            padding: clamp(1.6rem, 5vw, 3.7rem) 0 4rem;
        }

        .eyebrow {
            margin: 0 0 0.65rem;
            color: var(--accent-gold);
            font-size: 0.78rem;
            font-weight: 900;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: var(--primary-blue);
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(2.2rem, 8vw, 4.2rem);
            font-weight: 700;
            letter-spacing: 0;
            line-height: 0.98;
        }

        .intro {
            max-width: 720px;
            margin: 1rem 0 0;
            color: var(--muted);
            font-size: 1.02rem;
        }

        .meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.55rem;
            margin-top: 1rem;
        }

        .meta-chip {
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #fff;
            color: var(--secondary-blue);
            padding: 0.34rem 0.7rem;
            font-size: 0.82rem;
            font-weight: 800;
        }

        .document-card {
            margin-top: clamp(1.5rem, 4vw, 2.4rem);
            padding: clamp(1.15rem, 4vw, 2.35rem);
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 22px 55px rgba(30, 58, 95, 0.10);
        }

        .document-content {
            font-size: 1.02rem;
        }

        .document-content h3 {
            margin: 0 0 1rem;
            color: var(--primary-blue);
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(1.75rem, 6vw, 2.8rem);
            line-height: 1.05;
        }

        .document-content h4 {
            margin: 2rem 0 0.65rem;
            color: var(--secondary-blue);
            font-size: 1.12rem;
            line-height: 1.3;
        }

        .document-content h5 {
            margin: 1.3rem 0 0.45rem;
            color: var(--primary-blue);
            font-size: 1rem;
        }

        .document-content p,
        .document-content li {
            color: #26364b;
        }

        .document-content ul {
            padding-inline-start: 1.35rem;
        }

        .signature-section {
            margin-top: clamp(1.5rem, 4vw, 2.5rem);
            padding: clamp(1.15rem, 4vw, 2rem);
            border: 1px solid rgba(201, 162, 39, 0.38);
            border-radius: 8px;
            background: #fffaf0;
        }

        .signature-section h2 {
            margin: 0 0 0.6rem;
            color: var(--primary-blue);
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(1.55rem, 5vw, 2.3rem);
            line-height: 1;
        }

        .signature-note {
            margin: 0 0 1rem;
            color: var(--muted);
        }

        .signature-check {
            display: flex;
            gap: 0.7rem;
            align-items: flex-start;
            color: #21324a;
            font-weight: 800;
        }

        .signature-check input {
            width: 18px;
            height: 18px;
            margin-top: 0.25rem;
            accent-color: var(--primary-blue);
            flex: 0 0 auto;
        }

        .sign-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .sign-button {
            min-height: 42px;
            border: none;
            border-radius: 8px;
            background: var(--primary-blue);
            color: white;
            cursor: pointer;
            padding: 0.68rem 1rem;
            font-size: 0.95rem;
            font-weight: 900;
            box-shadow: 0 10px 22px rgba(30, 58, 95, 0.18);
        }

        .sign-button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
            box-shadow: none;
        }

        .status {
            color: #166534;
            font-weight: 900;
        }

        .status.error {
            color: #9a3412;
        }

        @media (max-width: 640px) {
            .document-toolbar-inner {
                width: min(100% - 20px, 1120px);
                min-height: 58px;
            }

            .brand img {
                width: 34px;
                height: 34px;
            }

            .brand-title {
                font-size: 1.02rem;
            }

            .brand-subtitle {
                display: none;
            }

            .toolbar-actions {
                gap: 0.35rem;
            }

            .toolbar-link,
            .language-toggle {
                min-height: 34px;
                padding: 0.42rem 0.58rem;
                font-size: 0.78rem;
            }

            main {
                width: min(100% - 20px, 940px);
                padding-top: 1.35rem;
            }
        }
    </style>
    <link rel="stylesheet" href="/css/bna-site-nav.css">
</head>
<body>
    <div id="siteNavMount" data-bna-site-nav data-nav-context="registration-document"></div>
    <script src="/js/bna-site-nav.js"></script>

    <main>
        <p class="eyebrow" id="eyebrow">Required Document</p>
        <h1 id="pageTitle">Registration Document</h1>
        <p class="intro" id="pageIntro">Read this document as a normal page. The signature section appears after the full document.</p>
        <div class="meta-row">
            <span class="meta-chip" id="versionChip">Version</span>
            <span class="meta-chip" id="languageChip">English</span>
        </div>

        <article class="document-card">
            <div class="document-content" id="documentContent">Loading document...</div>
        </article>

        <section class="signature-section" id="signatureSection">
            <h2 id="signatureTitle">Electronic signature</h2>
            <p class="signature-note" id="signatureNote">Clicking the signature button records your signature for the signup form.</p>
            <label class="signature-check" for="signatureCheck">
                <input type="checkbox" id="signatureCheck">
                <span id="signatureCheckText">I have read and agree to this document.</span>
            </label>
            <div class="sign-row">
                <button class="sign-button" id="signButton" type="button" disabled>Sign Document</button>
                <span class="status" id="signatureStatus"></span>
            </div>
        </section>
    </main>

    <div id="siteFooterMount" data-bna-site-footer></div>

    <script src="/js/signup-documents.js"></script>
    <script src="/js/registration-document-page.js"></script>
    <script src="/js/bna-helper-knowledge.js"></script>
    <script src="/js/bna-bot-widget.js"></script>
</body>
</html>
