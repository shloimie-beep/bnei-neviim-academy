                    <span class="metric-value">${Number(value || 0)}</span>
                    <span class="metric-note">${escapeHtml(note)}</span>
                </button>
            `;
        }

        function renderTaskFocusedLane(state) {
            return `
                <section class="focus-panel" aria-label="${escapeHtml(state.title)}">
                    ${renderTaskOverviewStrip({
                        title: state.title,
                        filteredCount: state.filteredTasks.length,
                        totalCount: state.focusTasks.length,
                        decisionCount: state.decisionCount,
                        myTaskCount: state.myTaskCount,
                        codexQueueCount: state.codexQueueCount,
                        changelogCount: state.changelogCount,
                    })}
                    ${renderTaskFilterPanel(state)}
                    ${state.focus === 'changelog' ? renderCodexStatusDetails(state.buckets) : ''}
                    ${renderTaskListSection(state.title, state.filteredTasks, state.focus)}
                </section>
            `;
        }

        function renderTaskFilterPanel(state) {
            return `
                <details class="filter-details">
                    <summary>Filter</summary>
                    <div class="filter-details-body">
                        <div class="filter-row">
                            <span class="filter-label">Urgency</span>
                            ${renderTaskMiniFilter('urgency', 'all', 'All', taskUrgencyFilter)}
                            ${renderTaskMiniFilter('urgency', 'urgent', 'Urgent', taskUrgencyFilter)}
                            ${renderTaskMiniFilter('urgency', 'today', 'Today', taskUrgencyFilter)}
                            ${renderTaskMiniFilter('urgency', 'this_week', 'This week', taskUrgencyFilter)}
                            ${renderTaskMiniFilter('urgency', 'low', 'Low', taskUrgencyFilter)}
                        </div>
                        <div class="filter-row">
                            <span class="filter-label">Date</span>
                            ${renderTaskMiniFilter('date', 'all', 'All', taskDateFilter)}
                            ${renderTaskMiniFilter('date', 'today', 'Today', taskDateFilter)}
                            ${renderTaskMiniFilter('date', 'week', '7 days', taskDateFilter)}
                            ${renderTaskMiniFilter('date', 'month', '30 days', taskDateFilter)}
                        </div>
                        <div class="filter-row">
                            <span class="filter-label">Project</span>
                            ${renderTaskProjectFilters(state.projectCounts)}
                        </div>
                    </div>
                </details>
            `;
        }

        function renderCodexStatusDetails(buckets) {
            const queue = agentFleetStatus?.queue || {};
            const fleet = agentFleetStatus?.fleet || {};
            const queued = Number(queue.pending ?? buckets.changelog.filter(task => taskIsMachine(task) && !task.completed_at && !task.verified_at && normalizeTaskStage(task.stage) !== 'done').length ?? 0);
            const inProgress = Number(queue.in_progress ?? 0);
            const heartbeat = fleet.last_seen_at ? `Last seen ${formatDateTime(fleet.last_seen_at)}.` : 'No heartbeat recorded yet.';
            return `
                <details class="workflow-details">
                    <summary>Agent queue status</summary>
                    <p>${queued} queued, ${inProgress} in progress. ${escapeHtml(heartbeat)}</p>
                </details>
            `;
        }

        function renderTaskFilter(id, label, count) {
            return `
                <button class="task-filter ${taskFocus === id ? 'active' : ''}" onclick="setTaskFocus('${id}')">
                    <span>${escapeHtml(label)}</span>
                    <span class="task-filter-count">${count}</span>
                </button>
            `;
        }

        function renderTaskOverviewStrip(state = {}) {
            const activeFilters = taskActiveFilterLabels();
            const filterNote = activeFilters.length
                ? activeFilters.map(label => `<span class="task-filter-pill">${escapeHtml(label)}</span>`).join('')
                : '<span class="task-filter-pill">No extra filters</span>';

            return `
                <div class="task-overview-strip">
                    <div class="task-overview-card primary">
                        <div>
                            <div class="task-overview-label">Current task view</div>
                            <div class="task-overview-value">${escapeHtml(state.title || 'Tasks')}</div>
                        </div>
                        <div class="task-overview-note">Showing ${Number(state.filteredCount || 0)} of ${Number(state.totalCount || 0)} item${Number(state.totalCount || 0) === 1 ? '' : 's'} in this lane.</div>
                        <div class="task-filter-summary">
                            ${filterNote}
                            ${activeFilters.length ? '<button class="task-reset-button" onclick="resetTaskFilters()">Clear filters</button>' : ''}
                        </div>
                    </div>
                    ${renderTaskOverviewButton('decisions', 'Decisions', state.decisionCount, 'Choices needed')}
                    ${renderTaskOverviewButton('mine', 'My Work', state.myTaskCount, 'Operator tasks')}
                    ${renderTaskOverviewButton('changelog', 'Changelog', state.changelogCount, `${Number(state.codexQueueCount || 0)} queued`)}
                </div>
            `;
        }

        function renderTaskOverviewButton(focus, label, value, note) {
            return `
                <button class="task-overview-card ${taskFocus === focus ? 'active' : ''}" onclick="setTaskFocus('${focus}')">
                    <div class="task-overview-label">${escapeHtml(label)}</div>
                    <div class="task-overview-value">${Number(value || 0)}</div>
                    <div class="task-overview-note">${escapeHtml(note)}</div>
                </button>
            `;
        }

        function taskActiveFilterLabels() {
            const labels = [];
            if (taskUrgencyFilter !== 'all') labels.push(`Urgency: ${formatUrgency(taskUrgencyFilter)}`);
            if (taskDateFilter !== 'all') labels.push(`Date: ${taskDateFilterLabel(taskDateFilter)}`);
            if (selectedProjectFilter()) labels.push(`Workspace: ${activeWorkspaceProjectLabel()}`);
            else if (taskProjectFilter !== 'all') labels.push(`Project: ${taskProjectLabel({ project_key: taskProjectFilter })}`);
            return labels;
        }

        function taskDateFilterLabel(filter) {
            return ({
                today: 'Today',
                week: 'Last 7 days',
                month: 'Last 30 days'
            })[filter] || 'All';
        }

        function renderTaskMiniFilter(kind, value, label, currentValue) {
            return `
                <button class="filter-chip ${currentValue === value ? 'active' : ''}" onclick="setTaskFilter('${kind}', '${value}')">
                    ${escapeHtml(label)}
                </button>
            `;
        }

        function renderTaskProjectFilters(counts = {}) {
            const lockedProject = selectedProjectFilter();
            if (lockedProject) {
                return `<span class="filter-chip active locked" aria-label="Active workspace filter">Workspace: ${escapeHtml(activeWorkspaceProjectLabel())}</span>`;
            }
            const allCount = Object.values(counts).reduce((sum, count) => sum + Number(count || 0), 0);
            const projectButtons = availableProjects().map(project => {
                const key = project.project_key;
                const count = counts[key] || 0;
                const label = `${project.short_name || project.name || key} (${count})`;
                return renderTaskMiniFilter('project', key, label, taskProjectFilter);
            }).join('');
            return `${renderTaskMiniFilter('project', 'all', `All (${allCount})`, taskProjectFilter)}${projectButtons}`;
        }

        function renderTaskListSection(label, items, columnId) {
            return `
                <div class="task-list-section">
                    <div class="task-section-header">
                        <h3>${escapeHtml(label)}</h3>
                        <span>${items.length} item${items.length === 1 ? '' : 's'}</span>
                    </div>
                    <div class="task-list">
                        ${items.length ? items.map(task => renderTaskCard(task, taskColumn(task) || columnId)).join('') : renderTaskEmpty(columnId)}
                    </div>
                </div>
            `;
        }

        function renderTaskEmpty(columnId) {
            const message = ({
                decisions: 'No decisions waiting. Good. The bot should only ask when your choice changes the outcome.',
                mine: 'No personal tasks in this focus.',
                changelog: 'No agent queue or changelog items shown yet.'
            })[columnId] || 'Nothing here right now.';
            return `<div class="task-empty">${escapeHtml(message)}</div>`;
        }

        function renderTaskCard(task, columnId) {
            const detail = taskDisplayDetail(task, columnId);

            return `
                <div class="task-row" title="${escapeHtml(task.title || '')}" onclick="editTask(${Number(task.id)})">
                    <div class="task-row-main">
                        <div class="task-row-title">${escapeHtml(taskDisplayTitle(task))}</div>
                        ${detail ? `<div class="task-row-detail">${escapeHtml(detail)}</div>` : ''}
                        <div class="task-row-meta primary-only">
                            <span class="badge badge-project-${taskProjectKey(task)}">${escapeHtml(taskProjectLabel(task))}</span>
                            <span class="badge badge-urgency-${task.urgency}">${formatUrgency(task.urgency)}</span>
                            <span class="badge">${escapeHtml(taskOwnerLabel(task))}</span>
                            <span class="badge">${escapeHtml(taskStageLabel(task))}</span>
                            ${task.decision_required ? '<span class="badge badge-decision">Decision Required</span>' : ''}
                            ${Number(task.comment_count || 0) ? `<span class="badge">${Number(task.comment_count)} comment${Number(task.comment_count) === 1 ? '' : 's'}</span>` : ''}
                            ${task.due_date ? `<span class="badge">Due ${formatDate(task.due_date)}</span>` : ''}
                            ${task.completed_at ? `<span class="badge">Done ${formatDateTime(task.completed_at)}</span>` : ''}
                            ${task.verified_at ? `<span class="badge">Verified ${formatDateTime(task.verified_at)}</span>` : ''}
                        </div>
                        <div class="task-open-cue">Open card for notes, raw capture, verification, and full metadata.</div>
                    </div>
                    <div class="task-row-actions" onclick="event.stopPropagation()">
                        ${renderTaskActions(task, columnId)}
                    </div>
                </div>
            `;
        }

        function renderTaskActions(task, columnId) {
            const id = Number(task.id);
            if (columnId === 'decisions') {
                const options = decisionOptionLabels(task);
                if (options.length) {
                    return options.map(option => `
                        <button class="task-action primary" onclick="taskDecisionAction(event, ${id}, ${JSON.stringify(option).replace(/"/g, '&quot;')})">${escapeHtml(option.label)}</button>
                    `).join('');
                }
                return `
                    <button class="task-action primary" onclick="taskAction(event, ${id}, { stage: 'assigned', assigned_to: 'Shloimie' })">Turn into my task</button>
                    <button class="task-action" onclick="taskAction(event, ${id}, { stage: 'archive' })">Hide</button>
                `;
            }
            if (columnId === 'mine' || columnId === 'rabbi') {
                const stage = normalizeTaskStage(task.stage);
                if (stage === 'in_progress') {
                    return `
                        <button class="task-action primary" onclick="taskAction(event, ${id}, { stage: 'done', completed_at: new Date().toISOString(), verified_at: new Date().toISOString() })">Done</button>
                    `;
                }
                return `
                    <button class="task-action primary" onclick="taskAction(event, ${id}, { stage: 'in_progress', started_at: new Date().toISOString() })">Start</button>
                    <button class="task-action" onclick="taskAction(event, ${id}, { stage: 'done', completed_at: new Date().toISOString(), verified_at: new Date().toISOString() })">Done</button>
                `;
            }
            if (columnId === 'codex' || columnId === 'changelog') {
                return '';
            }
            return '';
        }

        function renderSummaryCard(label, value, note) {
            return `
                <div class="summary-card">
                    <div class="summary-label">${escapeHtml(label)}</div>
                    <div class="summary-value">${value}</div>
                    <div class="summary-note">${escapeHtml(note)}</div>
                </div>
            `;
        }

        function renderContacts() {
            const visibleSignups = signups.filter(signup => contactMatchesSection(signup, contactSection));
            if (!visibleSignups.some(signup => contactKey(signup) === selectedContactKey)) {
                selectedContactKey = visibleSignups.length ? contactKey(visibleSignups[0]) : null;
            }
            const selectedSignup = visibleSignups.find(signup => contactKey(signup) === selectedContactKey) || null;
            const contactMeta = contactSectionMeta(contactSection);
            return `
                <div class="container">
                    <div class="page-heading">
                        <div>
                            <div class="page-kicker">Roster</div>
                            <h2>${escapeHtml(contactMeta.title)}</h2>
                            <p>${escapeHtml(contactMeta.description)}</p>
                        </div>
                        <div class="page-heading-actions">
                            <span class="page-status-pill">${visibleSignups.length} visible</span>
                            <span class="page-status-pill">${signups.length} total</span>
                        </div>
                    </div>
                    ${renderSectionNav(CONTACT_SUBTABS, contactSection, 'setContactSection')}
                    ${signups.length === 0 ? `
                        <div class="contact-empty-card">
                            No contacts yet. Send the signup form or capture a parent/payment note in Telegram.
                        </div>
                    ` : visibleSignups.length === 0 ? `
                        <div class="contact-empty-card">
                            No contacts match this view.
                        </div>
                    ` : `
                        <div class="contact-layout">
                            <div class="contact-list">
                                ${visibleSignups.map(renderContactCard).join('')}
                            </div>
                            ${renderContactDetailPanel(selectedSignup)}
                        </div>
                    `}
                </div>
            `;
        }

        function contactSectionMeta(section) {
            return ({
                parents: {
                    title: 'Parents',
                    description: 'Compact parent roster cards. Open a card for full contact, signup, payment, notes, and tags.',
                },
                students: {
                    title: 'Students',
                    description: 'Student-linked contacts, kept compact so each student can open into the parent/contact detail.',
                },
                intake: {
                    title: 'Intake',
                    description: 'Newer signup/intake records that still need review, contact completion, or enrollment follow-up.',
                },
                follow_up: {
                    title: 'Needs Follow-up',
                    description: 'Parents who still need payment, missing contact info, or signup/admin follow-up.',
                },
                tags: {
                    title: 'Tags',
                    description: 'Contacts grouped through existing tags without expanding huge cards inline.',
                },
            })[section] || {
                title: 'Parents',
                description: 'Compact parent roster cards.',
            };
        }

        function renderContactCard(signup) {
            const key = contactKey(signup);
            const paymentStatus = normalizePaymentStatusKey(signup.payment_status);
            const missingContact = !String(signup.parent_email || '').trim() || !String(signup.parent_phone || '').trim();
            return `
                <button class="contact-card ${key === selectedContactKey ? 'active' : ''}" type="button" onclick="selectContact(${attrJson(key)})">
                    <div class="contact-card-top">
                        <div class="contact-card-copy">
                            <div class="contact-card-title">${escapeHtml(signup.parent_name || 'Unknown parent')}</div>
                            <div class="contact-card-subtitle">${escapeHtml(signup.student_name || 'Student not entered yet')}</div>
                        </div>
                        <span class="payment-status ${escapeHtml(paymentStatus)}">${escapeHtml(paymentStatusLabel(paymentStatus))}</span>
                    </div>
                    <div class="contact-card-contact">
                        ${escapeHtml(signup.parent_email || 'No email yet')}
                        ${signup.parent_phone ? ` · ${escapeHtml(signup.parent_phone)}` : ' · No phone yet'}
                    </div>
                    <div class="contact-card-meta">
                        <div class="tag-list">
                            ${(signup.tags || []).slice(0, 3).map(tag => `<span class="tag ${escapeHtml(cssToken(tag))}">${escapeHtml(tag)}</span>`).join('') || '<span class="tag">No tags</span>'}
                        </div>
                        ${missingContact ? '<span class="page-status-pill">Missing contact</span>' : ''}
                    </div>
                </button>
            `;
        }

        function renderContactDetailPanel(signup) {
            if (!signup) {
                return `<aside class="contact-detail-panel"><div class="contact-detail-note">Select a contact to see details.</div></aside>`;
            }
            const paymentStatus = normalizePaymentStatusKey(signup.payment_status);
            const paidDate = signup.last_payment_at || signup.cash_received_at || (paymentStatus === 'paid' ? signup.updated_at : null);
            const studentMeta = [signup.student_age ? `Age ${signup.student_age}` : '', signup.student_grade ? `Grade ${signup.student_grade}` : '']
                .filter(Boolean)
                .join(' · ');
            const applicationNotes = [
                signup.previous_school ? `Previous school: ${signup.previous_school}` : '',
                signup.reason_applying ? `Reason applying: ${signup.reason_applying}` : '',
                signup.special_needs ? `Special notes: ${signup.special_needs}` : '',
                signup.notes ? `Notes: ${signup.notes}` : ''
            ].filter(Boolean);
            const linkedStudent = students.find(student => String(student.name || '').toLowerCase() === String(signup.student_name || '').toLowerCase());
            const timeline = [
                signup.created_at ? `Signup created ${formatDateTime(signup.created_at)}` : '',
                signup.updated_at ? `Last updated ${formatDateTime(signup.updated_at)}` : '',
                paidDate ? `Payment recorded ${formatDateTime(paidDate)}` : '',
                signup.ghl_synced_at ? `GHL synced ${formatDateTime(signup.ghl_synced_at)}` : '',
                signup.confirmation_email_sent_at ? `Confirmation email sent ${formatDateTime(signup.confirmation_email_sent_at)}` : ''
            ].filter(Boolean);

            return `
                <aside class="contact-detail-panel">
                    <div class="contact-detail-header">
                        <div>
                            <div class="contact-detail-title">${escapeHtml(signup.parent_name || 'Unknown parent')}</div>
                            <div class="contact-detail-note">${escapeHtml(signup.student_name || 'Student not entered yet')}${studentMeta ? ` · ${escapeHtml(studentMeta)}` : ''}</div>
                        </div>
                        <span class="payment-status ${escapeHtml(paymentStatus)}">${escapeHtml(paymentStatusLabel(paymentStatus))}</span>
                    </div>
                    <div class="contact-action-row" style="margin-bottom:14px;">
                        ${signup.parent_email ? `<a class="task-action primary" href="mailto:${escapeHtml(signup.parent_email)}">Email</a>` : '<button class="task-action" disabled>Email missing</button>'}
                        ${signup.parent_phone ? `<a class="task-action" href="https://wa.me/${escapeHtml(String(signup.parent_phone).replace(/[^0-9]/g, ''))}" target="_blank" rel="noopener">WhatsApp</a>` : '<button class="task-action" disabled>No phone</button>'}
                        <button class="task-action" onclick="setContactSection('follow_up')">Mark follow-up</button>
                        ${linkedStudent ? `<button class="task-action" onclick="selectStudentAndOpen(${Number(linkedStudent.id)}, 'profile')">Open student</button>` : '<button class="task-action" disabled>No linked student</button>'}
                    </div>
                    <div class="contact-detail-grid">
                        ${renderContactDetailItem('Parent Email', signup.parent_email || 'Not entered')}
                        ${renderContactDetailItem('Parent Phone', signup.parent_phone || 'Not entered')}
                        ${renderContactDetailItem('Linked Student', signup.student_name || 'Not entered')}
                        ${renderContactDetailItem('Form Source', signup.form_source || signup.source || 'Signup / manual intake')}
                        ${renderContactDetailItem('Language', signup.language || signup.preferred_language || 'Not set')}
                        ${renderContactDetailItem('Signup Status', signup.status || 'new')}
                        ${renderContactDetailItem('Payment Method', signup.payment_method || 'Not set')}
                        ${renderContactDetailItem('Payment Amount', signup.payment_amount ? `${signup.payment_currency || 'ILS'} ${signup.payment_amount}` : 'Not set')}
                        ${renderContactDetailItem('Paid Date', paidDate ? formatDate(paidDate) : 'Not paid yet')}
                        ${renderContactDetailItem('Next Due', signup.payment_due_date ? formatDate(signup.payment_due_date) : 'Not scheduled')}
                        ${renderContactDetailItem('Created', signup.created_at ? formatDate(signup.created_at) : 'Unknown')}
                    </div>
                    <div class="contact-detail-section">
                        <h3>Tags</h3>
                        <div class="tag-list">
                            ${(signup.tags || []).map(tag => `<span class="tag ${escapeHtml(cssToken(tag))}">${escapeHtml(tag)}</span>`).join('') || '<span class="tag">No tags yet</span>'}
                        </div>
                    </div>
                    ${applicationNotes.length ? `
                        <div class="contact-detail-section">
                            <h3>Application Notes</h3>
                            <div class="contact-detail-note">${applicationNotes.map(escapeHtml).join('<br>')}</div>
                        </div>
                    ` : ''}
                    <div class="contact-detail-section">
                        <h3>History / Timeline</h3>
                        <div class="mini-list">
                            ${timeline.length ? timeline.map(item => `<div class="mini-list-item"><span>${escapeHtml(item)}</span></div>`).join('') : '<div class="contact-detail-note">No timeline records are available yet.</div>'}
                        </div>
                    </div>
                </aside>
            `;
        }

        function renderContactDetailItem(label, value) {
            return `
                <div class="contact-detail-item">
                    <span class="contact-detail-label">${escapeHtml(label)}</span>
                    <div class="contact-detail-value">${escapeHtml(value || 'Not set')}</div>
                </div>
            `;
        }

        function contactKey(signup) {
            return String(signup?.id || signup?.parent_email || `${signup?.parent_name || ''}:${signup?.student_name || ''}` || '');
        }

        function cssToken(value) {
            return String(value || '').toLowerCase().replace(/[^a-z0-9_-]+/g, '_').replace(/^_+|_+$/g, '') || 'tag';
        }

        function contactMatchesSection(signup, section) {
            const status = String(signup.status || '').toLowerCase();
            const paymentStatus = normalizePaymentStatusKey(signup.payment_status);
            const missingContact = !String(signup.parent_email || '').trim() || !String(signup.parent_phone || '').trim();
            if (section === 'students') return Boolean(String(signup.student_name || '').trim());
            if (section === 'intake') return ['new', 'contacted', 'interview_scheduled'].includes(status) || missingContact;
            if (section === 'follow_up') return missingContact || paymentStatus !== 'paid' || ['new', 'contacted'].includes(status);
            if (section === 'tags') return Array.isArray(signup.tags) && signup.tags.length > 0;
            return true;
        }

        function renderAccounting() {
            const activeSignups = signups.filter(s => !['archived', 'inactive'].includes(String(s.status || '').toLowerCase()));
            const openIntake = paymentIntake.filter(isUnresolvedPaymentIntake);
            const rosterRows = buildPaymentRoster(activeSignups, openIntake);
            const visibleRows = rosterRows.filter(row => paymentRosterMatchesSection(row, accountingSection));
            const paidCount = rosterRows.filter(row => row.statusKey === 'paid' || row.statusKey === 'needs_signup').length;
            const openCount = rosterRows.filter(row => row.statusKey !== 'paid' && row.statusKey !== 'needs_signup').length;
            const needsSignupCount = rosterRows.filter(row => row.source === 'intake').length;
            const partialCount = rosterRows.filter(row => row.statusKey === 'partial').length;
            const nextDueCount = rosterRows.filter(row => row.nextDue).length;
            const sectionMeta = accountingSectionMeta(accountingSection);

            return `
                <div class="container">
                    <div class="page-heading accounting-header">
                        <div>
                            <div class="page-kicker">Accounting</div>
                            <h2>${escapeHtml(sectionMeta.title)}</h2>
                            <p>${escapeHtml(sectionMeta.description)}</p>
                        </div>
                        <div class="page-heading-actions">
                            <span class="page-status-pill">${visibleRows.length} visible</span>
                            <span class="page-status-pill">${paidCount} paid</span>
                            <span class="page-status-pill">${openCount} open</span>
                        </div>
                    </div>
                    ${renderSectionNav(ACCOUNTING_SUBTABS, accountingSection, 'setAccountingSection')}
                    <div class="accounting-summary-grid">
                        ${renderAccountingSummaryCard('Total records', rosterRows.length, 'active signups plus unresolved intake')}
                        ${renderAccountingSummaryCard('Paid', paidCount, 'paid or paid but needs signup')}
                        ${renderAccountingSummaryCard('Open', openCount, 'not paid or partially paid')}
                        ${renderAccountingSummaryCard('Needs signup', needsSignupCount, 'paid before form is complete')}
                        ${renderAccountingSummaryCard('Partial', partialCount, 'partial payment records')}
                        ${renderAccountingSummaryCard('Next due', nextDueCount, 'records with a scheduled due date')}
                    </div>
                    ${accountingSection === 'overview'
                        ? renderAccountingOverview(rosterRows)
                        : renderPaymentRosterTable(visibleRows, rosterRows.length === 0 ? 'No payment records yet.' : 'No payment records match this view.')}
                </div>
            `;
        }

        function isUnresolvedPaymentIntake(intake) {
            const status = String(intake?.status || '').toLowerCase();
            return !['completed', 'ignored', 'matched'].includes(status);
        }

        function accountingSectionMeta(section) {
            return ({
                overview: {
                    title: 'Overview',
                    description: 'Compact totals only: paid, unpaid, needs-review, paid-needs-signup, and next due.',
                },
                payments: {
                    title: 'Payments',
                    description: 'All payment records/cards with amount, method, status, paid date, next due, and contact info.',
                },
                open: {
                    title: 'Needs Attention',
                    description: 'Unpaid, partial, and unresolved payment records that need review or follow-up.',
                },
                paid: {
                    title: 'Paid',
                    description: 'Paid records and paid-before-signup records.',
                },
                needs_signup: {
                    title: 'Needs Signup',
                    description: 'Payments that exist but still need a signup/contact match.',
                },
                exceptions: {
                    title: 'Exceptions',
                    description: 'Mismatches, missing contact details, partial payments, and records needing manual review.',
                },
            })[section] || {
                title: 'Overview',
                description: 'Compact accounting view.',
            };
        }

        function renderAccountingOverview(rosterRows) {
            const nextDueRows = rosterRows.filter(row => row.nextDue).slice(0, 6);
            const attentionRows = rosterRows
                .filter(row => paymentRosterMatchesSection(row, 'exceptions') || paymentRosterMatchesSection(row, 'open'))
                .slice(0, 6);
            return `

        function paymentRosterMatchesSection(row, section) {
            const missingContact = !String(row.email || '').trim() || !String(row.phone || '').trim();
            if (section === 'payments') return true;
            if (section === 'open') return !['paid', 'needs_signup'].includes(row.statusKey);
            if (section === 'paid') return row.statusKey === 'paid' || row.statusKey === 'needs_signup';
            if (section === 'needs_signup') return row.statusKey === 'needs_signup' || row.source === 'intake';
            if (section === 'exceptions') return row.source === 'intake' || row.statusKey === 'partial' || row.statusKey === 'needs_matching' || missingContact;

        function buildPaymentRoster(activeSignups, openIntake) {
            const latestPaymentsBySignup = new Map();
            [...payments].sort((a, b) => new Date(b.received_at || b.created_at || 0) - new Date(a.received_at || a.created_at || 0))
                .forEach(payment => {
                    const signupId = payment.signup_id || payment.signup?.id;
                    if (signupId && !latestPaymentsBySignup.has(String(signupId))) {
                        latestPaymentsBySignup.set(String(signupId), payment);
                    }
                });

            const signupRows = activeSignups.map(signup => {
                const latestPayment = latestPaymentsBySignup.get(String(signup.id)) || {};
                const statusKey = normalizePaymentStatusKey(signup.payment_status);
                return {
                    source: 'signup',
                    sortName: `${signup.parent_name || ''} ${signup.student_name || ''}`.toLowerCase(),
                    parentName: signup.parent_name || 'Unknown parent',
                    studentName: signup.student_name || '',
                    email: signup.parent_email || '',
                    phone: signup.parent_phone || '',
                    amount: signup.payment_amount || latestPayment.amount || 1000,
                    method: signup.payment_method || latestPayment.method || '',
                    statusKey,
                    statusLabel: paymentStatusLabel(statusKey),
                    paidAt: signup.last_payment_at || signup.cash_received_at || latestPayment.received_at || latestPayment.created_at || (statusKey === 'paid' ? signup.updated_at : null),
                    nextDue: signup.payment_due_date || null,
                    nextDueLabel: signup.payment_due_date ? '' : 'No due date set',
                };
            });

            const intakeRows = openIntake.map(intake => ({
                source: 'intake',
                sortName: `${intake.parent_name || ''} ${intake.student_name || ''}`.toLowerCase(),
                parentName: intake.parent_name || 'Unknown parent',
                studentName: intake.student_name || '',
                email: intake.parent_email || '',
                phone: intake.parent_phone || '',
                amount: intake.amount || '',
                method: intake.method || '',
                statusKey: normalizePaymentStatusKey(intake.status),
                statusLabel: paymentStatusLabel(normalizePaymentStatusKey(intake.status)),
                paidAt: intake.received_at || intake.created_at || null,
                nextDue: null,
                nextDueLabel: 'Signup needed first',
            }));

            return [...signupRows, ...intakeRows].sort((a, b) => {
                const priority = { pending: 0, partial: 1, needs_signup: 2, needs_matching: 2, paid: 3 };
                const aPriority = priority[a.statusKey] ?? 2;
                const bPriority = priority[b.statusKey] ?? 2;
                if (aPriority !== bPriority) return aPriority - bPriority;
                return a.sortName.localeCompare(b.sortName);
            });
        }

        function normalizePaymentStatusKey(status) {
            const key = String(status || 'pending').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
            if (key === 'paid') return 'paid';
            if (key === 'partial') return 'partial';
            if (key === 'needs_signup') return 'needs_signup';
            if (key === 'needs_matching') return 'needs_matching';
            return 'pending';
        }

        function paymentStatusLabel(statusKey) {
            return ({
                paid: 'Paid',
                partial: 'Partial',
                needs_signup: 'Paid, needs signup',
                needs_matching: 'Paid, needs match',
                pending: 'Not paid',
            })[statusKey] || 'Open';
        }

            const selectedJobs = filteredJobs.filter(job => selectedContentJobIds.has(Number(job.id)));
            const repurposeJobs = filteredJobs.filter(job => ['transcribed', 'parsing', 'drafting', 'needs_approval', 'approved'].includes(String(job.status || '').toLowerCase()));
            const openJobs = filteredJobs.filter(job => !['published'].includes(job.status));
            const transcribingJobs = visibleJobs.filter(job => ['ingested', 'transcribing'].includes(job.status)).length;

                image: visibleJobs.filter(job => contentMediaType(job) === 'image').length,

        function goalBoardMetadata(event = {}) {
            const parsed = parseJsonField(event.metadata) || {};
            const raw = parsed.goal_board && typeof parsed.goal_board === 'object' ? parsed.goal_board : parsed;
            const source = ['self', 'admin', 'classroom', 'private_meeting'].includes(raw.source) ? raw.source : 'admin';
            const consequence = raw.consequence && typeof raw.consequence === 'object' ? raw.consequence : {};
            const agreement = raw.agreement && typeof raw.agreement === 'object' ? raw.agreement : {};
            const classroom = raw.classroom && typeof raw.classroom === 'object' ? raw.classroom : {};
            return {
                source,
                category: raw.category || event.topic || '',
                urgency: raw.urgency || 'this_week',
                status: raw.status || 'active',
                due_at: raw.due_at || '',
                optional_scheduled_at: raw.optional_scheduled_at || '',
                student_owned: Boolean(raw.student_owned || source === 'self'),
                approval_required: Boolean(raw.approval_required),
                approval_status: raw.approval_status || (raw.approval_required ? 'pending_review' : 'approved'),
                student_summary: raw.student_summary || '',
                private_note: raw.private_note || event.notes || '',
                reflection_note: raw.reflection_note || '',
                classroom,
                agreement: {
                    type: agreement.type || raw.agreement_type || '',
                    bedtime_time: agreement.bedtime_time || raw.bedtime_time || '',
                    wake_time: agreement.wake_time || raw.wake_time || '',
                    student_commitment: agreement.student_commitment || raw.student_commitment || '',
                    chosen_consequence: agreement.chosen_consequence || raw.chosen_consequence || ''
                },
                consequence: {
                    status: consequence.status || 'none',
                    approval_required: consequence.approval_required !== false,
                    recovery_path: consequence.recovery_path || '',
                    device_access_state: consequence.device_access_state || '',
                    duration_minutes: consequence.duration_minutes || '',
                    auto_apply_on_completion: Boolean(consequence.auto_apply_on_completion),
                    success_device_access_state: consequence.success_device_access_state || '',
                    success_duration_minutes: consequence.success_duration_minutes || '',
                    success_applied_at: consequence.success_applied_at || '',
                    review_reason: consequence.review_reason || ''
                }
            };
        }

        function dateOnlyKey(value = null) {
            const date = value ? new Date(value) : new Date();
            if (!Number.isFinite(date.getTime())) return '';
            return date.toISOString().slice(0, 10);
        }

        function goalBoardStatus(event) {
            const meta = goalBoardMetadata(event);
            const progress = Number(event.progress_percent || 0);
            if (meta.status === 'archived') return 'archived';
            if (progress >= 100 || meta.status === 'done') return 'done';
            if (meta.status === 'waiting' || meta.approval_status === 'pending_review' || meta.consequence.status === 'pending_review') return 'waiting';
            if (meta.due_at && dateOnlyKey(meta.due_at) < dateOnlyKey()) return 'overdue';
            return 'active';
        }

        function goalBoardBucket(event) {
            const status = goalBoardStatus(event);
            if (status === 'done') return 'done';
            if (status === 'waiting') return 'waiting';
            if (status === 'archived') return 'archived';
            const dueAt = goalBoardMetadata(event).due_at;
            if (dueAt && dateOnlyKey(dueAt) > dateOnlyKey()) return 'upcoming';
            return 'today';
        }

        function goalBoardSortRank(event) {
            const bucket = goalBoardBucket(event);
            return ({
                waiting: 0,
                today: 1,
                overdue: 2,
                upcoming: 3,
                done: 4,
                archived: 5
            })[bucket] ?? 3;
        }

        function goalBoardFilterMatches(item, filter, deviceList = []) {
            const meta = goalBoardMetadata(item);
            const status = goalBoardStatus(item);
            const progress = goalBoardProgress(item);
            const deviceState = normalizeDeviceAccessState(deviceList[0]?.status || '', 'accountability_only');
            const dueToday = !meta.due_at || dateOnlyKey(meta.due_at) === dateOnlyKey();
            if (filter === 'all') return true;
            if (filter === 'needs_setup') return false;
            if (filter === 'due_today') return status !== 'done' && dueToday;
            if (filter === 'checked_off') return status === 'done' || progress >= 100;
            if (filter === 'missed') return status === 'overdue';
            if (filter === 'access_open') {
                return deviceState === 'approved_access'
                    || deviceState === 'manual_override'
                    || Boolean(meta.consequence.success_applied_at);
            }
            if (filter === 'locked') {
                return ['locked', 'accountability_only', 'expired'].includes(deviceState);
            }
            if (filter === 'needs_review') {
                return status === 'waiting'
                    || meta.approval_status === 'pending_review'
                    || meta.consequence.status === 'pending_review';
            }
            return true;
        }

        function goalBoardSourceLabel(source) {
            return (GOAL_BOARD_SOURCES.find(item => item.id === source)?.label) || 'Admin';
        }

        function goalBoardStatusLabel(event) {
            const status = goalBoardStatus(event);
            if (status === 'overdue') return 'Overdue';
            if (status === 'waiting') return 'Waiting';
            if (status === 'done') return 'Done';
            return 'Active';
        }

        function goalBoardUrgencyLabel(urgency) {
            return ({
                urgent: 'Urgent',
                today: 'Today',
                this_week: 'This week',
                low: 'Low'
            })[urgency] || 'This week';
        }

        function formatGoalDue(value) {
            if (!value) return '';
            const date = new Date(value);
            if (!Number.isFinite(date.getTime())) return '';
            return date.toLocaleString('en-GB', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function goalBoardProgress(event) {
            const progress = Number(event.progress_percent || 0);
            return Number.isFinite(progress) ? Math.max(0, Math.min(100, Math.round(progress))) : 0;
        }

        function studentGoalBoardItems(student, events) {
            return events
                .filter(event => event.event_type === 'student_goal')
                .filter(event => String(event.student_id || '') === String(student.id || '') || String(event.student_name || '').toLowerCase() === String(student.name || '').toLowerCase())
                .filter(event => goalBoardStatus(event) !== 'archived')
                .sort((a, b) => {
                    const aBucket = goalBoardSortRank(a);
                    const bBucket = goalBoardSortRank(b);
                    if (aBucket !== bBucket) return aBucket - bBucket;
                    const aDue = Date.parse(goalBoardMetadata(a).due_at || a.occurred_at || a.created_at || 0);
                    const bDue = Date.parse(goalBoardMetadata(b).due_at || b.occurred_at || b.created_at || 0);
                    return aDue - bDue;
                });
        }

        function goalBoardCounts(items) {
            return GOAL_BOARD_FILTERS.reduce((counts, filter) => {
                counts[filter.id] = items.filter(item => goalBoardFilterMatches(item, filter.id)).length;
                return counts;
            }, {});
        }

        function normalizeDeviceAccessState(value, fallback = 'accountability_only') {
            const normalized = String(value || '')
                .trim()
                .toLowerCase()
                .replace(/[\s-]+/g, '_');
            if (DEVICE_ACCESS_STATES.some(state => state.id === normalized)) return normalized;
            if (normalized === 'approved' || normalized === 'unlock' || normalized === 'unlocked') return 'approved_access';
            if (normalized === 'accountability') return 'accountability_only';
            return DEVICE_ACCESS_STATES.some(state => state.id === fallback) ? fallback : 'accountability_only';
        }

        function deviceAccessLabel(value) {
            const state = normalizeDeviceAccessState(value);
            return DEVICE_ACCESS_STATES.find(item => item.id === state)?.label || 'Accountability Only';
        }

        function deviceAccessBadge(value) {
            const state = String(value || '').trim() === 'not_configured'
                ? 'not_configured'
                : normalizeDeviceAccessState(value, 'accountability_only');
            const label = state === 'not_configured' ? 'Not Configured' : deviceAccessLabel(state);
            return `<span class="access-state-badge ${escapeHtml(state)}">${escapeHtml(label)}</span>`;
        }

        function studentDevices(student) {
            return (devices || [])
                .filter(device => String(device.student_id || device.student?.id || '') === String(student.id || ''))
                .sort((a, b) => Date.parse(b.updated_at || b.created_at || 0) - Date.parse(a.updated_at || a.created_at || 0));
        }

        function preferredDeviceIdForStudent(studentId) {
            const matches = (devices || [])
                .filter(device => String(device.student_id || device.student?.id || '') === String(studentId || ''))
                .sort((a, b) => Date.parse(b.updated_at || b.created_at || 0) - Date.parse(a.updated_at || a.created_at || 0));
            return matches[0]?.id || '';
        }

        function studentAccountabilitySnapshot(student) {
            const events = studentEvents(student);
            const goalItems = studentGoalBoardItems(student, events);
            const deviceList = studentDevices(student);
            const device = deviceList[0] || null;
            const statusRank = { waiting: 0, active: 1, overdue: 2, done: 3 };
            const activeGoal = goalItems
                .slice()
                .filter(item => goalBoardStatus(item) !== 'done')
                .sort((a, b) => (statusRank[goalBoardStatus(a)] ?? 4) - (statusRank[goalBoardStatus(b)] ?? 4))[0]
                || goalItems[0]
                || null;
            const meta = activeGoal ? goalBoardMetadata(activeGoal) : null;
            const deviceState = device ? normalizeDeviceAccessState(device.status) : 'not_configured';
            const status = !goalItems.length
                ? 'needs_setup'
                : pendingDeviceReviews(goalItems).length ? 'needs_review'
                    : deviceState === 'approved_access' || deviceState === 'manual_override' ? 'access_open'
                        : activeGoal && goalBoardStatus(activeGoal) === 'done' ? 'checked_off'
                            : activeGoal && goalBoardStatus(activeGoal) === 'overdue' ? 'missed'
                                : activeGoal && goalBoardFilterMatches(activeGoal, 'due_today', deviceList) ? 'due_today'
                                    : ['locked', 'accountability_only', 'expired'].includes(deviceState) ? 'locked'
                                        : 'due_today';

            return {
                status,
                goal: activeGoal,
                metadata: meta,
                device,
                deviceState,
                deviceLabel: device ? deviceAccessLabel(deviceState) : 'Not Configured',
                accessWindow: device?.active_session ? formatSessionWindow(device.active_session) : '',
            };
        }

        function studentAccountabilityMatches(student, filter) {
            const snapshot = studentAccountabilitySnapshot(student);
            if (filter === 'all') return true;
            return snapshot.status === filter;
        }

        function studentAccountabilityCounts() {
            return ACCOUNTABILITY_FILTERS.reduce((counts, filter) => {
                counts[filter.id] = students.filter(student => studentAccountabilityMatches(student, filter.id)).length;
                return counts;
            }, {});
        }

        function pendingDeviceReviews(items) {
            return (items || []).filter(item => {
                const consequence = goalBoardMetadata(item).consequence || {};
                return consequence.device_access_state && (
                    consequence.status === 'pending_review' ||
                    goalBoardStatus(item) === 'waiting' ||
                    item.approval_status === 'pending_review'
                );
            });
        }

        function formatSessionWindow(session) {
            if (!session) return '';
            const started = session.started_at ? formatDateTime(session.started_at) : '';
            const expires = session.expires_at ? formatDateTime(session.expires_at) : '';
            if (started && expires) return `${started} until ${expires}`;
            return expires ? `Until ${expires}` : started;
        }

        function studentViewState() {
            const torahById = new Map((torahSummary?.students || []).map(student => [String(student.id), student]));
            const accountabilityCounts = studentAccountabilityCounts();
            const visibleStudents = students.filter(student => studentAccountabilityMatches(student, studentAccountabilityFilter));
            const selectedCandidate = students.find(student => String(student.id) === String(selectedStudentId)) || null;
            const filterAffectsSelection = ['overview', 'list'].includes(studentSection);
            const selectedStudent = filterAffectsSelection
                ? (selectedCandidate && studentAccountabilityMatches(selectedCandidate, studentAccountabilityFilter)
                    ? selectedCandidate
                    : visibleStudents[0] || selectedCandidate || students[0] || null)
                : selectedCandidate || visibleStudents[0] || students[0] || null;
            if (!selectedStudentId && selectedStudent) {
                selectedStudentId = selectedStudent.id;
                const url = new URL(window.location.href);
                if (currentView === 'students') {
                    url.searchParams.set('student', selectedStudent.id);
                    window.history.replaceState({}, '', url);
                }
            }

            return {
                torahById,
                accountabilityCounts,
                visibleStudents,
                selectedStudent,
                selectedCandidate
            };

        function renderDeviceCard(device) {

            const reason = session?.reason || providerResult.reason || '';
            return `
                <div class="event-card device-card" data-state="${escapeHtml(state)}">
                    <div class="event-type">Mock Device &middot; ${escapeHtml(device.platform || 'android')}</div>
                    <div class="event-title">${escapeHtml(device.device_name || 'Student tablet')} ${deviceAccessBadge(state)}</div>
                    <div class="event-meta">
                        Provider: ${escapeHtml(device.provider || 'mock')}
                        ${device.provider_device_id ? ` &middot; Provider ID: ${escapeHtml(device.provider_device_id)}` : ''}
                        ${device.last_seen_at ? ` &middot; Last seen ${escapeHtml(formatDateTime(device.last_seen_at))}` : ''}
                    </div>
                    ${session ? `<div class="goal-board-public">Latest session: ${escapeHtml(deviceAccessLabel(session.status))}${formatSessionWindow(session) ? ` &middot; ${escapeHtml(formatSessionWindow(session))}` : ''}</div>` : ''}

                    <div class="form-group">
                        <label for="torah-listening-${student.id}">Engaged Listening Minutes</label>

        function renderMiniKpi(value, label) {
            return `
                <div class="mini-kpi">
                    <strong>${escapeHtml(String(value))}</strong>
                    <span>${escapeHtml(label)}</span>
                </div>

        function renderStudentEventList(events, emptyText) {
            const sorted = events
                .slice()
                .sort((a, b) => Date.parse(b.occurred_at || b.created_at || 0) - Date.parse(a.occurred_at || a.created_at || 0));
            if (!sorted.length) {
                return `<p style="color:#64748b; font-size:13px;">${escapeHtml(emptyText)}</p>`;
            }
            return sorted.slice(0, 12).map(event => `
                <div class="event-card">
                    <div class="event-type">${escapeHtml(formatEventType(event.event_type))}</div>
                    <div class="event-title">${escapeHtml(event.title || event.question_text || 'Student note')}</div>
                    <div class="event-meta">
                        ${event.topic ? `Topic: ${escapeHtml(event.topic)} &middot; ` : ''}
                        ${formatDate(event.occurred_at || event.created_at)}
                    </div>
                    ${renderStudentEventMetrics(event)}
                    ${renderGoalCheckoffActions(event)}
                    ${event.question_text ? `<p style="margin-top: 8px; font-size: 13px;">Question: ${escapeHtml(event.question_text)}</p>` : ''}
                    ${event.notes ? `<p style="margin-top: 8px; color: #cbd5e1; font-size: 13px;">${escapeHtml(event.notes)}</p>` : ''}
                </div>
            `).join('');
        }

        function renderGoalCheckoffActions(event) {
            if (event.event_type !== 'student_goal' || !event.id) return '';
            return `
                <div class="task-actions" style="margin-top:10px;">
                    <button class="task-action" onclick="setGoalProgress(event, ${Number(event.id)}, 0)">Not Yet</button>
                    <button class="task-action" onclick="setGoalProgress(event, ${Number(event.id)}, 50)">Half</button>
                    <button class="task-action primary" onclick="setGoalProgress(event, ${Number(event.id)}, 100)">Done</button>
                </div>
            `;
        }

        function renderStudentEventMetrics(event) {
            const metrics = [];
            if (event.progress_percent !== null && event.progress_percent !== undefined) metrics.push(`${event.progress_percent}% progress`);
            if (event.goal_actual_value || event.goal_target_value) {
                const actual = event.goal_actual_value || 0;
                const target = event.goal_target_value ? ` / ${event.goal_target_value}` : '';
                const unit = event.goal_unit ? ` ${event.goal_unit}` : '';
                metrics.push(`${actual}${target}${unit}`);
            }
            if (event.attendance_status) metrics.push(`Attendance: ${event.attendance_status}`);
            if (event.engagement_level) metrics.push(`Engagement: ${event.engagement_level}`);
            if (event.next_check_in_date) metrics.push(`Next: ${formatDate(event.next_check_in_date)}`);
            if (event.follow_up_required) metrics.push('Follow up');
            if (!metrics.length) return '';
            return `
                <div class="task-row-meta" style="margin-top: 8px;">
                    ${metrics.map(metric => `<span class="badge badge-category-accountability">${escapeHtml(metric)}</span>`).join('')}
                </div>
            `;
        }

        function studentProgressPercent(student, goals) {
            if (Number(student.avg_goal_progress)) return Number(student.avg_goal_progress);
            const values = goals
                .map(goal => Number(goal.progress_percent))
                .filter(value => Number.isFinite(value));
            if (values.length) {
                return Math.round(values.reduce((sum, value) => sum + value, 0) / values.length);
            }
            return goals.length ? Math.min(100, Math.round((goals.filter(goal => /done|met|completed|achieved/i.test(`${goal.title} ${goal.notes}`)).length / goals.length) * 100)) : 0;
        }

        function nextStudentCheckIn(events) {
            const dates = events
                .map(event => event.next_check_in_date)
                .filter(Boolean)
                .map(date => new Date(date))
                .filter(date => Number.isFinite(date.getTime()) && date >= new Date(new Date().toDateString()))
                .sort((a, b) => a - b);
            return dates[0] || null;
        }

        function studentEvents(student) {
            return accountabilityEvents.filter(event => {
                if (String(event.student_id || '') === String(student.id || '')) return true;
                const eventName = String(event.student_name || '').toLowerCase();
                const studentName = String(student.name || '').toLowerCase();
                return eventName && studentName && eventName === studentName;
            });
        }

        function uniqueValues(values) {
            return [...new Set(values.map(value => String(value || '').trim()).filter(Boolean))];
        }
