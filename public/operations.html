<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNA Operations</title>
    <script>
        if (window.location.pathname === '/operations.html' && new URLSearchParams(window.location.search).get('source') === 'pwa') {
            window.location.replace('/operations');
        }
    </script>
    <meta name="theme-color" content="#1e3a5f">
    <link rel="manifest" href="/operations-manifest.json">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" type="image/png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ops-bg: #0b1120;
            --ops-surface: #1e293b;
            --ops-surface-raised: #111827;
            --ops-surface-muted: rgba(15, 23, 42, 0.72);
            --ops-surface-parchment: #f8f1d5;
            --ops-border: #334155;
            --ops-border-soft: rgba(148, 163, 184, 0.22);
            --ops-text: #f8fafc;
            --ops-text-muted: #cbd5e1;
            --ops-text-subtle: #94a3b8;
            --ops-gold: #c9a227;
            --ops-focus: #facc15;
            --ops-danger: #f87171;
            --ops-success: #34d399;
            --ops-radius-card: 8px;
            --ops-radius-control: 8px;
            --ops-space-1: 4px;
            --ops-space-2: 8px;
            --ops-space-3: 12px;
            --ops-space-4: 16px;
            --ops-shadow-panel: 0 18px 50px rgba(2, 6, 23, 0.22);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--ops-bg);
            color: var(--ops-text-muted);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        button,
        input,
        select,
        textarea {
            max-width: 100%;
        }

        /* App Shell */
        .ops-app-shell {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 248px minmax(0, 1fr);
            background: #0b1120;
        }

        .ops-sidebar {
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            border-right: 1px solid #1e293b;
            background: #111827;
            padding: 16px 14px;
            z-index: 210;
        }

        .ops-sidebar-header {
            border-bottom: 1px solid #263244;
            padding: 4px 4px 14px;
            margin-bottom: 12px;
        }

        .ops-brand-lockup {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .ops-brand-logo,
        .mobile-brand-logo {
            flex: 0 0 auto;
            object-fit: contain;
        }

        .ops-brand-logo {
            height: 42px;
            width: 42px;
        }

        .ops-sidebar-title {
            color: #f8fafc;
            font-size: 18px;
            font-weight: 850;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        .ops-sidebar-copy {
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.35;
            margin-top: 5px;
        }

        .ops-identity-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .ops-identity-pill {
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 999px;
            color: #cbd5e1;
            background: rgba(15, 23, 42, 0.72);
            font-size: 10px;
            font-weight: 850;
            letter-spacing: 0.07em;
            padding: 5px 8px;
            text-transform: uppercase;
        }

        .workspace-context-control {
            display: grid;
            gap: 6px;
            margin-top: 12px;
        }

        .workspace-context-label {
            color: #94a3b8;
            font-size: 10px;
            font-weight: 850;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .workspace-context-select,
        .workspace-context-locked {
            width: 100%;
            border: 1px solid #334155;
            border-radius: 10px;
            background: #0f172a;
            color: #e2e8f0;
            font: inherit;
            font-size: 12px;
        }

        .workspace-context-select {
            min-height: 38px;
            padding: 8px 10px;
        }

        .workspace-context-locked {
            display: grid;
            gap: 2px;
            padding: 9px 10px;
        }

        .workspace-context-locked strong {
            color: #f8fafc;
            font-size: 13px;
            line-height: 1.2;
        }

        .workspace-context-locked span:last-child {
            color: #94a3b8;
            font-size: 11px;
        }

        .ops-sidebar-nav {
            display: grid;
            gap: 5px;
        }

        .ops-sidebar-button {
            width: 100%;
            border: 1px solid transparent;
            border-radius: 10px;
            background: transparent;
            color: #cbd5e1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 11px;
            text-align: left;
            font: inherit;
            font-size: 13px;
            font-weight: 750;
        }

        .ops-sidebar-button:hover,
        .ops-sidebar-button.active {
            background: rgba(201, 162, 39, 0.12);
            border-color: rgba(201, 162, 39, 0.28);
            color: #f8fafc;
        }

        .ops-sidebar-marker {
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.12);
            color: #94a3b8;
            font-size: 10px;
            font-weight: 850;
            letter-spacing: 0.06em;
            min-width: 28px;
            padding: 3px 7px;
            text-align: center;
        }

        .ops-sidebar-button.active .ops-sidebar-marker {
            background: #c9a227;
            color: #0f172a;
        }

        .ops-main {
            min-height: 100vh;
            min-width: 0;
            width: 100%;
        }

        .ops-view-frame {
            min-height: calc(100vh - 59px);
            min-width: 0;
            width: 100%;
        }

        .ops-module-toolbar {
            position: sticky;
            top: 0;
            z-index: 170;
            border-bottom: 1px solid #1e293b;
            background: rgba(15, 23, 42, 0.96);
            padding: 10px 24px;
            backdrop-filter: blur(12px);
        }

        .ops-module-list {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: thin;
        }

        .ops-module-button {
            border: 1px solid #334155;
            border-radius: 999px;
            background: #111827;
            color: #cbd5e1;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
            font: inherit;
            font-size: 13px;
            font-weight: 800;
            min-height: 38px;
            padding: 8px 12px 8px 9px;
            white-space: nowrap;
        }

        .ops-module-button:hover,
        .ops-module-button.active {
            border-color: rgba(201, 162, 39, 0.45);
            background: rgba(201, 162, 39, 0.12);
            color: #f8fafc;
        }

        .ops-module-marker {
            align-items: center;
            background: rgba(148, 163, 184, 0.12);
            border-radius: 999px;
            color: #94a3b8;
            display: inline-flex;
            font-size: 10px;
            font-weight: 850;
            height: 22px;
            justify-content: center;
            min-width: 26px;
            padding: 0 7px;
        }

        .ops-module-button.active .ops-module-marker {
            background: #c9a227;
            color: #0f172a;
        }

        .mobile-app-header {
            display: none;
            position: sticky;
            top: 0;
            z-index: 180;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid #1e293b;
            background: rgba(15, 23, 42, 0.96);
            padding: 10px 12px;
            backdrop-filter: blur(12px);
        }

        .menu-button {
            border: 1px solid #334155;
            border-radius: 10px;
            background: #111827;
            color: #f8fafc;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 38px;
            width: 42px;
            font-size: 20px;
            font-weight: 800;
        }

        .hamburger-lines,
        .hamburger-lines::before,
        .hamburger-lines::after {
            display: block;
            width: 18px;
            height: 2px;
            border-radius: 999px;
            background: currentColor;
            content: "";
        }

        .hamburger-lines {
            position: relative;
        }

        .hamburger-lines::before {
            position: absolute;
            top: -6px;
        }

        .hamburger-lines::after {
            position: absolute;
            top: 6px;
        }

        .mobile-app-title {
            min-width: 0;
        }

        .mobile-brand-row {
            align-items: center;
            display: flex;
            gap: 8px;
            min-width: 0;
        }

        .mobile-brand-logo {
            height: 28px;
            width: 28px;
        }

        .mobile-app-title strong {
            display: block;
            color: #f8fafc;
            font-size: 14px;
            line-height: 1.1;
        }

        .mobile-app-title span {
            display: block;
            color: #94a3b8;
            font-size: 11px;
            line-height: 1.2;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ops-drawer-backdrop {
            display: none;
        }

        .section-nav {
            border: 1px solid rgba(51, 65, 85, 0.9);
            border-radius: 14px;
            background: rgba(17, 24, 39, 0.82);
            margin-bottom: 16px;
            min-height: 52px;
            padding: 8px;
        }

        .section-tab-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .section-tab {
            border: 1px solid transparent;
            border-radius: 9px;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            font: inherit;
            font-size: 12px;
            font-weight: 800;
            min-height: 34px;
            padding: 7px 10px;
            white-space: normal;
        }

        .section-tab:hover,
        .section-tab.active {
            border-color: rgba(201, 162, 39, 0.32);
            background: rgba(201, 162, 39, 0.12);
            color: #f8fafc;
        }

        .focus-panel {
            background: rgba(30, 41, 59, 0.92);
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 18px 50px rgba(2, 6, 23, 0.22);
            min-height: 180px;
            padding: 16px;
            min-width: 0;
        }

        .focused-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .metric-button {
            border: 1px solid #334155;
            border-radius: 14px;
            background: #111827;
            color: #cbd5e1;
            cursor: pointer;
            display: grid;
            gap: 6px;
            min-height: 110px;
            padding: 14px;
            text-align: left;
            transition: border-color 0.18s, background 0.18s, transform 0.18s;
        }

        .metric-button:hover {
            border-color: rgba(201, 162, 39, 0.68);
            background: rgba(201, 162, 39, 0.1);
            transform: translateY(-1px);
        }

        .metric-label {
            color: #94a3b8;
            font-size: 11px;
            font-weight: 850;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .metric-value {
            color: #f8fafc;
            font-size: 30px;
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 1;
        }

        .metric-note {
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.35;
        }

        .filter-details {
            border: 1px solid #334155;
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.72);
            margin-bottom: 14px;
            overflow: hidden;
        }

        .filter-details > summary {
            color: #f8fafc;
            cursor: pointer;
            font-size: 13px;
            font-weight: 800;
            list-style: none;
            padding: 11px 13px;
        }

        .filter-details > summary::-webkit-details-marker {
            display: none;
        }

        .filter-details-body {
            display: grid;
            gap: 10px;
            padding: 0 13px 13px;
        }

        .workflow-details {
            border: 1px solid rgba(201, 162, 39, 0.24);
            border-radius: 14px;
            background: rgba(201, 162, 39, 0.08);
            color: #cbd5e1;
            margin-top: 12px;
            overflow: hidden;
        }

        .workflow-details > summary {
            color: #facc15;
            cursor: pointer;
            font-size: 12px;
            font-weight: 850;
            padding: 10px 12px;
        }

        .workflow-details p {
            color: #cbd5e1;
            font-size: 12px;
            line-height: 1.45;
            padding: 0 12px 12px;
        }

        .student-workspace {
            display: grid;
            gap: 16px;
        }

        .student-two-column {
            display: grid;
            grid-template-columns: minmax(230px, 320px) minmax(0, 1fr);
            gap: 16px;
            align-items: start;
        }

        .student-picker {
            border: 1px solid #334155;
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.72);
            padding: 12px;
        }

        .student-picker select {
            width: 100%;
            margin-top: 8px;
        }

        .student-list-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 10px;
        }

        .group-goal-chips {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 8px;
            margin-top: 12px;
        }

        .group-goal-chip {
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.72);
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 10px;
            font-size: 12px;
        }

        /* Header */
        .header {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            color: #f8fafc;
        }

        .header p {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: #c9a227;
            color: #0f172a;
        }

        .btn-primary:hover {
            background: #d4b43a;
        }

        .btn-secondary {
            background: #334155;
            color: white;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        /* Navigation Tabs */
        .nav-tabs {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 0 24px;
        }

        .nav-tabs-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 4px;
        }

        .nav-tab {
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-tab:hover {
            color: #e2e8f0;
        }

        .nav-tab.active {
            color: #c9a227;
            border-bottom-color: #c9a227;
        }

        /* Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            min-width: 0;
            padding: 24px;
            width: 100%;
        }

        .command-center-container {
            padding-bottom: 0;
        }

        .ops-command-center {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(201, 162, 39, 0.28);
            border-radius: 24px;
            background:
                radial-gradient(circle at 8% 0%, rgba(201, 162, 39, 0.2), transparent 34%),
                radial-gradient(circle at 94% 12%, rgba(96, 165, 250, 0.13), transparent 32%),
                linear-gradient(135deg, #17233b 0%, #101827 100%);
            box-shadow: 0 24px 70px rgba(2, 6, 23, 0.34);
            padding: 20px;
        }

        .ops-command-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 16px;
        }

        .ops-command-kicker,
        .page-kicker {
            color: #facc15;
            font-size: 11px;
            font-weight: 850;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .ops-command-title,
        .page-heading h2 {
            color: #f8fafc;
            font-size: 26px;
            font-weight: 850;
            letter-spacing: -0.04em;
            line-height: 1.06;
            margin-top: 4px;
        }

        .ops-command-copy,
        .page-heading p {
            color: #cbd5e1;
            font-size: 13px;
            line-height: 1.45;
            margin-top: 6px;
            max-width: 780px;
        }

        .ops-command-date {
            flex: 0 0 auto;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 999px;
            color: #e2e8f0;
            background: rgba(15, 23, 42, 0.58);
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        .ops-command-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            align-items: stretch;
        }

        .ops-command-card {
            min-height: 154px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 18px;
            background: rgba(15, 23, 42, 0.68);
            color: #cbd5e1;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 9px;
            justify-content: space-between;
        }

        .ops-command-card[data-tone="attention"] {
            border-color: rgba(248, 113, 113, 0.42);
            background: linear-gradient(145deg, rgba(69, 26, 26, 0.72), rgba(15, 23, 42, 0.7));
        }

        .ops-command-card[data-tone="active"] {
            border-color: rgba(201, 162, 39, 0.48);
            background: linear-gradient(145deg, rgba(201, 162, 39, 0.16), rgba(15, 23, 42, 0.72));
        }

        .ops-command-card[data-tone="ok"] {
            border-color: rgba(52, 211, 153, 0.32);
            background: linear-gradient(145deg, rgba(6, 95, 70, 0.28), rgba(15, 23, 42, 0.72));
        }

        .ops-command-label {
            color: #94a3b8;
            font-size: 11px;
            font-weight: 850;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .ops-command-value {
            color: #f8fafc;
            font-size: 34px;
            font-weight: 900;
            letter-spacing: -0.06em;
            line-height: 0.95;
        }

        .ops-command-note {
            color: #cbd5e1;
            font-size: 12px;
            line-height: 1.35;
        }

        .ops-command-action {
            align-self: flex-start;
            border: 1px solid rgba(201, 162, 39, 0.44);
            border-radius: 999px;
            color: #facc15;
            background: rgba(201, 162, 39, 0.08);
            padding: 7px 10px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 850;
        }

        .ops-command-action:hover {
            background: rgba(201, 162, 39, 0.16);
        }

        .page-heading {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            align-items: flex-start;
            margin-bottom: 18px;
        }

        .page-heading-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .page-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 999px;
            color: #e2e8f0;
            background: rgba(15, 23, 42, 0.62);
            padding: 7px 11px;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        /* Task Board */
        .pipeline-board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            overflow-x: visible;
            padding-bottom: 20px;
        }

        .pipeline-column {
            background: #1e293b;
            border-radius: 12px;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 200px);
        }

        .column-header {
            padding: 16px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .column-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .column-count {
            background: #334155;
            color: #94a3b8;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
        }

        .column-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Task Cards */
        .task-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s;

            margin-top: 6px;

        .agent-status-panel {

            align-items: stretch;
            margin-bottom: 18px;
            padding: 14px;
            border: 1px solid rgba(201, 162, 39, 0.32);
            border-radius: 18px;
            background:
                radial-gradient(circle at top left, rgba(201, 162, 39, 0.18), transparent 34%),

            flex-direction: column;

            letter-spacing: 0.12em;
            text-transform: uppercase;

        .agent-status-title {
            color: #f8fafc;
            font-size: 18px;
            font-weight: 800;
            line-height: 1.2;

        .agent-status-note {
            color: #cbd5e1;
            font-size: 12px;
            line-height: 1.45;
        }

        .agent-status-stat {
            display: flex;
            min-height: 78px;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.68);
            border: 1px solid rgba(148, 163, 184, 0.16);
            padding: 12px;
        }

        .agent-status-stat strong {
            color: #f8fafc;
            font-size: 24px;
            line-height: 1;
        }

        .agent-status-stat span {
            color: #94a3b8;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .agent-status-panel[data-health="attention"] {
            border-color: rgba(248, 113, 113, 0.45);
            background:
                radial-gradient(circle at top left, rgba(248, 113, 113, 0.16), transparent 34%),
                linear-gradient(135deg, #271827, #101827);
        }

        .task-focus-grid {
            display: grid;
            gap: 8px;
            margin-top: 16px;
        }

        .task-filter {
            width: 100%;
            border: 1px solid #334155;
            background: #0f172a;
            color: #cbd5e1;
            border-radius: 12px;
            padding: 11px 12px;

            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
            text-align: left;
            font-size: 13px;
            font-weight: 700;
        }

        .task-filter:hover,
        .task-filter.active {
            border-color: #c9a227;
            color: #f8fafc;
            background: rgba(201, 162, 39, 0.1);
        }

        .task-filter-count {
            background: #334155;
            border-radius: 999px;
            color: #f8fafc;
            padding: 2px 8px;
            font-size: 11px;
        }

        .task-signal {
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(201, 162, 39, 0.14), rgba(37, 99, 235, 0.1));
            border: 1px solid rgba(201, 162, 39, 0.25);
            padding: 14px;
            margin-top: 16px;
        }

        .task-signal strong {
            color: #f8fafc;
            display: block;
            font-size: 13px;
        }

        .task-signal span {
            color: #94a3b8;
            display: block;
            font-size: 12px;
            margin-top: 4px;
        }

        .task-list-section + .task-list-section {
            margin-top: 22px;
        }

        .task-section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 10px;
        }

        .task-section-header h3 {
            color: #f8fafc;
            font-size: 15px;
            letter-spacing: -0.01em;
        }

        .task-section-header span {
            color: #64748b;
            font-size: 12px;
        }

        .task-list {
            display: grid;
            gap: 10px;
            min-height: 72px;
        }

        .task-row {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 14px;
            cursor: pointer;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 14px;
            min-width: 0;
            transition: border-color 0.18s, transform 0.18s, background 0.18s;
        }

        .task-row:hover {
            border-color: #c9a227;
            background: #111c31;
            transform: translateY(-1px);
        }

        .task-row-title {
            color: #f8fafc;
            font-size: 14px;
            font-weight: 750;
            line-height: 1.35;
            overflow-wrap: anywhere;
        }

        .task-row-detail {
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.45;
            margin-top: 7px;
            max-width: 760px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .task-row-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .task-row-meta.primary-only .badge:nth-child(n+6) {
            display: none;
        }

        .task-open-cue {
            color: #64748b;
            font-size: 11px;
            font-weight: 800;
            margin-top: 8px;
        }

        .task-row-actions {
            min-width: 170px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: stretch;
        }

        .task-row-actions .task-action {
            width: 100%;
            justify-content: center;
            padding: 8px 10px;
        }

        .task-empty {
            border: 1px dashed #334155;
            border-radius: 16px;
            padding: 28px;
            text-align: center;
            color: #64748b;
            background: rgba(15, 23, 42, 0.55);
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #cbd5e1;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .checkbox-row input {
            width: auto;
        }

        .task-comments {
            border-top: 1px solid #334155;
            margin-top: 18px;
            padding-top: 18px;
        }

        .comment-list {
            display: grid;
            gap: 10px;
            margin: 10px 0 12px;
        }

        .comment-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px 12px;
        }

        .comment-meta {
            color: #94a3b8;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .comment-body {
            color: #e2e8f0;
            font-size: 13px;
            white-space: pre-wrap;
        }

        .content-toolbar {
            background: rgba(30, 41, 59, 0.92);
            border: 1px solid #334155;
            border-radius: 18px;
            padding: 16px;
            margin: 16px 0;
            display: grid;
            gap: 14px;
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .filter-label {
            color: #94a3b8;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            min-width: 72px;
        }

        .filter-chip {
            border: 1px solid #334155;
            background: #0f172a;
            color: #cbd5e1;
            border-radius: 999px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 750;
            transition: all 0.18s;
        }

        .filter-chip:hover,
        .filter-chip.active {
            border-color: #c9a227;
            background: rgba(201, 162, 39, 0.12);
            color: #f8fafc;
        }

        .filter-chip.locked {
            cursor: default;
        }

        .content-list {
            display: grid;
            gap: 14px;
        }

        .content-library-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 18px;
            padding: 0;
            overflow: hidden;
            transition: border-color 0.18s, background 0.18s;
        }

        .content-library-card.expanded {
            border-color: rgba(201, 162, 39, 0.55);
            background: #202d42;
        }

        .content-card-compact {
            width: 100%;
            border: 0;
            background: transparent;
            color: inherit;
            cursor: pointer;
            padding: 16px;
            text-align: left;
        }

        .content-card-header {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            align-items: flex-start;
        }

        .content-card-main {
            min-width: 0;
            flex: 1;
        }

        .content-card-tools {
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            gap: 12px;
            flex-wrap: wrap;
            text-align: right;
        }

        .content-card-summary {
            color: #cbd5e1;
            font-size: 13px;
            margin-top: 10px;
            max-width: 900px;
        }

        .content-card-summary ul,
        .content-section-list {
            margin: 8px 0 0;
            padding-left: 18px;
        }

        .content-card-summary li,
        .content-section-list li {
            margin-bottom: 5px;
            line-height: 1.45;
        }

        .content-topic-chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .content-topic-chip {
            display: inline-flex;
            align-items: center;
            max-width: 210px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.52);
            color: #dbeafe;
            font-size: 12px;
            font-weight: 700;
            line-height: 1;
            padding: 7px 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .content-parse-panel {
            border: 1px solid rgba(96, 165, 250, 0.22);
            background: rgba(30, 64, 175, 0.12);
            border-radius: 14px;
            padding: 12px;
            margin: 12px 0;
        }

        .content-source-meta {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 6px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .content-source-meta span + span::before {
            content: "·";
            color: #475569;
            margin-right: 8px;
        }

        .content-section-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(260px, 1fr));
            gap: 12px;
            margin: 12px 0;
        }

        .content-language-note {
            border: 1px solid rgba(201, 162, 39, 0.25);
            background: rgba(201, 162, 39, 0.08);
            color: #fde68a;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 12px;
            line-height: 1.45;
            margin-top: 10px;
        }

        .content-card-expanded {
            border-top: 1px solid #334155;
            padding: 16px;
        }

        .content-select-large {
            width: 20px;
            height: 20px;
            accent-color: #c9a227;
            cursor: pointer;
        }

        .content-expand-cue {
            color: #93c5fd;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        .content-next-action {
            display: inline-flex;
            align-items: center;
            border: 1px solid rgba(201, 162, 39, 0.38);
            border-radius: 999px;
            color: #facc15;
            background: rgba(201, 162, 39, 0.08);
            padding: 7px 10px;
            font-size: 11px;
            font-weight: 850;
            white-space: nowrap;
        }

        .content-bulk-actions {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.96), rgba(30, 41, 59, 0.94));
            border: 1px solid #334155;
            border-radius: 18px;
            padding: 16px;
            margin: 16px 0;
            display: grid;
            gap: 12px;
        }

        .content-bulk-header {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .content-bulk-selected {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .content-title-line {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .media-pill {
            border-radius: 999px;
            padding: 4px 9px;
            font-size: 10px;
            font-weight: 850;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .media-pill.video { background: rgba(37, 99, 235, 0.18); color: #93c5fd; }
        .media-pill.audio { background: rgba(5, 150, 105, 0.18); color: #86efac; }
        .media-pill.image { background: rgba(201, 162, 39, 0.18); color: #fde68a; }
        .media-pill.file { background: rgba(148, 163, 184, 0.16); color: #cbd5e1; }

        .bundle-panel {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(30, 41, 59, 0.94));
            border: 1px solid #334155;
            border-radius: 18px;
            padding: 16px;
            margin: 16px 0;
        }

        .bundle-grid {
            display: grid;
            gap: 12px;
            margin-top: 12px;
        }

        .bundle-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 14px;
        }

        .newsletter-review-textarea {
            width: 100%;
            min-height: 220px;
            margin-top: 12px;
            padding: 12px;
            background: #020617;
            border: 1px solid #334155;
            border-radius: 12px;
            color: #e2e8f0;
            font-family: inherit;
            font-size: 13px;
            line-height: 1.55;
            resize: vertical;
        }

        .content-select {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 700;
        }

        .content-select input {
            accent-color: #c9a227;
        }

        .prompt-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 14px;
        }

        .prompt-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 13px;
        }

        .prompt-card-header {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .prompt-title {
            color: #f8fafc;
            font-size: 14px;
            font-weight: 800;
        }

        .prompt-meta {
            color: #94a3b8;
            font-size: 11px;
            margin-top: 3px;
        }

        .prompt-draft {
            border: 1px solid #1e3a5f;
            background: rgba(30, 58, 95, 0.28);
            border-radius: 10px;
            padding: 10px;
            color: #dbeafe;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 210px;
            overflow: auto;
            margin-top: 10px;
        }

        .prompt-editor {
            margin-top: 10px;
            display: grid;
            gap: 8px;
        }

        .prompt-editor textarea,
        .prompt-editor input {
            width: 100%;
            background: #020617;
            border: 1px solid #334155;
            color: #e2e8f0;
            border-radius: 10px;
            padding: 10px;
            font-family: inherit;
            font-size: 12px;
        }

        .prompt-editor textarea {
            min-height: 170px;
            resize: vertical;
        }

        .example-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .example-chip {
            border: 1px solid #334155;
            color: #cbd5e1;
            background: rgba(148, 163, 184, 0.08);
            border-radius: 999px;
            padding: 4px 8px;
            font-size: 10px;
            font-weight: 700;
        }

        .student-card {
            cursor: pointer;
            transition: border-color 0.18s, transform 0.18s, background 0.18s;
        }

        .student-card:hover,
        .student-card.active {
            border-color: #c9a227;
            background: #111c31;
            transform: translateY(-1px);
        }

        .student-profile-hero {
            background: linear-gradient(135deg, rgba(201, 162, 39, 0.16), rgba(37, 99, 235, 0.12));
            border: 1px solid rgba(201, 162, 39, 0.28);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 16px;
        }

        .student-profile-hero h3 {
            color: #f8fafc;
            font-size: 22px;
            letter-spacing: -0.03em;
        }

        .student-profile-kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 16px;
        }

        .mini-kpi {
            background: rgba(15, 23, 42, 0.72);
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 14px;
            padding: 12px;
        }

        .mini-kpi strong {
            color: #f8fafc;
            display: block;
            font-size: 19px;
        }

        .mini-kpi span {
            color: #94a3b8;
            display: block;
            font-size: 11px;
            font-weight: 750;
            letter-spacing: 0.04em;
            margin-top: 2px;
            text-transform: uppercase;
        }

        .student-profile-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(260px, 1fr));
            gap: 14px;
        }

        .student-profile-section {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 14px;
            min-width: 0;
        }

        .student-profile-section h4 {
            color: #f8fafc;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .student-profile-section.full {
            grid-column: 1 / -1;
        }

        .goal-board-panel {
            display: grid;
            gap: 14px;
        }

        .goal-board-form {
            display: grid;
            gap: 12px;
            background: rgba(15, 23, 42, 0.58);
            border: 1px solid rgba(148, 163, 184, 0.14);
            border-radius: 14px;
            padding: 12px;
        }

        .goal-board-list {
            display: grid;
            gap: 10px;
        }

        .goal-board-card {
            border-left: 3px solid #334155;
        }

        .goal-board-card.today {
            border-left-color: #c9a227;
        }

        .goal-board-card.upcoming {
            border-left-color: #2563eb;
        }

        .goal-board-card.waiting {
            border-left-color: #eab308;
        }

        .goal-board-card.done {
            border-left-color: #16a34a;
        }

        .goal-board-private {
            background: rgba(127, 29, 29, 0.18);
            border: 1px solid rgba(248, 113, 113, 0.2);
            border-radius: 10px;
            color: #fecaca;
            font-size: 12px;
            line-height: 1.45;
            margin-top: 8px;
            padding: 8px 10px;
        }

        .goal-board-public {
            color: #cbd5e1;
            font-size: 13px;
            line-height: 1.45;
            margin-top: 8px;
        }

        .progress-track {
            background: #1e293b;
            border-radius: 999px;
            height: 9px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #c9a227, #facc15);
            height: 100%;
            width: var(--progress, 0%);
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: #1e293b;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow: auto;
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 18px;
            font-weight: 700;
            color: #f8fafc;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            color: #94a3b8;
            cursor: pointer;
        }

        .modal-body {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px 14px;
            color: #e2e8f0;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #c9a227;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .option-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .option-btn {
            flex: 1;
            min-width: 80px;
            padding: 10px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #0f172a;
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: #c9a227;
        }

        .option-btn.active {
            border-color: #c9a227;
            background: rgba(201, 162, 39, 0.1);
            color: #c9a227;
            font-weight: 600;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid #334155;
            display: flex;
            gap: 12px;
        }

        .modal-footer .btn {
            flex: 1;
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #94a3b8;
        }

    <div id="app">
        <div class="loading">Loading BNA Operations...</div>

    <script>
        // API Client
        const api = {
            async request(method, path, body) {
                const options = {
                    method,
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                };
                if (body) options.body = JSON.stringify(body);

                const response = await fetch('/api/bna' + path, options);
                if (response.status === 401) {
                    localStorage.removeItem('bna_ops_session');
                    window.location.href = '/operations-login.html';
                    return null;
                }
                const data = await response.json();
                if (!response.ok) {
                    const hint = data.hint ? `\n\n${data.hint}` : '';
                    throw new Error((data.error || `Request failed: ${response.status}`) + hint);
                }
                return data;
            },

            getTasks(filters = {}) {
                const params = new URLSearchParams();
                if (filters.stage) params.set('stage', filters.stage);
                if (filters.category) params.set('category', filters.category);
                if (filters.urgency) params.set('urgency', filters.urgency);
                if (filters.project) params.set('project', filters.project);
                return this.request('GET', '/tasks?' + params.toString());
            },

            getAuthMe() { return this.request('GET', '/auth/me'); },
            getAgentFleetStatus() { return this.request('GET', '/agent-fleet/status'); },
            getProjects() { return this.request('GET', '/projects'); },
            createTask(task) { return this.request('POST', '/tasks', task); },
            createFromRamble(ramble) { return this.request('POST', '/tasks', { ramble, source: 'web', created_by: 'operator' }); },
            updateTask(id, task) { return this.request('PATCH', '/tasks/' + id, task); },
            moveTask(id, stage) { return this.request('PATCH', '/tasks/' + id, { stage }); },
            deleteTask(id) { return this.request('DELETE', '/tasks/' + id); },
            getTaskComments(id) { return this.request('GET', '/tasks/' + id + '/comments'); },
            addTaskComment(id, comment) { return this.request('POST', '/tasks/' + id + '/comments', comment); },

            getSignups(filters = {}) {
                const params = new URLSearchParams();
                if (filters.status) params.set('status', filters.status);
                if (filters.payment_status) params.set('payment_status', filters.payment_status);
                return this.request('GET', '/signups?' + params.toString());
            },

            createSignup(signup) { return this.request('POST', '/signups', signup); },
            updateSignup(id, updates) { return this.request('PATCH', '/signups/' + id, updates); },

            getPayments(filters = {}) {
                const params = new URLSearchParams();
                if (filters.signup_id) params.set('signup_id', filters.signup_id);
                return this.request('GET', '/payments?' + params.toString());
            },

            createPayment(payment) { return this.request('POST', '/payments', payment); },
            getPaymentReminderDue() { return this.request('GET', '/payment-reminders/due'); },
            runPaymentReminders(payload = {}) { return this.request('POST', '/payment-reminders/run', payload); },

            getPaymentIntake(filters = {}) {
                const params = new URLSearchParams();
                if (filters.status) params.set('status', filters.status);
                return this.request('GET', '/payment-intake?' + params.toString());
            },
            createPaymentIntake(intake) { return this.request('POST', '/payment-intake', intake); },
            updatePaymentIntake(id, intake) { return this.request('PATCH', '/payment-intake/' + id, intake); },

            getContentJobs(filters = {}) {
                const params = new URLSearchParams();
                if (filters.status) params.set('status', filters.status);
                return this.request('GET', '/content-jobs?' + params.toString());
            },
            createContentJob(job) { return this.request('POST', '/content-jobs', job); },
            updateContentJob(id, job) { return this.request('PATCH', '/content-jobs/' + id, job); },
            contentJobAction(id, action, payload = {}) { return this.request('POST', '/content-jobs/' + id + '/actions', { action, ...payload }); },
            parseMixedRecording(id, payload = {}) { return this.request('POST', '/content-jobs/' + id + '/parse-mixed-recording', payload); },
            updateContentOutput(id, output) { return this.request('PATCH', '/content-outputs/' + id, output); },
            contentOutputAction(id, action, payload = {}) { return this.request('POST', '/content-outputs/' + id + '/actions', { action, ...payload }); },
            getContentPrompts() { return this.request('GET', '/content-prompts'); },
            updateContentPrompt(platform, prompt) { return this.request('PATCH', '/content-prompts/' + platform, prompt); },
            addContentPromptExample(platform, example) { return this.request('POST', '/content-prompts/' + platform + '/examples', example); },
            getContentBundles() { return this.request('GET', '/content-bundles'); },
            createContentBundle(bundle) { return this.request('POST', '/content-bundles', bundle); },
            updateContentBundle(id, bundle) { return this.request('PATCH', '/content-bundles/' + id, bundle); },
            generateContentBundle(id, payload = {}) { return this.request('POST', '/content-bundles/' + id + '/generate', payload); },
            bulkGenerateContent(payload = {}) { return this.request('POST', '/content-jobs/bulk-generate', payload); },

            getStudents() { return this.request('GET', '/students'); },
            createStudentAccessCode(id, payload = {}) { return this.request('POST', '/students/' + id + '/access-code', payload); },
            getDevices(filters = {}) {
                const params = new URLSearchParams();
                if (filters.student_id) params.set('student_id', filters.student_id);
                if (filters.status) params.set('status', filters.status);
                return this.request('GET', '/devices' + (params.toString() ? '?' + params.toString() : ''));
            },
            createDevice(studentId, payload = {}) { return this.request('POST', '/students/' + studentId + '/devices', payload); },
            updateDevice(id, payload = {}) { return this.request('PATCH', '/devices/' + id, payload); },
            deviceAction(id, payload = {}) { return this.request('POST', '/devices/' + id + '/actions', payload); },
            reviewDeviceAccess(goalId, payload = {}) { return this.request('POST', '/device-access/reviews/' + goalId + '/actions', payload); },
            getDeviceAccessRules(filters = {}) {

                return this.request('GET', '/device-access-rules' + (params.toString() ? '?' + params.toString() : ''));
            },

            updateGoalBoardItem(id, payload = {}) { return this.request('PATCH', '/goal-board/' + id, payload); },
            getTorahLearning(date) {
                const params = new URLSearchParams();
                if (date) params.set('date', date);
                return this.request('GET', '/torah-learning' + (params.toString() ? '?' + params.toString() : ''));
            },
            saveTorahEntry(entry) { return this.request('POST', '/torah-learning/entries', entry); },
            getGreenInvoiceWebhooks(limit = 50) {
                const params = new URLSearchParams();
                params.set('limit', String(limit));
                return this.request('GET', '/green-invoice/webhooks?' + params.toString());
            },
            reprocessGreenInvoiceWebhook(id) { return this.request('POST', '/green-invoice/webhooks/' + id + '/reprocess', {}); },
            getAccountability(filters = {}) {
                const params = new URLSearchParams();
                if (filters.event_type) params.set('event_type', filters.event_type);
                if (filters.student_id) params.set('student_id', filters.student_id);
                return this.request('GET', '/accountability?' + params.toString());
            },
            createAccountability(event) { return this.request('POST', '/accountability', event); },

        function operationsCommandMetrics() {

            const visibleContent = contentJobs.filter(job => !['archived', 'published'].includes(job.status) && !contentIsParserIntake(job));

            return {
                decisions: buckets.decisions.length,
                codexPending: Number(queue.pending ?? buckets.changelog.filter(task => taskIsMachine(task) && !task.completed_at && !task.verified_at && normalizeTaskStage(task.stage) !== 'done').length ?? 0),
                codexInProgress: Number(queue.in_progress ?? 0),
                accountabilityAttention: snapshots.filter(snapshot => ['needs_setup', 'due_today', 'missed', 'needs_review'].includes(snapshot.status)).length,
                studentsDueToday: snapshots.filter(snapshot => snapshot.status === 'due_today').length,

            };

        function getTaskBuckets() {
            const buckets = {
                decisions: [],
                mine: [],
                changelog: []
            };
            let hiddenCaptures = 0;

            tasks.forEach((task) => {
                const column = taskColumn(task);
                if (!column) {
                    if (isHiddenCapture(task)) hiddenCaptures += 1;
                    return;
                }
                buckets[column].push(task);
            });

            Object.values(buckets).forEach((items) => {
                items.sort(sortTasks);
            });

            return { buckets, hiddenCaptures };
        }

        function renderAgentStatusPanel(buckets) {
            const queue = agentFleetStatus?.queue || {};
            const fleet = agentFleetStatus?.fleet || {};
            const changelogQueue = (buckets.changelog || []).filter(task => taskIsMachine(task) && !task.completed_at && !task.verified_at && normalizeTaskStage(task.stage) !== 'done');
            const queued = Number(queue.pending ?? changelogQueue.length ?? 0);
            const inProgress = Number(queue.in_progress ?? 0);
            const urgent = Number(queue.urgent_today ?? 0);
            const latestTitle = queue.latest_task?.title || changelogQueue[0]?.title || buckets.changelog?.[0]?.title || '';
            const status = String(fleet.status || 'unknown').toLowerCase();
            const stale = Boolean(fleet.stale);
            const healthy = status === 'running' && !stale;
            const health = healthy || queued === 0 ? 'ok' : 'attention';
            const statusTitle = healthy
                ? 'Agent fleet is watching the changelog queue'
                : queued > 0
                    ? 'Agent work is queued, but the worker is not reporting a fresh heartbeat'
                    : 'No queued agent work is waiting right now';
            const note = latestTitle
                ? `Next visible item: ${taskDisplayTitle({ title: latestTitle })}`
                : 'New Telegram tasks assigned to the agent fleet show in Changelog as queued, in progress, or verified.';
            const heartbeat = fleet.last_seen_at
                ? `Last seen ${formatDateTime(fleet.last_seen_at)}`
                : 'No heartbeat recorded yet';

            return `
                <div class="agent-status-panel" data-health="${health}">
                    <div class="agent-status-main">
                        <div class="agent-status-kicker">Changelog Queue Visibility</div>
                        <div class="agent-status-title">${escapeHtml(statusTitle)}</div>

                decisionCount,

                changelogCount,

                <button class="metric-button" onclick="${onclick}">
