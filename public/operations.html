<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNA Operations</title>
    <script>
        if (window.location.pathname === '/operations.html' && new URLSearchParams(window.location.search).get('source') === 'pwa') {
            window.location.replace('/operations');
        }
    </script>
    <meta name="theme-color" content="#1e3a5f">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" type="image/png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        .header {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            color: #f8fafc;
        }

        .header p {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: #c9a227;
            color: #0f172a;
        }

        .btn-primary:hover {
            background: #d4b43a;
        }

        .btn-secondary {
            background: #334155;
            color: white;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        /* Navigation Tabs */
        .nav-tabs {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 0 24px;
        }

        .nav-tabs-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 4px;
        }

        .nav-tab {
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-tab:hover {
            color: #e2e8f0;
        }

        .nav-tab.active {
            color: #c9a227;
            border-bottom-color: #c9a227;
        }

        /* Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Task Board */
        .pipeline-board {
            display: grid;
            grid-template-columns: repeat(6, minmax(220px, 1fr));
            gap: 16px;
            overflow-x: auto;
            padding-bottom: 20px;
        }

        .pipeline-column {
            background: #1e293b;
            border-radius: 12px;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 200px);
        }

        .column-header {
            padding: 16px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .column-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .column-count {
            background: #334155;
            color: #94a3b8;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
        }

        .column-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Task Cards */
        .task-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s;
            max-height: 220px;
            overflow: hidden;
        }

        .task-card:hover {
            border-color: #c9a227;
            transform: translateY(-2px);
        }

        .task-card.dragging {
            opacity: 0.5;
        }

        .task-title {
            font-size: 13px;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 8px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 5;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .task-detail {
            color: #cbd5e1;
            font-size: 12px;
            line-height: 1.45;
            margin: 8px 0 10px;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .task-meta {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-category-admin { background: #7c3aed; color: white; }
        .badge-category-marketing { background: #2563eb; color: white; }
        .badge-category-parent_coaching { background: #059669; color: white; }
        .badge-category-student_operations { background: #d97706; color: white; }
        .badge-category-finance { background: #dc2626; color: white; }
        .badge-category-legal { background: #7c2d12; color: white; }
        .badge-category-communications { background: #0891b2; color: white; }
        .badge-category-operations { background: #475569; color: white; }
        .badge-category-accountability { background: #c9a227; color: #0f172a; }
        .badge-category-content { background: #0f766e; color: white; }
        .badge-category-technology { background: #4f46e5; color: white; }
        .badge-category-accounting { background: #be123c; color: white; }
        .badge-category-ghl_setup { background: #9333ea; color: white; }
        .badge-category-community { background: #16a34a; color: white; }
        .badge-category-general { background: #64748b; color: white; }
        .badge-category-torah_class_prep { background: #ca8a04; color: #0f172a; }
        .badge-category-source_sheets { background: #0369a1; color: white; }
        .badge-category-shiur_ideas { background: #a16207; color: white; }
        .badge-project-bna { background: #dbeafe; color: #1d4ed8; }
        .badge-project-one_time_mishnah_class { background: #fef3c7; color: #92400e; }
        .badge-decision { background: #fef2f2; color: #b91c1c; }

        .badge-urgency-urgent { background: #fef2f2; color: #dc2626; }
        .badge-urgency-today { background: #fffbeb; color: #d97706; }
        .badge-urgency-this_week { background: #eff6ff; color: #2563eb; }
        .badge-urgency-low { background: #f1f5f9; color: #64748b; }

        .badge-energy-high { background: #fecaca; color: #991b1b; }
        .badge-energy-medium { background: #fde68a; color: #92400e; }
        .badge-energy-low { background: #bbf7d0; color: #166534; }

        .task-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #64748b;
            gap: 8px;
            flex-wrap: wrap;
        }

        .task-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .task-action {
            border: 1px solid #334155;
            background: #1e293b;
            color: #e2e8f0;
            border-radius: 999px;
            padding: 5px 9px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .task-action.primary {
            background: #c9a227;
            border-color: #c9a227;
            color: #0f172a;
        }

        .task-action:hover {
            filter: brightness(1.1);
        }

        .task-source {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .task-owner {
            color: #c9a227;
            font-weight: 700;
        }

        .section-kpis {
            display: grid;
            grid-template-columns: repeat(4, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .kpi-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
        }

        .kpi-label {
            color: #94a3b8;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .kpi-value {
            color: #f8fafc;
            font-size: 28px;
            font-weight: 800;
            margin-top: 6px;
        }

        /* Contacts & Accounting Views */
        .data-table {
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
        }

        .table-header {
            display: grid;
            grid-template-columns: 2fr 1.5fr 1fr 1fr 1fr;
            padding: 16px 20px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
        }

        .table-row {
            display: grid;
            grid-template-columns: 2fr 1.5fr 1fr 1fr 1fr;
            padding: 16px 20px;
            border-bottom: 1px solid #334155;
            align-items: center;
            font-size: 13px;
        }

        .table-row:hover {
            background: #252f47;
        }

        .table-row:last-child {
            border-bottom: none;
        }

        .parent-name {
            font-weight: 600;
            color: #f8fafc;
        }

        .student-name {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .tag-list {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .tag {
            padding: 2px 6px;
            background: #334155;
            border-radius: 4px;
            font-size: 10px;
            color: #cbd5e1;
        }

        .tag.parent { background: #1e40af; }
        .tag.student { background: #065f46; }
        .tag.cash { background: #92400e; }

        /* Payment Status */
        .payment-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .payment-status.paid {
            background: #065f46;
            color: #86efac;
        }

        .payment-status.pending {
            background: #92400e;
            color: #fcd34d;
        }

        .payment-status.partial {
            background: #1e40af;
            color: #93c5fd;
        }

        .payment-status.needs_signup,
        .payment-status.needs_matching,
        .payment-status.open {
            background: #3730a3;
            color: #c4b5fd;
        }

        .accounting-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .accounting-header h2 {
            font-size: 20px;
            margin-bottom: 6px;
        }

        .accounting-header p {
            color: #94a3b8;
            font-size: 13px;
            max-width: 720px;
        }

        .accounting-summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .accounting-summary-card {
            border: 1px solid #334155;
            border-radius: 14px;
            background: #111827;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .accounting-summary-card strong {
            display: block;
            font-size: 24px;
            color: #f8fafc;
            line-height: 1;
        }

        .accounting-summary-label {
            display: block;
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 700;
            line-height: 1.2;
        }

        .accounting-summary-note {
            display: block;
            color: #94a3b8;
            font-size: 11px;
            line-height: 1.25;
        }

        .payment-roster .table-header,
        .payment-roster .table-row {
            grid-template-columns: minmax(180px, 1.2fr) minmax(170px, 1fr) minmax(130px, 0.8fr) minmax(120px, 0.7fr) minmax(110px, 0.65fr) minmax(120px, 0.7fr);
        }

        .payment-roster .table-row {
            align-items: center;
        }

        .payment-muted {
            color: #94a3b8;
            font-size: 12px;
            margin-top: 3px;
        }

        .mobile-field-label {
            display: none;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        @media (max-width: 900px) {
            .accounting-header {
                flex-direction: column;
            }

            .payment-roster .table-header {
                display: none;
            }

            .payment-roster .table-row {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .mobile-field-label {
                display: block;
            }
        }

        /* Telegram Input Notice */
        .ramble-box {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .ramble-input {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 14px;
            color: #e2e8f0;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
        }

        .ramble-input:focus {
            outline: none;
            border-color: #c9a227;
        }

        .ramble-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }

        .ramble-hint {
            font-size: 12px;
            color: #64748b;
        }

        .accountability-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
        }

        .accountability-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 18px;
        }

        .student-card,
        .event-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .event-type {
            color: #c9a227;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .event-title {
            margin-top: 4px;
            color: #f8fafc;
            font-weight: 600;
        }

        .event-meta {
            margin-top: 6px;
            color: #94a3b8;
            font-size: 12px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(160px, 1fr));
            gap: 14px;
            margin-bottom: 18px;
        }

        .summary-card {
            background: linear-gradient(145deg, #1e293b, #111827);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 14px;
        }

        .summary-label {
            color: #94a3b8;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .summary-value {
            color: #f8fafc;
            font-size: 24px;
            font-weight: 800;
            margin-top: 6px;
        }

        .summary-note {
            color: #64748b;
            font-size: 12px;
            margin-top: 4px;
        }

        .task-shell {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 18px;
            align-items: start;
        }

        .task-control-panel,
        .task-workspace {
            background: rgba(30, 41, 59, 0.92);
            border: 1px solid #334155;
            border-radius: 18px;
            box-shadow: 0 18px 50px rgba(2, 6, 23, 0.28);
        }

        .task-control-panel {
            padding: 18px;
            position: sticky;
            top: 128px;
        }

        .task-workspace {
            padding: 18px;
            min-width: 0;
        }

        .task-heading {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            align-items: flex-start;
            margin-bottom: 18px;
        }

        .task-heading h2 {
            color: #f8fafc;
            font-size: 24px;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .task-heading p,
        .task-panel-copy {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 6px;
        }

        .task-focus-grid {
            display: grid;
            gap: 8px;
            margin-top: 16px;
        }

        .task-filter {
            width: 100%;
            border: 1px solid #334155;
            background: #0f172a;
            color: #cbd5e1;
            border-radius: 12px;
            padding: 11px 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
            text-align: left;
            font-size: 13px;
            font-weight: 700;
        }

        .task-filter:hover,
        .task-filter.active {
            border-color: #c9a227;
            color: #f8fafc;
            background: rgba(201, 162, 39, 0.1);
        }

        .task-filter-count {
            background: #334155;
            border-radius: 999px;
            color: #f8fafc;
            padding: 2px 8px;
            font-size: 11px;
        }

        .task-signal {
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(201, 162, 39, 0.14), rgba(37, 99, 235, 0.1));
            border: 1px solid rgba(201, 162, 39, 0.25);
            padding: 14px;
            margin-top: 16px;
        }

        .task-signal strong {
            color: #f8fafc;
            display: block;
            font-size: 13px;
        }

        .task-signal span {
            color: #94a3b8;
            display: block;
            font-size: 12px;
            margin-top: 4px;
        }

        .task-list-section + .task-list-section {
            margin-top: 22px;
        }

        .task-section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 10px;
        }

        .task-section-header h3 {
            color: #f8fafc;
            font-size: 15px;
            letter-spacing: -0.01em;
        }

        .task-section-header span {
            color: #64748b;
            font-size: 12px;
        }

        .task-list {
            display: grid;
            gap: 10px;
        }

        .task-row {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 14px;
            cursor: pointer;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 14px;
            min-width: 0;
            transition: border-color 0.18s, transform 0.18s, background 0.18s;
        }

        .task-row:hover {
            border-color: #c9a227;
            background: #111c31;
            transform: translateY(-1px);
        }

        .task-row-title {
            color: #f8fafc;
            font-size: 14px;
            font-weight: 750;
            line-height: 1.35;
            overflow-wrap: anywhere;
        }

        .task-row-detail {
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.45;
            margin-top: 7px;
            max-width: 760px;
        }

        .task-row-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .task-row-actions {
            min-width: 170px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: stretch;
        }

        .task-row-actions .task-action {
            width: 100%;
            justify-content: center;
            padding: 8px 10px;
        }

        .task-empty {
            border: 1px dashed #334155;
            border-radius: 16px;
            padding: 28px;
            text-align: center;
            color: #64748b;
            background: rgba(15, 23, 42, 0.55);
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #cbd5e1;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .checkbox-row input {
            width: auto;
        }

        .task-comments {
            border-top: 1px solid #334155;
            margin-top: 18px;
            padding-top: 18px;
        }

        .comment-list {
            display: grid;
            gap: 10px;
            margin: 10px 0 12px;
        }

        .comment-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px 12px;
        }

        .comment-meta {
            color: #94a3b8;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .comment-body {
            color: #e2e8f0;
            font-size: 13px;
            white-space: pre-wrap;
        }

        .content-toolbar {
            background: rgba(30, 41, 59, 0.92);
            border: 1px solid #334155;
            border-radius: 18px;
            padding: 16px;
            margin: 16px 0;
            display: grid;
            gap: 14px;
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .filter-label {
            color: #94a3b8;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            min-width: 72px;
        }

        .filter-chip {
            border: 1px solid #334155;
            background: #0f172a;
            color: #cbd5e1;
            border-radius: 999px;
            padding: 8px 12px;
            cursor: pointer;

<body>
    <div id="app">
        <div class="loading">Loading BNA Operations...</div>
    </div>

    <script>
        // API Client
        const api = {
            async request(method, path, body) {
                const options = {
                    method,
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                };
                if (body) options.body = JSON.stringify(body);

                const response = await fetch('/api/bna' + path, options);
                if (response.status === 401) {
                    localStorage.removeItem('bna_ops_session');
                    window.location.href = '/operations-login.html';
                    return null;
                }
                const data = await response.json();
                if (!response.ok) {
                    const hint = data.hint ? `\n\n${data.hint}` : '';
                    throw new Error((data.error || `Request failed: ${response.status}`) + hint);
                }
                return data;
            },

            getTasks(filters = {}) {
                const params = new URLSearchParams();
                if (filters.stage) params.set('stage', filters.stage);
                if (filters.category) params.set('category', filters.category);
                if (filters.urgency) params.set('urgency', filters.urgency);
                if (filters.project) params.set('project', filters.project);
                return this.request('GET', '/tasks?' + params.toString());
            },

            getAuthMe() { return this.request('GET', '/auth/me'); },
            getProjects() { return this.request('GET', '/projects'); },
            createTask(task) { return this.request('POST', '/tasks', task); },
            createFromRamble(ramble) { return this.request('POST', '/tasks', { ramble, source: 'web', created_by: 'operator' }); },
            updateTask(id, task) { return this.request('PATCH', '/tasks/' + id, task); },
            moveTask(id, stage) { return this.request('PATCH', '/tasks/' + id, { stage }); },
            deleteTask(id) { return this.request('DELETE', '/tasks/' + id); },
            getTaskComments(id) { return this.request('GET', '/tasks/' + id + '/comments'); },
            addTaskComment(id, comment) { return this.request('POST', '/tasks/' + id + '/comments', comment); },

            getSignups(filters = {}) {
                const params = new URLSearchParams();
                if (filters.status) params.set('status', filters.status);
                if (filters.payment_status) params.set('payment_status', filters.payment_status);
                return this.request('GET', '/signups?' + params.toString());
            },

            createSignup(signup) { return this.request('POST', '/signups', signup); },
            updateSignup(id, updates) { return this.request('PATCH', '/signups/' + id, updates); },

            getPayments(filters = {}) {
                const params = new URLSearchParams();
                if (filters.signup_id) params.set('signup_id', filters.signup_id);
                return this.request('GET', '/payments?' + params.toString());
            },

            createPayment(payment) { return this.request('POST', '/payments', payment); },
            getPaymentReminderDue() { return this.request('GET', '/payment-reminders/due'); },
            runPaymentReminders(payload = {}) { return this.request('POST', '/payment-reminders/run', payload); },

            getPaymentIntake(filters = {}) {
                const params = new URLSearchParams();
                if (filters.status) params.set('status', filters.status);
                return this.request('GET', '/payment-intake?' + params.toString());
            },
            createPaymentIntake(intake) { return this.request('POST', '/payment-intake', intake); },
            updatePaymentIntake(id, intake) { return this.request('PATCH', '/payment-intake/' + id, intake); },

            getContentJobs(filters = {}) {
                const params = new URLSearchParams();
                if (filters.status) params.set('status', filters.status);
                return this.request('GET', '/content-jobs?' + params.toString());
            },
            createContentJob(job) { return this.request('POST', '/content-jobs', job); },
            updateContentJob(id, job) { return this.request('PATCH', '/content-jobs/' + id, job); },
            contentJobAction(id, action, payload = {}) { return this.request('POST', '/content-jobs/' + id + '/actions', { action, ...payload }); },
            parseMixedRecording(id, payload = {}) { return this.request('POST', '/content-jobs/' + id + '/parse-mixed-recording', payload); },
            updateContentOutput(id, output) { return this.request('PATCH', '/content-outputs/' + id, output); },
            contentOutputAction(id, action, payload = {}) { return this.request('POST', '/content-outputs/' + id + '/actions', { action, ...payload }); },
            getContentPrompts() { return this.request('GET', '/content-prompts'); },
            updateContentPrompt(platform, prompt) { return this.request('PATCH', '/content-prompts/' + platform, prompt); },
            addContentPromptExample(platform, example) { return this.request('POST', '/content-prompts/' + platform + '/examples', example); },
            getContentBundles() { return this.request('GET', '/content-bundles'); },
            createContentBundle(bundle) { return this.request('POST', '/content-bundles', bundle); },
            generateContentBundle(id, payload = {}) { return this.request('POST', '/content-bundles/' + id + '/generate', payload); },
            bulkGenerateContent(payload = {}) { return this.request('POST', '/content-jobs/bulk-generate', payload); },

            getStudents() { return this.request('GET', '/students'); },

            tasks.forEach((task) => {
                const column = taskColumn(task);
                if (!column) {
                    if (isHiddenCapture(task)) hiddenCaptures += 1;
                    return;
                }
                buckets[column].push(task);
            });

            Object.values(buckets).forEach((items) => {
                items.sort(sortTasks);
            });

            return { buckets, hiddenCaptures };
        }

        function buildPaymentRoster(activeSignups, openIntake) {
            const latestPaymentsBySignup = new Map();
            [...payments].sort((a, b) => new Date(b.received_at || b.created_at || 0) - new Date(a.received_at || a.created_at || 0))
                .forEach(payment => {
                    const signupId = payment.signup_id || payment.signup?.id;
                    if (signupId && !latestPaymentsBySignup.has(String(signupId))) {
                        latestPaymentsBySignup.set(String(signupId), payment);
                    }
                });

            const signupRows = activeSignups.map(signup => {
                const latestPayment = latestPaymentsBySignup.get(String(signup.id)) || {};
                const statusKey = normalizePaymentStatusKey(signup.payment_status);
                return {
                    source: 'signup',
                    sortName: `${signup.parent_name || ''} ${signup.student_name || ''}`.toLowerCase(),
                    parentName: signup.parent_name || 'Unknown parent',
                    studentName: signup.student_name || '',
                    email: signup.parent_email || '',
                    phone: signup.parent_phone || '',
                    amount: signup.payment_amount || latestPayment.amount || 1000,
                    method: signup.payment_method || latestPayment.method || '',
                    statusKey,
                    statusLabel: paymentStatusLabel(statusKey),
                    paidAt: signup.last_payment_at || signup.cash_received_at || latestPayment.received_at || latestPayment.created_at || (statusKey === 'paid' ? signup.updated_at : null),
                    nextDue: signup.payment_due_date || null,
                    nextDueLabel: signup.payment_due_date ? '' : 'No due date set',
                };
            });

            const intakeRows = openIntake.map(intake => ({
                source: 'intake',
                sortName: `${intake.parent_name || ''} ${intake.student_name || ''}`.toLowerCase(),
                parentName: intake.parent_name || 'Unknown parent',
                studentName: intake.student_name || '',
                email: intake.parent_email || '',
                phone: intake.parent_phone || '',
                amount: intake.amount || '',
                method: intake.method || '',
                statusKey: normalizePaymentStatusKey(intake.status),
                statusLabel: paymentStatusLabel(normalizePaymentStatusKey(intake.status)),
                paidAt: intake.received_at || intake.created_at || null,
                nextDue: null,
                nextDueLabel: 'Signup needed first',
            }));

            return [...signupRows, ...intakeRows].sort((a, b) => {
                const priority = { pending: 0, partial: 1, needs_signup: 2, needs_matching: 2, paid: 3 };
                const aPriority = priority[a.statusKey] ?? 2;
                const bPriority = priority[b.statusKey] ?? 2;
                if (aPriority !== bPriority) return aPriority - bPriority;
                return a.sortName.localeCompare(b.sortName);
            });
        }

        function normalizePaymentStatusKey(status) {
            const key = String(status || 'pending').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
            if (key === 'paid') return 'paid';
            if (key === 'partial') return 'partial';
            if (key === 'needs_signup') return 'needs_signup';
            if (key === 'needs_matching') return 'needs_matching';
            return 'pending';
        }

        function paymentStatusLabel(statusKey) {
            return ({
                paid: 'Paid',
                partial: 'Partial',
                needs_signup: 'Paid, needs signup',
                needs_matching: 'Paid, needs match',
                pending: 'Not paid',
            })[statusKey] || 'Open';
        }

            const studentsComplete = (torahSummary.students || []).filter(student => Number(student.percentage || 0) >= 100).length;
            return `
                <div class="student-profile-hero">
                    <div class="event-type">Torah Group Goal</div>
                    <h3>Group Torah Goal: ${groupProgress}%</h3>
                    <p style="color:#cbd5e1; font-size:13px; margin-top:6px;">
                        ${torahSummary.group?.tripUnlocked
                            ? 'Trip unlocked — everyone reached the full trip goal.'
                            : 'Trip locked — the group goal is not complete yet.'}
                    </p>
                    <div class="student-profile-kpis">
                        ${renderMiniKpi(`${groupProgress}%`, 'Group Progress')}
                        ${renderMiniKpi(`${studentsComplete}/${torahSummary.students.length || 0}`, 'Boys at 100%')}
                        ${renderMiniKpi(torahSummary.date || 'Today', 'Tracking Date')}
                        ${renderMiniKpi(torahSummary.group?.tripUnlocked ? 'Unlocked' : 'Locked', 'Trip')}
                    </div>
                    <div class="progress-track"><div class="progress-fill" style="--progress: ${groupProgress}%;"></div></div>
                    <div class="task-row-meta" style="margin-top: 12px;">
                        ${(torahSummary.students || []).length ? torahSummary.students.map(student => `
                            <span class="badge badge-category-accountability">
                                ${escapeHtml(student.name || 'Student')}: ${Number(student.percentage || 0)}%
                            </span>
                        `).join('') : '<span class="badge">No student progress recorded yet</span>'}
                    </div>
                </div>
            `;
        }

        function latestGroupGoalEntries(entries) {
            const byStudent = new Map();
            entries
                .slice()
                .sort((a, b) => Date.parse(b.recorded_date || b.created_at || 0) - Date.parse(a.recorded_date || a.created_at || 0))
                .forEach(entry => {
                    const key = entry.student_id ? `id:${entry.student_id}` : `name:${entry.student_name || 'unknown'}`;
                    if (!byStudent.has(key)) byStudent.set(key, entry);
                });
            return [...byStudent.values()].sort((a, b) => String(a.student_name || '').localeCompare(String(b.student_name || '')));
        }

        function renderStudentProfile(student) {
            const events = studentEvents(student);
            const questions = events.filter(event => event.event_type === 'question');
            const goals = events.filter(event => event.event_type === 'student_goal');
            const meetings = events.filter(event => ['private_meeting', 'decision', 'learning_note', 'class_session'].includes(event.event_type));
            const topics = uniqueValues(events.map(event => event.topic).filter(Boolean));
            const latest = events.slice().sort((a, b) => Date.parse(b.occurred_at || b.created_at || 0) - Date.parse(a.occurred_at || a.created_at || 0))[0];
            const progressPercent = studentProgressPercent(student, goals);
            const nextCheckIn = nextStudentCheckIn(events);
            const followUps = events.filter(event => event.follow_up_required);
            const torahRecord = torahStudentRecord(student);
            const torahPercent = Number(torahRecord?.percentage || 0);

            return `
                <div class="student-profile-hero">
                    <div class="event-type">Student Profile</div>
                    <h3>${escapeHtml(student.name)}</h3>
                    <p style="color: #cbd5e1; font-size: 13px; margin-top: 6px;">
                        Parent: ${escapeHtml(student.parent_name || 'Not linked yet')}
                        ${latest ? ` &middot; Latest note: ${formatDate(latest.occurred_at || latest.created_at)}` : ''}
                    </p>
                    <div class="student-profile-kpis">
                        ${renderMiniKpi(questions.length, 'Questions')}
                        ${renderMiniKpi(goals.length, 'Goals')}
                        ${renderMiniKpi(`${torahPercent}%`, 'Trip Progress')}
                        ${renderMiniKpi(followUps.length, 'Follow Ups')}
                    </div>
                </div>

                <div class="student-profile-grid">
                    <div class="student-profile-section full">
                        ${renderTorahAdminPanel(student, torahRecord)}
                    </div>

                    <div class="student-profile-section full">
                        ${renderStudentAccessPanel(student)}
                    </div>

                    <div class="student-profile-section">
                        <h4>Accountability Chart</h4>
                        <div class="event-meta">Weekly goal completion snapshot</div>
                        <div class="progress-track"><div class="progress-fill" style="--progress: ${progressPercent}%;"></div></div>
                        <p style="color:#94a3b8; font-size:12px; margin-top:8px;">
                            ${goals.length ? `${progressPercent}% average from tracked goal/progress notes.` : 'No active goals logged yet. Use Telegram to add a goal for this student.'}
                        </p>
                        ${nextCheckIn ? `<p style="color:#cbd5e1; font-size:12px; margin-top:6px;">Next check-in: ${formatDate(nextCheckIn)}</p>` : ''}
                    </div>

                    <div class="student-profile-section">
                        <h4>Interests / Topics</h4>
                        ${topics.length ? topics.slice(0, 10).map(topic => `<span class="badge badge-category-accountability" style="margin: 0 6px 6px 0; display:inline-block;">${escapeHtml(topic)}</span>`).join('') : '<p style="color:#64748b; font-size:13px;">No interests or topics captured yet.</p>'}
                    </div>

                    <div class="student-profile-section">
                        <h4>Questions</h4>
                        ${renderStudentEventList(questions, 'No questions captured yet.')}
                    </div>

                    <div class="student-profile-section">
                        <h4>Goals</h4>
                        ${renderStudentEventList(goals, 'No goals captured yet.')}
                    </div>

                    <div class="student-profile-section full">
                        <h4>Private Meetings / Notes</h4>
                        ${renderStudentEventList(meetings, 'No private meetings or notes captured yet.')}
                    </div>
                </div>
            `;
        }

        function torahStudentRecord(student) {
            return (torahSummary?.students || []).find(item => String(item.id) === String(student.id)) || null;
        }

        function studentPortalUrl(student) {
            if (!student?.student_access_code) return '';
            return `${window.location.origin}/student.html?code=${encodeURIComponent(student.student_access_code)}`;
        }

        function renderStudentAccessPanel(student) {
            const portalUrl = studentPortalUrl(student);
            return `
                <h4>Student Checkoff Login</h4>
                <div class="event-meta">Student-facing goal checkoff for non-private personal goals. This link only opens this student's own goals.</div>
                <div class="student-profile-kpis" style="margin-top:12px;">
                    ${renderMiniKpi(student.student_access_code ? 'Ready' : 'Not Created', 'Access Link')}
                    ${renderMiniKpi(student.student_access_enabled === false ? 'Disabled' : 'Enabled', 'Portal')}
                    ${renderMiniKpi('Student Goals', 'Scope')}
                </div>
                ${portalUrl ? `
                    <div class="event-card" style="margin-top:12px;">
                        <div class="event-type">Portal Link</div>
                        <div class="event-title" style="font-size:13px; word-break:break-all;">${escapeHtml(portalUrl)}</div>
                    </div>
                ` : ''}
                <div class="task-actions" style="margin-top:12px;">
                    ${portalUrl ? `<button class="task-action primary" onclick="openStudentPortal(event, ${Number(student.id)})">Open</button>` : ''}
                    <button class="task-action" onclick="createStudentAccessLink(event, ${Number(student.id)}, false)">${portalUrl ? 'Refresh Link' : 'Create Link'}</button>
                    <button class="task-action" onclick="createStudentAccessLink(event, ${Number(student.id)}, true)">Regenerate</button>
                </div>
            `;
        }

        function renderTorahAdminPanel(student, torahRecord) {

            const entry = torahRecord?.entry || {};
            const trip = torahRecord?.trip || {};
            const dateValue = entry.date || torahSummary?.date || new Date().toISOString().slice(0, 10);
            const goalMinutes = goal.goal_minutes ?? 10;
            const goalType = goal.goal_type || 'LISTENING';
            const listeningMinutes = entry.engaged_listening_minutes ?? 0;
            const insideMinutes = entry.inside_engaged_minutes ?? 0;
            const listeningWithoutFollowingMinutes = entry.listening_without_following_minutes ?? 0;
            const dailyCompletion = Number(entry.daily_completion_percentage ?? entry.individual_percentage ?? 0);
            const tripCompletedUnits = Number(entry.total_completed_units ?? trip.total_completed_units ?? 0);
            const tripRequiredUnits = Number(entry.total_required_units ?? trip.total_required_units ?? 30);

            return `
                <h4>Torah Goal Admin</h4>
                <div class="event-meta">These minutes and goal type stay admin-only. The public site shows only cumulative trip progress.</div>
                <div class="student-profile-kpis" style="margin-top:12px;">
                    ${renderMiniKpi(`${Number(torahRecord?.percentage || 0)}%`, 'Public Trip Progress')}
                    ${renderMiniKpi(`${dailyCompletion}%`, 'Daily Completion')}
                    ${renderMiniKpi(`${tripCompletedUnits}/${tripRequiredUnits}`, 'Trip Units')}
                    ${renderMiniKpi(`${goalMinutes} min`, 'Goal Minutes')}
                    ${renderMiniKpi(goalType, 'Goal Type')}
                    ${renderMiniKpi(entry.counted_minutes !== undefined ? `${Number(entry.counted_minutes || 0)} min` : '0 min', 'Counted')}
                </div>
                <div class="form-row" style="margin-top:16px;">
                    <div class="form-group">
                        <label for="torah-date-${student.id}">Date</label>
                        <input id="torah-date-${student.id}" type="date" value="${escapeHtml(dateValue)}">
                    </div>
                    <div class="form-group">
                        <label for="torah-goal-minutes-${student.id}">Goal Minutes</label>
                        <input id="torah-goal-minutes-${student.id}" type="number" min="1" step="1" value="${escapeHtml(String(goalMinutes))}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="torah-goal-type-${student.id}">Goal Type</label>
                        <select id="torah-goal-type-${student.id}">
                            <option value="LISTENING" ${goalType === 'LISTENING' ? 'selected' : ''}>LISTENING</option>
                            <option value="INSIDE" ${goalType === 'INSIDE' ? 'selected' : ''}>INSIDE</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="torah-listening-${student.id}">Engaged Listening Minutes</label>
                        <input id="torah-listening-${student.id}" type="number" min="0" step="0.5" value="${escapeHtml(String(listeningMinutes))}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="torah-inside-${student.id}">Inside Engaged Minutes</label>
                        <input id="torah-inside-${student.id}" type="number" min="0" step="0.5" value="${escapeHtml(String(insideMinutes))}">
                    </div>
                    <div class="form-group">
                        <label for="torah-listening-half-${student.id}">Listening Without Following Minutes</label>
                        <input id="torah-listening-half-${student.id}" type="number" min="0" step="0.5" value="${escapeHtml(String(listeningWithoutFollowingMinutes))}">
                    </div>
                </div>
                <div class="form-group">
                    <label for="torah-note-${student.id}">Note</label>
                    <textarea id="torah-note-${student.id}">${escapeHtml(entry.note || '')}</textarea>
                </div>
                <div class="task-actions" style="margin-top:0;">
                    <button class="task-action primary" onclick="saveTorahEntry(event, ${Number(student.id)})">Save / Update Torah Entry</button>
                </div>
            `;
        }

        function renderMiniKpi(value, label) {
            return `
                <div class="mini-kpi">
                    <strong>${escapeHtml(String(value))}</strong>
                    <span>${escapeHtml(label)}</span>
                </div>
            `;
        }

        function renderStudentEventList(events, emptyText) {
            const sorted = events
                .slice()
                .sort((a, b) => Date.parse(b.occurred_at || b.created_at || 0) - Date.parse(a.occurred_at || a.created_at || 0));
            if (!sorted.length) {
                return `<p style="color:#64748b; font-size:13px;">${escapeHtml(emptyText)}</p>`;
            }
            return sorted.slice(0, 12).map(event => `
                <div class="event-card">
                    <div class="event-type">${escapeHtml(formatEventType(event.event_type))}</div>
                    <div class="event-title">${escapeHtml(event.title || event.question_text || 'Student note')}</div>
                    <div class="event-meta">
                        ${event.topic ? `Topic: ${escapeHtml(event.topic)} &middot; ` : ''}
                        ${formatDate(event.occurred_at || event.created_at)}
                    </div>
                    ${renderStudentEventMetrics(event)}
                    ${renderGoalCheckoffActions(event)}
                    ${event.question_text ? `<p style="margin-top: 8px; font-size: 13px;">Question: ${escapeHtml(event.question_text)}</p>` : ''}
                    ${event.notes ? `<p style="margin-top: 8px; color: #cbd5e1; font-size: 13px;">${escapeHtml(event.notes)}</p>` : ''}
                </div>
            `).join('');
        }

        function renderGoalCheckoffActions(event) {
            if (event.event_type !== 'student_goal' || !event.id) return '';
            return `
                <div class="task-actions" style="margin-top:10px;">
                    <button class="task-action" onclick="setGoalProgress(event, ${Number(event.id)}, 0)">Not Yet</button>
                    <button class="task-action" onclick="setGoalProgress(event, ${Number(event.id)}, 50)">Half</button>
                    <button class="task-action primary" onclick="setGoalProgress(event, ${Number(event.id)}, 100)">Done</button>
                </div>
            `;
        }

        function renderStudentEventMetrics(event) {
            const metrics = [];
            if (event.progress_percent !== null && event.progress_percent !== undefined) metrics.push(`${event.progress_percent}% progress`);
            if (event.goal_actual_value || event.goal_target_value) {
                const actual = event.goal_actual_value || 0;
                const target = event.goal_target_value ? ` / ${event.goal_target_value}` : '';
                const unit = event.goal_unit ? ` ${event.goal_unit}` : '';
                metrics.push(`${actual}${target}${unit}`);
            }
            if (event.attendance_status) metrics.push(`Attendance: ${event.attendance_status}`);
            if (event.engagement_level) metrics.push(`Engagement: ${event.engagement_level}`);
            if (event.next_check_in_date) metrics.push(`Next: ${formatDate(event.next_check_in_date)}`);
            if (event.follow_up_required) metrics.push('Follow up');
            if (!metrics.length) return '';
            return `
                <div class="task-row-meta" style="margin-top: 8px;">
                    ${metrics.map(metric => `<span class="badge badge-category-accountability">${escapeHtml(metric)}</span>`).join('')}
                </div>
            `;
        }

        function studentProgressPercent(student, goals) {
            if (Number(student.avg_goal_progress)) return Number(student.avg_goal_progress);
            const values = goals
                .map(goal => Number(goal.progress_percent))
                .filter(value => Number.isFinite(value));
            if (values.length) {
                return Math.round(values.reduce((sum, value) => sum + value, 0) / values.length);
            }
            return goals.length ? Math.min(100, Math.round((goals.filter(goal => /done|met|completed|achieved/i.test(`${goal.title} ${goal.notes}`)).length / goals.length) * 100)) : 0;
        }

        function nextStudentCheckIn(events) {
            const dates = events
                .map(event => event.next_check_in_date)
                .filter(Boolean)
                .map(date => new Date(date))
                .filter(date => Number.isFinite(date.getTime()) && date >= new Date(new Date().toDateString()))
                .sort((a, b) => a - b);
            return dates[0] || null;
        }

        function studentEvents(student) {
            return accountabilityEvents.filter(event => {
                if (String(event.student_id || '') === String(student.id || '')) return true;
                const eventName = String(event.student_name || '').toLowerCase();
                const studentName = String(student.name || '').toLowerCase();
                return eventName && studentName && eventName === studentName;
            });
        }

        function uniqueValues(values) {
            return [...new Set(values.map(value => String(value || '').trim()).filter(Boolean))];
        }

        function renderTelegramInputNotice() {
            return `
                <div class="container">
                    <div class="ramble-box">
                        <h3 style="margin-bottom: 12px; font-size: 16px;">Telegram Input</h3>
                        <p style="margin-bottom: 0; font-size: 13px; color: #94a3b8;">
                            Send tasks, decisions, parent payment notes, and student meeting notes to @bneineviimacademy_bot. This dashboard only monitors what was captured.
                        </p>
                    </div>
                </div>
            `;
        }

                            </div>
                            <div class="form-group">
                                <label>Notes</label>
                                <textarea id="taskNotes" placeholder="Add details...">${escapeHtml(task.notes || '')}</textarea>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>Project</label>
                                    <select id="taskProject">
                                        ${availableProjects().map(project => `
                                            <option value="${escapeHtml(project.project_key)}" ${selectedProjectKey === project.project_key ? 'selected' : ''}>${escapeHtml(project.name || project.short_name || project.project_key)}</option>

                                    <label>Assigned To</label>
                                    <select id="taskAssignedTo">
                                        ${TASK_ASSIGNEES.map(person => `
                                            <option value="${escapeHtml(person.value)}" ${(task.assigned_to || '') === person.value ? 'selected' : ''}>${escapeHtml(person.label)}</option>
                                        `).join('')}
                                    </select>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Stage</label>
                                    <select id="taskStage">
                                        ${[
                                            { id: 'needs_decision', label: 'Needs Your Decision', marker: '?' },
                                            { id: 'assigned', label: 'Task', marker: 'DO' },
                                            { id: 'in_progress', label: 'Doing Now', marker: 'GO' },
                                            { id: 'done', label: 'Done', marker: 'OK' }

                                </div>

                                    <label>Category</label>
                                    <select id="taskCategory">

                                            <option value="${c.id}" ${task.category === c.id ? 'selected' : ''}>${c.label}</option>

                            <div class="form-row">
                                <div class="form-group">

                                    <label>Energy Required</label>
                                    <select id="taskEnergy">
                                        <option value="">--</option>

                                    </select>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Due Date</label>
                                    <input type="date" id="taskDueDate" value="${task.due_date || ''}">

                                <div class="form-group">
                                    <label>Est. Minutes</label>
                                    <input type="number" id="taskMinutes" value="${task.estimated_minutes || ''}" placeholder="e.g. 30">
